<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proof · Slides</title>
<link rel="stylesheet" href="proof.css">
<style>
  body { overflow: hidden; }
  .deck { display: flex; width: 100vw; height: 100svh; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .deck::-webkit-scrollbar { display: none; }
  .slide { flex: none; width: 100vw; height: 100svh; scroll-snap-align: start; overflow-y: auto; padding: clamp(40px, 7vh, 88px) var(--gutter) 120px; display: grid; }

  /* cover */
  .cover { align-content: center; justify-items: start; gap: 0; }
  .cover .headline { font-size: clamp(34px, 5vw, 72px); max-width: 16ch; }
  .cover .meta { margin-top: 20px; font-size: 16px; }
  .cover .strip { display: flex; gap: 32px; margin-top: 56px; align-items: flex-start; flex-wrap: wrap; }
  .cover .strip button { all: unset; cursor: pointer; display: grid; gap: 12px; width: var(--tw); }
  .cover .strip .t { font-size: 14px; line-height: 1.35; color: var(--muted); text-wrap: balance; }
  .cover .strip button:hover .t { color: var(--ink); }
  .cover .actions { margin-top: 56px; }

  /* a proof */
  .proof { grid-template-columns: minmax(260px, 380px) 1fr; gap: clamp(32px, 5vw, 80px); align-items: center; }
  .proof .text { display: grid; gap: 20px; align-content: center; }
  .proof .text .where { margin-top: 28px; }
  .pair.wide { flex-direction: column; align-items: center; gap: 20px; }
  .pair { display: flex; gap: clamp(16px, 2.5vw, 40px); justify-content: center; align-items: flex-start; }

  /* next */
  .last { align-content: center; justify-items: start; }
  .last .headline { max-width: 20ch; }
  .last .actions { margin-top: 56px; }

  .nav { position: fixed; right: var(--gutter); top: 24px; display: flex; align-items: center; gap: 8px; z-index: 20; }
  .nav .count { font-size: 14px; color: var(--faint); margin-right: 8px; font-variant-numeric: tabular-nums; }
  .nav button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 18px; cursor: pointer; }
  .nav button:disabled { opacity: .35; cursor: default; }

  @media (max-width: 760px) {
    .proof { grid-template-columns: 1fr; align-content: start; gap: 28px; }
    .proof .text { order: 2; gap: 16px; }
    .proof .text .where { margin-top: 12px; }
    .slide { padding-top: 84px; }
    .cover { align-content: start; }
    .cover .strip { gap: 20px; margin-top: 40px; }
    .cover .strip button { width: min(100%, calc(var(--tw) * .62)); }
    .pair.sq { flex-direction: column; align-items: stretch; gap: 20px; }
    .pair.sq .shot, .pair.wide .shot { width: 100% !important; }
    .nav { top: 16px; }
  }
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<div class="nav"><span class="count" id="count"></span><button id="prev" aria-label="Previous">←</button><button id="next" aria-label="Next">→</button></div>
<script src="data.js"></script>
<script src="proof.js"></script>
<script>
  const { set, esc, figure, locator, said, protoBar } = Proof;
  const deck = document.getElementById('deck');
  const isWide = (it) => it.w / it.h > 1.4;

  function pairWidth(it) {
    // keep both images inside the viewport height, never taller than the page
    const r = (it.w / it.h).toFixed(4);
    return isWide(it)
      ? `width:min(100%, calc((100svh - 300px) / 2 * ${r}))`
      : `width:min(${it.device === 'phone' ? 260 : 300}px, 42%, calc((100svh - 240px) * ${r}))`;
  }

  let html = `<section class="slide cover">
    <h1 class="headline">${esc(set.title)}</h1>
    <p class="meta">${esc(set.where)} · ${esc(set.when)}</p>
    <div class="strip">${set.items.map((it, i) => {
      const tw = Math.round(Math.min(260, 1000 / set.items.length / (it.w / it.h)) * it.w / it.h);
      return `<button data-go="${i + 1}" style="--tw:${tw}px">${figure(it, 'after', { caption: false, marks: false, small: true })}<span class="t">${esc(it.headline)}</span></button>`;
    }).join('')}</div>
    <div class="actions"><button class="btn solid" data-go="1">Walk me through it</button></div>
  </section>`;

  set.items.forEach((it) => {
    const wide = isWide(it);
    html += `<section class="slide proof">
      <div class="text">
        <h2 class="headline">${esc(it.headline)}</h2>
        ${said(it)}
        <p class="why">${esc(it.why)}</p>
        <div class="where">${locator(it)}</div>
      </div>
      <div class="pair ${wide ? 'wide' : ''} ${it.w / it.h > 0.9 ? 'sq' : ''}">
        ${figure(it, 'before', { style: pairWidth(it) })}
        ${figure(it, 'after', { style: pairWidth(it) })}
      </div>
    </section>`;
  });

  html += `<section class="slide last">
    <h2 class="headline">${esc(set.next)}</h2>
    <div class="actions"><a class="btn solid" href="${set.live}" target="_blank" rel="noopener">${esc(set.liveLabel)} ↗</a><a class="btn" href="#" onclick="return false">Change the plan</a></div>
  </section>`;
  deck.innerHTML = html;

  const slides = [...deck.children];
  const count = document.getElementById('count');
  const prev = document.getElementById('prev'), next = document.getElementById('next');
  let cur = 0;
  const go = (i) => { i = Math.max(0, Math.min(slides.length - 1, i)); deck.scrollTo({ left: i * deck.clientWidth, behavior: 'smooth' }); };
  const sync = () => {
    cur = Math.round(deck.scrollLeft / deck.clientWidth);
    count.textContent = `${cur + 1} / ${slides.length}`;
    prev.disabled = cur === 0; next.disabled = cur === slides.length - 1;
  };
  deck.addEventListener('scroll', () => requestAnimationFrame(sync), { passive: true });
  prev.onclick = () => go(cur - 1); next.onclick = () => go(cur + 1);
  deck.addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) go(+b.dataset.go); });
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(cur + 1); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1); }
  });
  sync();
  protoBar('slides');
</script>
</body>
</html>
