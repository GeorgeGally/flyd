<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proof · One page</title>
<link rel="stylesheet" href="proof.css">
<style>
  .page { max-width: 1320px; margin: 0 auto; padding: clamp(48px, 9vh, 104px) var(--gutter) 160px; }
  .intro { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px 48px; }
  .intro .headline { font-size: clamp(30px, 3.8vw, 52px); max-width: 20ch; }
  .intro .meta { margin-top: 14px; font-size: 16px; }

  .grid { margin-top: clamp(56px, 9vh, 96px); display: flex; flex-wrap: wrap; gap: 56px 40px; align-items: flex-start; }
  .grid { --th: clamp(240px, 34vh, 340px); }
  .tile { all: unset; cursor: zoom-in; display: grid; gap: 16px; align-content: start; width: max(200px, calc(var(--th) * var(--r))); flex: none; }
  .tile .swap { width: calc(var(--th) * var(--r)); max-width: 100%; }
  .tile .shot figcaption { display: none; }
  .tile .swap { position: relative; }
  .tile .swap .b { position: absolute; inset: 0; opacity: 0; transition: opacity .18s ease; }
  .tile.peek .swap .b { opacity: 1; }
  .tile .cap { display: grid; gap: 6px; }
  .tile .cap strong { font-size: 18px; line-height: 1.3; font-weight: 650; text-wrap: balance; }
  .tile .cap span { font-size: 14px; color: var(--faint); }

  .last { margin-top: clamp(80px, 12vh, 140px); display: grid; justify-items: start; }
  .last .next { font-size: clamp(18px, 1.6vw, 22px); max-width: 44ch; }
  .last .actions { margin-top: 44px; }

  /* lightbox: the full proof for one tile */
  dialog { border: 0; padding: 0; background: var(--bg); color: var(--ink); width: min(1200px, calc(100vw - 32px)); max-height: calc(100svh - 32px); border-radius: 18px; box-shadow: 0 40px 120px -20px rgba(0,0,0,.5); }
  dialog::backdrop { background: rgba(14, 15, 18, .55); backdrop-filter: blur(4px); }
  .lb { padding: clamp(28px, 4vw, 56px); display: grid; gap: 22px; }
  .lb .pair { display: flex; gap: 32px; justify-content: center; align-items: flex-start; margin-top: 12px; }
  .lb .close { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 18px; cursor: pointer; }
  .lb .where { margin-top: 8px; }
  @media (max-width: 760px) {
    .grid { gap: 48px; }
    .tile { width: min(100%, calc(60vh * var(--r))); }
    .tile .swap { width: 100%; }
    .lb .pair.wide { flex-direction: column; }
  }
</style>
</head>
<body>
<main class="page" id="page"></main>
<dialog id="lb"></dialog>
<script src="data.js"></script>
<script src="proof.js"></script>
<script>
  const { set, esc, figure, locator, said, protoBar } = Proof;
  const page = document.getElementById('page');
  const wide = (it) => it.w / it.h > 1;

  page.innerHTML = `<section class="intro"><div>
      <h1 class="headline">${esc(set.title)}</h1>
      <p class="meta">${esc(set.where)} · ${esc(set.when)}</p></div>
    </section>
    <section class="grid">${set.items.map((it, i) => `
      <button class="tile" data-i="${i}" style="--r:${(it.w / it.h).toFixed(4)}" aria-label="${esc(it.headline)}">
        <div class="swap">${figure(it, 'after', { caption: false, small: true })}<div class="b">${figure(it, 'before', { caption: false, small: true })}</div></div>
        <div class="cap"><strong>${esc(it.headline)}</strong><span>${esc(it.page)} · hold to see before</span></div>
      </button>`).join('')}
    </section>
    <section class="last">
      <p class="next">${esc(set.next)}</p>
      <div class="actions"><a class="btn solid" href="${set.live}" target="_blank" rel="noopener">${esc(set.liveLabel)} ↗</a><a class="btn" href="#" onclick="return false">Change the plan</a></div>
    </section>`;

  const lb = document.getElementById('lb');
  document.querySelectorAll('.tile').forEach((t) => {
    let timer = null, held = false;
    const peek = (on) => t.classList.toggle('peek', on);
    t.addEventListener('pointerdown', () => { held = false; timer = setTimeout(() => { held = true; peek(true); }, 180); });
    const end = () => { clearTimeout(timer); peek(false); };
    t.addEventListener('pointerup', end); t.addEventListener('pointerleave', end); t.addEventListener('pointercancel', end);
    t.addEventListener('contextmenu', (e) => e.preventDefault());
    t.addEventListener('click', () => { if (held) { held = false; return; } open(+t.dataset.i); });
  });
  function open(i) {
    const it = set.items[i];
    const w = wide(it);
    const r = (it.w / it.h).toFixed(4);
    const style = w ? `width:min(100%, calc((100svh - 380px) * ${r}))` : `width:min(${it.device === 'phone' ? 280 : 320}px, 44%, calc((100svh - 340px) * ${r}))`;
    lb.innerHTML = `<div class="lb"><button class="close" aria-label="Close">✕</button>
      <h2 class="headline">${esc(it.headline)}</h2>${said(it)}<p class="why">${esc(it.why)}</p>
      <div class="pair ${w ? 'wide' : ''}">${figure(it, 'before', { style })}${figure(it, 'after', { style })}</div>
      <div class="where">${locator(it)}</div></div>`;
    lb.querySelector('.close').onclick = () => lb.close();
    lb.showModal();
  }
  lb.addEventListener('click', (e) => { if (e.target === lb) lb.close(); });
  protoBar('sheet');
</script>
</body>
</html>
