<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>V1 · Title card</title>
<link rel="stylesheet" href="shared/frame.css">
<style>
/* V1 · Title card: the column reads like a TV title card — one word per tab, one thing per line, set big. */
:root { --col: 480px; }
.col { padding: 4px 32px 40px 8px; }
.tabs { margin: 0 0 28px; font: 700 30px/1.1 var(--sans); letter-spacing: -0.025em; }
.tabs button { padding: 0; border: 0; background: none; font: 700 30px/1.1 var(--sans); letter-spacing: -0.025em; color: #B9B5AD; cursor: pointer; }
.tabs button[aria-pressed="true"] { color: var(--ink); }
.tabs sup { font-size: 15px; font-weight: 700; color: var(--hot); margin-left: 3px; vertical-align: 14px; }
.lead { margin: 0 0 30px; padding: 26px 26px 28px; border-radius: 16px; background: var(--ink); color: #fff; }
.lead p { margin: 0 0 10px; font: 600 14px/1.3 var(--sans); color: #B9B5AD; }
.lead h2 { margin: 0; font: 700 28px/1.2 var(--sans); letter-spacing: -0.02em; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { padding: 18px 0; border-top: 1px solid var(--line); }
.list h3 { margin: 0 0 4px; font: 600 20px/1.32 var(--sans); letter-spacing: -0.01em; }
.sec { margin: 34px 0 12px; font: 700 15px var(--sans); color: var(--mute); }
.news li { padding: 14px 0; border-top: 1px solid var(--line); }
.news h3 { margin: 0 0 2px; font: 600 18px/1.35 var(--sans); }
.news span { color: var(--mute); font-size: 14px; }
.list span { color: var(--mute); font-size: 15px; }
.made figure, figure.made { margin: 0 0 28px; }
.made .pic, figure.made .pic { padding: 12px; border-radius: 16px; background: #DEDAD2; }
.made img, figure.made img { border-radius: 8px; aspect-ratio: 16 / 10; object-fit: cover; object-position: top; }
.made figcaption, figure.made figcaption { padding: 12px 4px 0; font: 700 21px/1.3 var(--sans); letter-spacing: -0.012em; }
.made figcaption span, figure.made figcaption span { display: block; font: 400 15px/1.4 var(--sans); color: var(--mute); letter-spacing: 0; }
@media (max-width: 760px) {
  .col { padding: 8px 16px 40px; }
  .tabs button { font-size: 26px; }
  .lead h2 { font-size: 24px; }
}
</style></head>
<body>
<aside class="col" id="col"></aside>
<script src="shared/data.js"></script>
<script src="shared/frame.js"></script>
<script>
var D = FLYD, c = document.getElementById("col");
c.innerHTML =
  '<h1 class="tabs">Needs you</h1>' +
  '<section data-pane="needs">' +
    '<div class="lead"><p>My advice</p><h2>' + esc(D.advice[0]) + '</h2></div>' +
    '<ul class="list">' + D.needs.map(function (n) { return '<li><h3>' + esc(n.q) + '</h3><span>' + n.who + ' · ' + n.when + '</span></li>'; }).join("") + '</ul>' +
    '<p class="sec">Made</p><figure class="made"><div class="pic"><img src="' + D.arts[0].img + '" alt=""></div><figcaption>' + esc(D.arts[0].t) + '<span>' + esc(D.arts[0].sub) + '</span></figcaption></figure>' +
    '<p class="sec">News</p><ul class="list news">' + D.news.map(function (n) { return '<li><h3>' + esc(n.t) + '</h3><span>' + n.mark + ' · ' + n.src + '</span></li>'; }).join("") + '</ul>' +
  '</section>';
</script>
</body></html>
