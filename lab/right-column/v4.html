<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>V4 · Wall label</title>
<link rel="stylesheet" href="shared/frame.css">
<style>
/* V4 · Wall label: one line of advice, the calls as bold lines, then the newest piece hung with its label, then the news. */
:root { --col: 520px; }
.col { padding: 0 32px 40px 8px; }
.quote { margin: 4px 0 30px; font: 700 26px/1.25 var(--sans); letter-spacing: -0.018em; }
.quote::before { content: "My advice"; display: block; margin-bottom: 8px; font: 600 14px var(--sans); color: var(--mute); letter-spacing: 0; }
.sec { margin: 0 0 4px; font: 600 14px var(--sans); color: var(--mute); }
.list { list-style: none; margin: 0 0 32px; padding: 0; }
.list li { padding: 18px 0; border-top: 1px solid var(--line); font: 700 19px/1.3 var(--sans); }
.list li span { display: block; margin-top: 7px; font: 400 14px var(--sans); color: var(--mute); }
.piece { margin: 0 0 14px; padding: 14px; border-radius: 18px; background: #DEDAD2; }
.piece img { border-radius: 8px; }
.label { margin: 0 0 32px; }
.label h2 { margin: 0 0 2px; font: 700 26px/1.15 var(--sans); letter-spacing: -0.02em; }
.label p { margin: 0; color: var(--ink2); font-size: 16px; }
.news li { font: 600 17px/1.35 var(--sans); }
@media (max-width: 760px) {
  .col { padding: 8px 16px 40px; }
  .quote { font-size: 22px; }
  .label h2 { font-size: 23px; }
}
</style></head>
<body>
<aside class="col" id="col"></aside>
<script src="shared/data.js"></script>
<script src="shared/frame.js"></script>
<script>
var D = FLYD, c = document.getElementById("col"), a = D.arts[0];
c.innerHTML =
  '<p class="quote">' + esc(D.advice[0]) + '</p>' +
  '<p class="sec">' + D.needs.length + ' calls wait on you</p>' +
  '<ul class="list">' + D.needs.map(function (n) { return '<li>' + esc(n.q) + '<span>' + n.who + ' · ' + n.when + '</span></li>'; }).join("") + '</ul>' +
  '<div class="piece"><img src="' + a.img + '" alt=""></div>' +
  '<div class="label"><h2>' + esc(a.t) + '</h2><p>' + esc(a.sub) + ' · ' + a.when + ' ago</p></div>' +
  '<p class="sec">News</p><ul class="list news">' + D.news.map(function (n) { return '<li>' + esc(n.t) + '<span>' + n.src + '</span></li>'; }).join("") + '</ul>';
</script>
</body></html>
