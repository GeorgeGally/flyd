<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>V2 · Four rooms</title>
<link rel="stylesheet" href="shared/frame.css">
<style>
/* V2 · Four rooms: the column is four big tiles — decide, advice, made, news — one thing each, set large. */
:root { --col: 520px; }
.col { padding: 0 28px 40px 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: start; }
.tile { border-radius: 18px; padding: 22px 22px 24px; background: var(--card); }
.tile > p { margin: 0 0 12px; font: 700 15px var(--sans); color: var(--mute); }
.decide { grid-column: 1 / -1; }
.decide h2 { margin: 0 0 14px; font: 700 30px/1.15 var(--sans); letter-spacing: -0.022em; }
.decide .more { font: 600 16px var(--sans); color: var(--ink2); }
.decide .more b { color: var(--hot); }
.advice { grid-column: 1 / -1; background: var(--ink); color: #fff; }
.advice > p { color: #B9B5AD; }
.advice h2 { margin: 0; font: 700 24px/1.25 var(--sans); letter-spacing: -0.016em; }
.made { padding: 12px; }
.made img { border-radius: 10px; }
.made h3 { margin: 12px 6px 2px; font: 700 18px/1.25 var(--sans); }
.made span { margin: 0 6px; font-size: 14px; color: var(--ink2); }
.news h3 { margin: 0 0 14px; font: 700 18px/1.3 var(--sans); }
.news li { margin: 0 0 12px; font: 600 16px/1.35 var(--sans); }
.news ul { list-style: none; margin: 0; padding: 0; }
@media (max-width: 760px) {
  .col { padding: 8px 12px 40px; gap: 10px; }
  .decide h2 { font-size: 26px; }
  .made h3, .news h3 { font-size: 16px; }
}
@media (max-width: 420px) { .col { grid-template-columns: 1fr; } }
</style></head>
<body>
<aside class="col" id="col"></aside>
<script src="shared/data.js"></script>
<script src="shared/frame.js"></script>
<script>
var D = FLYD, c = document.getElementById("col"), n = D.needs[0], a = D.arts[0];
c.innerHTML =
  '<section class="tile decide"><p>Your call · ' + n.who + '</p><h2>' + esc(n.q) + '</h2><span class="more"><b>' + (D.needs.length - 1) + ' more</b> wait on you</span></section>' +
  '<section class="tile advice"><p>My advice</p><h2>' + esc(D.advice[0]) + '</h2></section>' +
  '<section class="tile made"><img src="' + a.img + '" alt=""><h3>' + esc(a.t) + '</h3><span>' + a.when + ' ago</span></section>' +
  '<section class="tile news"><p>News</p><h3>' + esc(D.news[0].t) + '</h3><ul>' + D.news.slice(1).map(function (x) { return '<li>' + esc(x.t) + '</li>'; }).join("") + '</ul></section>';
</script>
</body></html>
