<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>V3 · Departure board</title>
<link rel="stylesheet" href="shared/frame.css">
<style>
/* V3 · Departure board: a dark board, full height, of what waits on him — who, what, when — readable from across the room. */
:root { --col: 520px; }
.col { top: 0; background: #121211; color: #F1EFEA; padding: 30px 32px 40px; }
.links { margin-right: calc(var(--col) + 4px); }
.advice { margin: 0 0 30px; }
.advice p { margin: 0 0 8px; font: 600 14px var(--sans); color: #8E8B83; }
.advice h2 { margin: 0; font: 700 27px/1.2 var(--sans); letter-spacing: -0.02em; }
.board p.head { margin: 0 0 4px; font: 600 14px var(--sans); color: #8E8B83; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 16px 0; border-top: 1px solid #2B2A27; }
.row .who { font: 600 14px/1.2 var(--sans); color: #8E8B83; }
.row .when { font: 600 14px/1.2 var(--sans); color: #8E8B83; font-variant-numeric: tabular-nums; text-align: right; }
.row h3 { grid-column: 1 / -1; margin: 0; font: 700 21px/1.3 var(--sans); letter-spacing: -0.012em; }
.made { margin: 30px 0; }
.made img { border-radius: 6px; }
.made figure { margin: 0; }
.made .pic { padding: 8px; border-radius: 12px; background: #2A2926; }
.made figcaption { padding-top: 10px; font: 700 19px var(--sans); }
.news li { padding: 12px 0; border-top: 1px solid #2B2A27; font: 600 17px/1.35 var(--sans); }
.news li span { display: block; font: 500 13px var(--sans); color: #8E8B83; }
.news { list-style: none; margin: 0; padding: 0; }
@media (max-width: 760px) {
  body { background: #121211; }
  .top { background: #121211; color: #F1EFEA; }
  .top .date { color: #8E8B83; }
  .col { padding: 20px 16px 40px; }
  .advice h2 { font-size: 23px; }
  .row h3 { font-size: 19px; }
}
</style></head>
<body>
<aside class="col" id="col"></aside>
<script src="shared/data.js"></script>
<script src="shared/frame.js"></script>
<script>
var D = FLYD, c = document.getElementById("col");
c.innerHTML =
  '<section class="advice"><p>My advice</p><h2>' + esc(D.advice[0]) + '</h2></section>' +
  '<section class="board"><p class="head">Waiting on you</p>' + D.needs.map(function (n) { return '<div class="row"><span class="who">' + n.who + '</span><span class="when">' + n.when + '</span><h3>' + esc(n.q) + '</h3></div>'; }).join("") + '</section>' +
  '<section class="made">' + D.arts.slice(0, 1).map(function (a) { return '<figure><div class="pic"><img src="' + a.img + '" alt=""></div><figcaption>' + esc(a.t) + '</figcaption></figure>'; }).join("") + '</section>' +
  '<ul class="news">' + D.news.map(function (n) { return '<li>' + esc(n.t) + '<span>' + n.src + '</span></li>'; }).join("") + '</ul>';
</script>
</body></html>
