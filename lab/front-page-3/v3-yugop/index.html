<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flyd · Jobs</title>
<style>
:root{
  --frame:#f3f3f1;
  --field:#0b0b0b;
  --surf:#131313;
  --surf-hi:#1c1c1c;
  --line:#272727;
  --ink:#f1f1ee;
  --mute:#9b9b96;
  --red:#ff3b1d;
  --dim:#55554f;
  --gut:14px;          /* white frame */
  --pad:28px;          /* field inset */
  --col-l:292px;
  --col-r:304px;
  --gap:36px;
  --fade:.42s;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--frame);
  color:var(--ink);
  font:15px/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  letter-spacing:0;
  overflow:hidden;
}
button,input{font:inherit;color:inherit;letter-spacing:0}
img{display:block}

.field{
  position:fixed;inset:var(--gut);
  background:var(--field);
  display:grid;
  grid-template-rows:auto 1fr;
  padding:0 var(--pad);
  overflow:hidden;
}

/* ---------- top line (tha: one sentence left, tiny nav right) ---------- */
.top{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:22px 0 20px;
  font-size:13px;line-height:1.3;
}
.top .say{color:var(--ink)}
.top .say b{font-weight:500}
.top .clock{color:var(--mute);font-variant-numeric:tabular-nums}

.cols{
  display:grid;
  grid-template-columns:var(--col-l) minmax(0,1fr) var(--col-r);
  column-gap:var(--gap);
  min-height:0;
}
.col{min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:28px}
.col::-webkit-scrollbar{display:none}

/* ---------- labels ---------- */
.lab{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:12px;line-height:1;color:#b9b9b4;
  padding:4px 0 11px;
  font-variant-numeric:tabular-nums;
}
.lab{justify-content:flex-start;gap:8px}
.lab .n{color:var(--dim)}
.group + .group{margin-top:22px}

/* ---------- cards: a still text layer over a moving surface ---------- */
.card{
  position:relative;
  display:block;width:100%;text-align:left;
  background:none;border:0;cursor:pointer;
  margin-bottom:8px;
  isolation:isolate;
  display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;
}
.card:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.surf{
  position:absolute;inset:0;z-index:-1;
  background:var(--surf);
  overflow:hidden;
  will-change:transform;
  transform-origin:50% 60%;
}
.surf .im{position:absolute;left:0;top:0;width:100%;overflow:hidden;background:#fff}
.surf .im.dark{background:#000}
.surf .im img{width:100%;height:auto}
.card:hover .surf{background:var(--surf-hi)}
.txt{position:relative;transition:opacity var(--fade) ease}
.pre .txt{opacity:0}

/* job card */
.job .ph,.job .surf .im{aspect-ratio:16/9}
.job .t{padding:11px 12px 12px}
.job .meta{display:flex;align-items:center;gap:7px;font-size:11px;line-height:1.2;color:var(--mute)}
.job .meta .when{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
.job .ti{font-size:15px;line-height:1.3;margin-top:6px;color:var(--ink)}
.job.done .ti{color:#c9c9c4}
.job.small .t{padding:10px 12px 11px}

/* lifted: the card's surface is in the centre; its slot keeps an outline */
.job.lifted::before{
  content:"";position:absolute;inset:0;z-index:-2;
  border:1px solid #3a3a37;
}
.job.lifted .txt{opacity:0}
.job.lifted::after{content:"Open in the centre";position:absolute;left:12px;bottom:12px;font-size:11px;line-height:1;color:var(--dim)}
.job.lifted .surf{opacity:.1!important;filter:grayscale(1);background:transparent}

/* marks: square = needs you, dial = working, rule = done */
.mk{flex:none;width:9px;height:9px;position:relative}
.mk.sq{background:var(--red)}
.mk.rule{height:1px;width:9px;background:var(--mute)}
.dial{flex:none;position:relative;width:11px;height:11px;border:1px solid #6c6c67;border-radius:50%}
.dial i{position:absolute;left:50%;top:50%;width:0;height:0}
.dial i::after{content:"";position:absolute;left:-1.5px;top:-6.5px;width:3px;height:3px;border-radius:50%;background:var(--ink)}
.dial.on i{animation:orbit var(--orbit,11.6s) linear infinite}
.dial.still{border-color:var(--dim)}
.dial.still i::after{background:var(--dim)}
@keyframes orbit{to{transform:rotate(360deg)}}

/* ---------- centre ---------- */
.centre{display:grid;grid-template-rows:auto 1fr;min-height:0;padding-bottom:28px}
.head{padding:4px 0 18px;min-height:0}
.head .meta{display:flex;gap:7px;align-items:center;font-size:11px;line-height:1;color:var(--mute)}
.head .meta .sep{color:var(--dim)}
.head h1{font-size:30px;line-height:1.18;font-weight:400;margin-top:12px;max-width:24em}
.body{display:grid;grid-template-columns:minmax(0,1fr) 264px;column-gap:28px;min-height:0}
.stagecol{display:grid;grid-template-rows:1fr auto;min-height:0}
.stage{position:relative;min-height:0;background:#fff;overflow:hidden}
.stage.surface{background:var(--surf)}
.stage.black{background:#000}
.stage .scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#bbb transparent}
.stage .scroll img{width:100%;height:auto;transition:opacity .32s ease}
.stage .shown{transition:opacity .28s ease}
.stage.wait .shown{opacity:0}

.big{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:22px}
.bigdial{position:relative;width:min(56%,220px);aspect-ratio:1;border:1px solid #3d3d39;border-radius:50%}
.bigdial::before{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:var(--mute)}
.bigdial i{position:absolute;left:50%;top:50%;width:0;height:0}
.bigdial i b{position:absolute;left:-.5px;bottom:0;width:1px;height:calc(var(--r) - 10px);background:#4a4a46}
.bigdial i::after{content:"";position:absolute;left:-4px;top:calc(-1 * var(--r) - 4px);width:8px;height:8px;border-radius:50%;background:var(--ink)}
.bigdial.on i{animation:orbit var(--orbit,11.6s) linear infinite}
.bigdial.done{border-color:#3d3d39}
.bigdial.done i::after{background:var(--mute)}
.bigdial.wait i::after{background:var(--dim)}
.bigdial.sq i{display:none}
.bigdial.sq::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;background:var(--red)}
.bigdial.sq::before{display:none}
.ticks{position:absolute;inset:0}
.ticks s{position:absolute;left:50%;top:0;width:1px;height:6px;margin-left:-.5px;background:#4a4a46;transform-origin:50% calc(var(--r));}
.ticks s.q{height:11px;background:#77776f}
.big .st{font-size:15px;color:var(--mute);text-align:center}
.big .st b{display:block;font-weight:400;color:var(--ink);font-size:22px;line-height:1.25}

.under{padding-top:14px}
.vrow{position:relative;overflow:hidden;height:74px;touch-action:pan-y;cursor:grab;margin-bottom:12px}
.vrow:active{cursor:grabbing}
.vtrack{position:absolute;left:0;top:0;display:flex;gap:8px;will-change:transform}
.vcard{position:relative;width:96px;height:74px;border:0;background:none;cursor:inherit;isolation:isolate}
.vcard .surf{background:#fff}
.vcard .surf .im{height:56px}
.vcard .vl{position:absolute;left:0;right:0;bottom:0;height:18px;display:flex;align-items:flex-end;justify-content:flex-start;gap:6px;font-size:11px;line-height:1;color:var(--mute)}
.vcard .vl .pk{width:6px;height:6px;margin-bottom:2px}
.vcard.sel .surf{outline:2px solid var(--ink);outline-offset:2px}
.vcard.sel .vl{color:var(--ink)}
.vcard .surf{bottom:18px}
.vlabel{font-size:15px;line-height:1.45;color:#d9d9d4;min-height:44px;transition:opacity .28s ease}
.vlabel .nm{color:var(--ink)}
.acts{display:flex;gap:8px;margin-top:14px}
.btn{height:32px;padding:0 14px;font-size:14px;border:1px solid #4a4a46;background:transparent;color:var(--ink);cursor:pointer}
.btn:hover{background:#1d1d1b}
.btn.p{background:var(--ink);color:#0b0b0b;border-color:var(--ink)}
.btn.p:hover{background:#fff}

.thread{display:grid;grid-template-rows:auto 1fr auto;min-height:0}
.thread .lab{padding-top:0}
.msgs{overflow-y:auto;scrollbar-width:none;min-height:0;display:flex;flex-direction:column;gap:18px;padding-bottom:16px}
.msgs::-webkit-scrollbar{display:none}
.msg .w{font-size:11px;line-height:1;color:var(--mute);margin-bottom:7px;font-variant-numeric:tabular-nums}
.msg p{font-size:15px;line-height:1.48;color:#cfcfca}
.msg.you p{color:var(--mute)}
.box{display:flex;border:1px solid #3a3a37;height:40px}
.box input{flex:1;min-width:0;background:transparent;border:0;outline:0;padding:0 12px;font-size:15px}
.box input::placeholder{color:var(--dim)}
.box button{border:0;background:transparent;color:var(--mute);padding:0 12px;font-size:14px;cursor:pointer}
.box:focus-within{border-color:#77776f}

.fade{transition:opacity var(--fade) ease}
.fade.out{opacity:0;transition-duration:.16s}

/* ---------- artefacts ---------- */
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.art{margin:0;cursor:default}
.art.wide{grid-column:1 / -1}
.art .ph,.art .surf .im{aspect-ratio:1/1}
.art.wide .ph,.art.wide .surf .im{aspect-ratio:16/10}
.art .surf .im img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.art.design .surf .im img{object-position:50% 0}
.art .t{padding:9px 10px 11px}
.art .src{font-size:11px;line-height:1.2;color:var(--mute)}
.art .ti{font-size:15px;line-height:1.3;margin-top:5px}
.art .ex{font-size:15px;line-height:1.45;color:#bdbdb8;margin-top:6px}
.art.info .t{padding:14px 12px 15px}
.art.info .ti{font-size:15px}
.art.info .surf{background:transparent;border:1px solid #33332f}

/* ghost: the surface in transit */
.ghost{position:fixed;left:0;top:0;z-index:50;overflow:hidden;background:var(--surf);pointer-events:none;will-change:transform,width,height}
.ghost img{width:100%;height:auto}
.ghost.white{background:#fff}

@media (prefers-reduced-motion: reduce){
  .dial.on i,.bigdial.on i{animation:none}
  .txt,.fade,.vlabel{transition:none}
}

/* ---------- phone ---------- */
@media (max-width:760px){
  :root{--gut:8px;--pad:16px}
  body{overflow:auto}
  .field{position:relative;inset:auto;margin:var(--gut);min-height:calc(100vh - 16px);display:block;overflow:visible}
  .top{flex-direction:column;gap:6px;padding:18px 0}
  .cols{display:flex;flex-direction:column}
  .col{overflow:visible;padding-bottom:0}
  .jobs{order:1;padding-bottom:28px}
  .centre{order:2;padding-bottom:36px}
  .arts{order:3;padding:32px 0 24px}
  .group .list{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;scroll-padding-inline:var(--pad);margin:0 calc(-1 * var(--pad));padding:0 var(--pad)}
  .group .list::-webkit-scrollbar{display:none}
  .group .list .card{flex:none;width:72%;scroll-snap-align:start;margin-bottom:0}
  .group .list .card.lifted{display:none}
  .body{display:block}
  .stagecol{display:block}
  .stage{height:62vh}
  .stage.surface,.stage.black{height:auto;aspect-ratio:1}
  .stage.black{aspect-ratio:16/9}
  .thread{display:block;margin-top:28px}
  .msgs{overflow:visible}
  .head h1{font-size:20px}
}
</style>
</head>
<body>
<div class="field">
  <div class="top">
    <div class="say" id="say"></div>
    <div class="clock" id="clock"></div>
  </div>
  <div class="cols">
    <aside class="col jobs" id="jobs" aria-label="Jobs"></aside>
    <main class="centre" id="centre" aria-live="polite">
      <div class="head fade" id="head"></div>
      <div class="body">
        <div class="stagecol">
          <div class="stage" id="stage"></div>
          <div class="under fade" id="under"></div>
        </div>
        <div class="thread">
          <div class="lab"><span>Conversation</span></div>
          <div class="msgs fade" id="msgs"></div>
          <form class="box" id="box" autocomplete="off">
            <input id="inp" placeholder="Message Flyd" aria-label="Message Flyd about this job">
            <button type="submit">Send</button>
          </form>
        </div>
      </div>
    </main>
    <aside class="col arts" id="arts" aria-label="Artefacts"></aside>
  </div>
</div>

<script src="../shared/data.js"></script>
<script>
(function(){
"use strict";
const D = window.FLYD, A = p => "../shared/" + p;
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* constants derived once from the version seed */
const K = 171, ZETA = .62, C = 2*ZETA*Math.sqrt(K);       // card spring
const KG = 132, CG = 2*.78*Math.sqrt(KG);                   // travelling surface
const ORBIT = 11.6;                                          // seconds per turn
let rs = 0x6b03e8f1;
const rnd = () => { rs ^= rs << 13; rs ^= rs >>> 17; rs ^= rs << 5; return ((rs >>> 0) % 10000) / 10000; };
document.documentElement.style.setProperty("--orbit", ORBIT + "s");

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);

/* ---------------- springs ---------------- */
class S { constructor(v){ this.x=v; this.v=0; this.t=v; }
  step(dt,k,c){ const a=-k*(this.x-this.t)-c*this.v; this.v+=a*dt; this.x+=this.v*dt; }
  rest(){ return Math.abs(this.x-this.t)<.005 && Math.abs(this.v)<.005; }
  snap(){ this.x=this.t; this.v=0; } }

const bodies = new Set();
class Body {
  constructor(el){ this.el=el; this.x=new S(0); this.y=new S(0); this.r=new S(0); this.s=new S(1); this.o=1;
    this.lx=0; this.ly=0; this.lr=0; bodies.add(this); }
  springs(){ return [this.x,this.y,this.r,this.s]; }
  apply(){ this.el.style.transform = `translate3d(${(this.x.x).toFixed(2)}px,${(this.y.x).toFixed(2)}px,0) rotate(${this.r.x.toFixed(3)}deg) scale(${this.s.x.toFixed(4)})`; }
  aim(){ this.x.t=this.lx; this.y.t=this.ly; this.r.t=this.lr; this.s.t=1; }
}
let running=false, last=0;
const ghosts = new Set();
function kick(){ if(!running){ running=true; last=performance.now(); requestAnimationFrame(tick); } }
function tick(now){
  let dt=Math.min(.05,(now-last)/1000); last=now;
  const n=Math.ceil(dt/(1/240)), h=dt/n; let busy=false;
  for(const b of bodies){
    if(b.hold && now<b.hold){ busy=true; continue; }
    let moving=false;
    for(const s of b.springs()){ for(let i=0;i<n;i++) s.step(h,K,C); if(!s.rest()) moving=true; else s.snap(); }
    b.apply(); if(moving) busy=true; else if(b.onRest){ const f=b.onRest; b.onRest=null; f(); }
  }
  for(const g of ghosts){ if(g.step(n,h)) busy=true; }
  if(busy) requestAnimationFrame(tick); else running=false;
}

/* ---------------- render ---------------- */
const groups = [["needs","Needs you"],["working","Working"],["done","Done"]];
const byId = {}; D.jobs.forEach(j => byId[j.id]=j);

function mark(j){
  if(j.group==="needs") return `<span class="mk sq"></span>`;
  if(j.group==="working"){ const on = j.state!=="Queued";
    return `<span class="dial ${on?"on":"still"}"><i style="animation-delay:-${(rnd()*ORBIT).toFixed(2)}s"></i></span>`; }
  return `<span class="mk rule"></span>`;
}
function imgBox(src, dark){ return `<div class="im${dark?" dark":""}"><img src="${A(src)}" alt="" draggable="false"></div>`; }

const cardEls = {};
function renderJobs(){
  const root=$("jobs"); let h="";
  for(const [g,name] of groups){
    const js=D.jobs.filter(j=>j.group===g);
    h+=`<section class="group"><div class="lab"><span>${name}</span><span class="n">${js.length}</span></div><div class="list">`;
    for(const j of js){
      const img = j.thumb && g!=="done";
      h+=`<button class="card job pre ${g}${img?"":" small"}" data-id="${j.id}" aria-label="${esc(j.title)}">
        <div class="surf">${img?imgBox(j.thumb, j.id==="dir-ident"):""}</div>
        ${img?`<div class="ph"></div>`:""}
        <div class="txt t"><div class="meta">${mark(j)}<span>${esc(j.project)} · ${esc(j.state)}</span><span class="when">${esc(j.when)}</span></div>
        <div class="ti">${esc(j.title)}</div></div></button>`;
    }
    h+=`</div></section>`;
  }
  root.innerHTML=h;
  root.querySelectorAll(".card").forEach(el=>{ cardEls[el.dataset.id]=el; el.addEventListener("click",()=>select(el.dataset.id)); });
}

function renderArts(){
  const root=$("arts"); let h=`<div class="lab"><span>Artefacts</span><span class="n">${D.artefacts.length}</span></div><div class="agrid">`;
  D.artefacts.forEach((a,i)=>{
    const wide = i===0 || a.kind==="info" || i===4;
    h+=`<article class="card art pre ${a.kind}${wide?" wide":""}">
      <div class="surf">${a.img?imgBox(a.img):""}</div>${a.img?`<div class="ph"></div>`:""}
      <div class="txt t"><div class="src">${esc(a.meta)}</div><div class="ti">${esc(a.title)}</div>${(wide && a.text)?`<div class="ex">${esc(a.text)}</div>`:""}</div></article>`;
  });
  root.innerHTML=h+`</div>`;
}

function renderSay(){
  const c = g => D.jobs.filter(j=>j.group===g).length;
  const w = ["zero","one","two","three","four","five","six","seven","eight","nine","ten"];
  $("say").innerHTML = `<b>Flyd</b> is keeping ${w[D.jobs.length]||D.jobs.length} jobs for you: ${w[c("needs")]} need you, ${w[c("working")]} are working, ${w[c("done")]} are done.`;
  const tickClock=()=>{ const d=new Date(); $("clock").textContent = d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})+"  "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit"}); };
  tickClock(); setInterval(tickClock,1000);
}

/* ---------------- settle on load ---------------- */
function settle(){
  const els=[...document.querySelectorAll(".card.pre")];
  els.forEach((el,i)=>{
    const surf=el.querySelector(".surf"), b=new Body(surf); el._b=b;
    if(RM){ el.classList.remove("pre"); return; }
    b.x.x=(rnd()-.5)*36; b.y.x=26+rnd()*70; b.r.x=(rnd()-.5)*7; b.s.x=.94;
    b.apply(); surf.style.opacity="0";
    const delay = 120 + i*34;
    b.hold = performance.now()+delay;
    setTimeout(()=>{ surf.style.transition="opacity .25s ease"; surf.style.opacity=""; },delay);
    setTimeout(()=>el.classList.remove("pre"), delay+380);
  });
  kick();
}

/* ---------------- lean toward the cursor ---------------- */
let rects=[]; const measure=()=>{ rects=[...document.querySelectorAll(".card")].filter(e=>e._b).map(e=>[e,e.getBoundingClientRect()]); };
addEventListener("resize",measure); document.querySelectorAll(".col").forEach(c=>c.addEventListener("scroll",measure,{passive:true}));
addEventListener("pointermove",e=>{
  if(RM||e.pointerType==="touch") return;
  for(const [el,r] of rects){
    const cx=r.left+r.width/2, cy=r.top+r.height/2, dx=e.clientX-cx, dy=e.clientY-cy;
    const d=Math.hypot(dx,dy), f=Math.exp(-d/230), b=el._b;
    b.lx=Math.max(-3,Math.min(3,dx*.03))*f; b.ly=Math.max(-3,Math.min(3,dy*.03))*f;
    b.lr=Math.max(-.7,Math.min(.7,dx*.004))*f*(dy<0?-1:1);
    b.aim();
  }
  kick();
},{passive:true});
document.addEventListener("pointerleave",()=>{ for(const [el] of rects){ const b=el._b; b.lx=b.ly=b.lr=0; b.aim(); } kick(); });

/* ---------------- the travelling surface (FLIP + spring) ---------------- */
function travel(from, to, html, white, done){
  if(RM || !from.width || !to.width){ done&&done(); return; }
  const g=document.createElement("div"); g.className="ghost"+(white?" white":""); g.innerHTML=html; document.body.appendChild(g);
  const sp={x:new S(from.left),y:new S(from.top),w:new S(from.width),h:new S(from.height)};
  sp.x.t=to.left; sp.y.t=to.top; sp.w.t=to.width; sp.h.t=to.height;
  const put=()=>{ g.style.transform=`translate3d(${sp.x.x}px,${sp.y.x}px,0)`; g.style.width=sp.w.x+"px"; g.style.height=sp.h.x+"px"; };
  put();
  const o={ step(n,h){ let m=false; for(const s of Object.values(sp)){ for(let i=0;i<n;i++) s.step(h,KG,CG); if(!s.rest()) m=true; else s.snap(); } put();
      if(!m){ ghosts.delete(o); done&&done(); g.style.transition="opacity .24s ease"; g.style.opacity="0"; setTimeout(()=>g.remove(),260); } return m; } };
  ghosts.add(o); kick();
}
function surfHTML(j){
  if(j.thumb) return `<img src="${A(j.thumb)}" alt="">`;
  return "";
}

/* ---------------- centre ---------------- */
let active=null, vIndex=0, vb=null;
function select(id, first){
  if(id===active && !first) return;
  const j=byId[id], prev=active?byId[active]:null, prevEl=active?cardEls[active]:null, el=cardEls[id];
  const stage=$("stage");
  const sr=stage.getBoundingClientRect();

  // the old surface flies home
  if(prev && prevEl){
    const hr=prevEl.getBoundingClientRect();
    travel(sr, hr, surfHTML(prev), !!prev.thumb && prev.id!=="dir-ident", ()=>prevEl.classList.remove("lifted"));
    if(RM) prevEl.classList.remove("lifted");
  }
  active=id;
  // text fades out, swaps, fades in place
  const parts=[$("head"),$("under"),$("msgs")];
  parts.forEach(p=>p.classList.add("out"));
  stage.classList.add("wait");
  const swap=()=>{
    fill(j);
    parts.forEach(p=>p.classList.remove("out"));
  };
  if(first||RM) swap(); else setTimeout(swap,170);
  if(!first && innerWidth<=760) $("centre").scrollIntoView({behavior:RM?"auto":"smooth",block:"start"});

  // the new surface flies out
  const cr=el.getBoundingClientRect();
  el.classList.add("lifted");
  if(first){ stage.classList.remove("wait"); return; }
  travel(cr, $("stage").getBoundingClientRect(), surfHTML(j), !!j.thumb && j.id!=="dir-ident", ()=>stage.classList.remove("wait"));
  if(RM) stage.classList.remove("wait");
}

function fill(j){
  $("head").innerHTML=`<div class="meta">${mark(j)}<span>${esc(j.project)}</span><span class="sep">·</span><span>${esc(j.state)}</span><span class="sep">·</span><span>${esc(j.when)}</span>${j.link?`<span class="sep">·</span><span>${esc(j.link)}</span>`:""}</div><h1>${esc(j.title)}</h1>`;
  const stage=$("stage"), shots=j.shots||[];
  stage.className="stage"+(stage.classList.contains("wait")?" wait":"");
  if(shots.length){
    vIndex = typeof j.pick==="number" ? j.pick : 0;
    if(j.id==="dir-ident") stage.classList.add("black");
    stage.innerHTML=`<div class="scroll shown"><img id="shot" src="${A(shots[vIndex])}" alt="${esc(j.title)}"></div>`;
  } else {
    stage.classList.add("surface");
    const kind = j.group==="working" ? (j.state==="Queued"?"wait":"on") : j.group==="done" ? "done" : "sq";
    stage.innerHTML=`<div class="big shown"><div class="bigdial ${kind}" style="--r:${0}px"><div class="ticks">${Array.from({length:60},(_,k)=>`<s class="${k%15?"":"q"}" style="transform:rotate(${k*6}deg)"></s>`).join("")}</div><i style="animation-delay:-${(rnd()*ORBIT).toFixed(2)}s"><b></b></i></div>
      <div class="st"><b>${esc(j.state)}</b>${esc(j.group==="working"?(/min|:/.test(j.when)?"For "+j.when:j.when):j.when)}</div></div>`;
    const dial=stage.querySelector(".bigdial"); requestAnimationFrame(()=>dial.style.setProperty("--r",(dial.offsetWidth/2)+"px"));
  }
  // under the stage: versions, label, actions
  let u="";
  if(shots.length>1){
    u+=`<div class="vrow" id="vrow"><div class="vtrack" id="vtrack">${shots.map((s,i)=>`<button class="vcard${i===vIndex?" sel":""}" data-i="${i}" aria-label="Version ${i+1}"><div class="surf"><div class="im"><img src="${A(s)}" alt="" draggable="false"></div></div><div class="vl"><span>V${i+1}</span>${i===j.pick?`<span class="mk sq pk" title="Flyd's pick"></span>`:""}</div></button>`).join("")}</div></div>`;
    u+=`<div class="vlabel" id="vlabel"></div>`;
  }
  u+=`<div class="acts">${(j.actions||[]).map((a,i)=>`<button class="btn${i===0?" p":""}">${esc(a)}</button>`).join("")}</div>`;
  $("under").innerHTML=u;
  if(shots.length>1){ setLabel(j); flick(j); }
  $("msgs").innerHTML=j.thread.map(m=>`<div class="msg ${m.who}"><div class="w">${m.who==="you"?"You":"Flyd"} · ${esc(m.at)}</div><p>${esc(m.text)}</p></div>`).join("");
  $("msgs").scrollTop=1e5;
}
function setLabel(j){
  const L=(j.shotLabels||[])[vIndex]||""; const m=L.match(/^(V\d+ · [^.]+)\.\s*(.*)$/);
  $("vlabel").innerHTML = m ? `<span class="nm">${esc(m[1])}.</span> ${vIndex===j.pick?"Flyd's pick. ":""}${esc(m[2])}` : esc(L);
}

/* ---------------- versions: a row you flick with inertia ---------------- */
function flick(j){
  const row=$("vrow"), tr=$("vtrack"), cards=[...tr.children];
  const pos=new S(0); let dragging=false, sx=0, sp0=0, vel=0, lt=0, lx=0, moved=0, free=false;
  const bounds=()=>Math.min(0,row.clientWidth-tr.scrollWidth);
  const put=()=>tr.style.transform=`translate3d(${pos.x.toFixed(2)}px,0,0)`;
  const centreOn=i=>{ const c=cards[i]; pos.t=Math.max(bounds(),Math.min(0,row.clientWidth/2-(c.offsetLeft+c.offsetWidth/2))); };
  centreOn(vIndex); pos.snap(); put();
  if(vb) ghosts.delete(vb);
  vb={ step(n,h){
    if(dragging) return true;
    if(free){ pos.x+=vel*n*h; vel*=Math.pow(.0035,n*h); const b=bounds();
      if(pos.x>0||pos.x<b||Math.abs(vel)<20){ free=false; pos.v=vel; pos.t=Math.max(b,Math.min(0,pos.x)); } put(); return true; }
    for(let i=0;i<n;i++) pos.step(h,K,C); const m=!pos.rest(); if(!m) pos.snap(); put(); return m; } };
  ghosts.add(vb);
  const choose=i=>{ if(i===vIndex) return; vIndex=i; cards.forEach((c,k)=>c.classList.toggle("sel",k===i));
    const img=$("shot"); img.style.opacity="0"; const lab=$("vlabel"); lab.style.opacity="0";
    setTimeout(()=>{ img.src=A(j.shots[i]); img.parentNode.scrollTop=0; setLabel(j); img.style.opacity=""; lab.style.opacity=""; }, RM?0:170);
    centreOn(i); kick(); };
  row.addEventListener("pointerdown",e=>{ dragging=true; free=false; moved=0; sx=e.clientX; sp0=pos.x; lx=e.clientX; lt=performance.now(); vel=0; row.setPointerCapture(e.pointerId); });
  row.addEventListener("pointermove",e=>{ if(!dragging) return; const now=performance.now(), d=e.clientX-sx; moved=Math.max(moved,Math.abs(d));
    let x=sp0+d; const b=bounds(); if(x>0) x*=.35; if(x<b) x=b+(x-b)*.35; pos.x=x; pos.v=0;
    const dt=Math.max(1,now-lt); vel=.8*((e.clientX-lx)/dt*1000)+.2*vel; lx=e.clientX; lt=now; put(); });
  const up=e=>{ if(!dragging) return; dragging=false;
    if(moved<5){ const c=document.elementFromPoint(e.clientX,e.clientY)?.closest(".vcard"); if(c) choose(+c.dataset.i); kick(); return; }
    if(RM){ pos.t=Math.max(bounds(),Math.min(0,pos.x)); pos.snap(); put(); return; }
    free=true; kick(); };
  row.addEventListener("pointerup",up); row.addEventListener("pointercancel",up);
  row.addEventListener("wheel",e=>{ const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:0; if(!d) return; e.preventDefault();
    pos.t=Math.max(bounds(),Math.min(0,pos.t-d)); kick(); },{passive:false});
  row.addEventListener("keydown",e=>{ if(e.key==="ArrowRight") choose(Math.min(cards.length-1,vIndex+1)); if(e.key==="ArrowLeft") choose(Math.max(0,vIndex-1)); });
}

/* ---------------- message box ---------------- */
$("box").addEventListener("submit",e=>{ e.preventDefault(); const v=$("inp").value.trim(); if(!v) return;
  const t=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  byId[active].thread.push({who:"you",at:t,text:v}); $("inp").value="";
  const d=document.createElement("div"); d.className="msg you"; d.style.opacity="0"; d.style.transition="opacity .42s ease";
  d.innerHTML=`<div class="w">You · ${t}</div><p>${esc(v)}</p>`; $("msgs").appendChild(d); $("msgs").scrollTop=1e5;
  requestAnimationFrame(()=>requestAnimationFrame(()=>d.style.opacity=""));
});

renderSay(); renderJobs(); renderArts();
select("capfive-lab", true);
settle(); requestAnimationFrame(measure);
})();
</script>
