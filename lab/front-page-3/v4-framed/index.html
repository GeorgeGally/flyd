<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flyd · Framed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="../shared/data.js"></script>
<style>
/* V4 · Framed. Every card frames real imagery like a print in a passe-partout. */
:root{
  --ground:#f3f2ef;
  --card:#fcfbf8;
  --ink:#17171a;
  --ink-2:#55555c;
  --ink-3:#8b8b91;
  --line:rgba(23,23,26,.08);
  --line-2:rgba(23,23,26,.14);
  --plate:#e9e7e2;
  --accent:#2a4fc4;
  --accent-soft:rgba(42,79,196,.10);
  --r-card:14px;
  --r-plate:10px;
  --r-print:5px;
  --gut:24px;
  --sans:"Geist",ui-sans-serif,-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,textarea{font:inherit;color:inherit}
img{display:block}

/* ---------- top bar ---------- */
.bar{height:60px;display:flex;align-items:baseline;gap:18px;padding:22px var(--gut) 0}
.mark{font-size:17px;font-weight:600;letter-spacing:-.01em}
.bar .date{font-size:13.5px;color:var(--ink-2)}

/* ---------- three columns ---------- */
.page{display:grid;grid-template-columns:312px minmax(0,1fr) 352px;gap:24px;padding:0 var(--gut);height:calc(100vh - 60px)}
.col{min-height:0;overflow-y:auto;scrollbar-width:none;padding-bottom:28px}
.c-centre{padding-bottom:0}
.col::-webkit-scrollbar{display:none}
.colhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;height:46px;padding:0 2px 12px}
.colhead h1{font-size:22px;font-weight:500;line-height:1.2;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.colhead .jm{font:400 13px var(--sans);color:var(--ink-2);white-space:nowrap;padding-bottom:1px}
.colhead h2{font-size:15px;font-weight:500;color:var(--ink)}
.colhead > span:not(.jm){font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---------- card + plate (the passe-partout) ---------- */
.card{background:var(--card);border-radius:var(--r-card);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(23,23,26,.03);padding:8px;transition:box-shadow .2s}
.plate{background:var(--plate);border-radius:var(--r-plate);padding:14px;position:relative;overflow:hidden;transition:background-color .6s}
.print{border-radius:var(--r-print);overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(23,23,26,.09),0 1px 1px rgba(23,23,26,.04),0 10px 24px -14px rgba(23,23,26,.35)}
.print img{width:100%;height:100%;object-fit:cover;object-position:top center}
.cap{padding:12px 6px 4px}
.cap h3{font-size:15px;font-weight:500;line-height:1.35;letter-spacing:-.005em}
.meta{font-size:13px;color:var(--ink-2);margin-top:3px}
.meta .st{color:var(--ink)}
.meta .st.need,.colhead .st.need{color:var(--ink)}
.colhead .st{font-weight:400}

/* ---------- left: jobs ---------- */
.group{margin-bottom:26px}
.group:first-child h4{height:46px;align-items:flex-end;padding:0 2px 12px;font-size:15px;color:var(--ink)}
.group h4{display:flex;justify-content:space-between;font-size:13px;font-weight:500;color:var(--ink-2);padding:0 2px 10px}
.group h4 span{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.jobs{display:grid;gap:10px}
.job{cursor:pointer;text-align:left;width:100%;border:0}
.job:hover{box-shadow:0 0 0 1px var(--line-2),0 1px 2px rgba(23,23,26,.04)}
.job.on{box-shadow:0 0 0 1.5px var(--ink),0 6px 18px -12px rgba(23,23,26,.35)}
.job .plate{padding:10px}
.job .print{aspect-ratio:2/1}
/* receipt: Flyd's latest line, framed as a small printed slip */
.slip{background:#fff;border-radius:var(--r-print);box-shadow:0 0 0 1px rgba(23,23,26,.08),0 8px 20px -14px rgba(23,23,26,.3);padding:12px 14px 13px}
.slip p{font-size:13.5px;line-height:1.5;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.slip .who{font:400 11.5px var(--mono);color:var(--ink-3);margin-bottom:6px;display:flex;justify-content:space-between}
/* compact rows for working + done */
.row{display:grid;grid-template-columns:1fr auto;min-height:66px;gap:12px;align-items:center;padding:6px 6px 6px 14px}
.row .cap{padding:4px 0}
.row .mini{width:68px;height:52px;padding:7px;border-radius:8px}
.row .mini .print{width:100%;height:100%;border-radius:3px;aspect-ratio:auto}
.row .tick{width:68px;height:52px;border-radius:8px;background:var(--plate);display:grid;place-items:center}
.row .tick i{display:block;width:30px;height:20px;background:#fff;border-radius:3px;box-shadow:0 0 0 1px rgba(23,23,26,.08);position:relative}
.row .tick i::before,.row .tick i::after{content:"";position:absolute;left:6px;right:6px;height:1.5px;background:#c9c8c4;top:6px}
.row .tick i::after{top:11px;right:11px}

/* ---------- centre: the hero frame ---------- */
.stage{transition:opacity .18s ease}
.stage.out{opacity:0}
.hero{background:var(--card);border-radius:var(--r-card);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(23,23,26,.03);padding:8px 8px 0;display:flex;flex-direction:column;min-height:calc(100% - 46px)}
.body{padding:0 14px;display:flex;flex-direction:column;flex:1}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.head .meta{margin:0 0 6px}
.head h1{font-size:23px;font-weight:500;line-height:1.25;letter-spacing:-.015em}
.head .when{font:400 12.5px var(--mono);color:var(--ink-3);white-space:nowrap;padding-top:2px}
.big{padding:22px 26px 0;border-radius:10px}
.big .print{height:clamp(250px,calc(100vh - 640px),560px);border-radius:6px 6px 0 0;overflow-y:auto;scrollbar-width:thin;box-shadow:0 0 0 1px rgba(23,23,26,.09),0 -2px 30px -16px rgba(23,23,26,.35)}
.big .print img{height:auto;object-fit:initial}
.big.single .print{height:auto;border-radius:6px;margin-bottom:22px;aspect-ratio:16/9;overflow:hidden}
.big.single .print img{height:100%;object-fit:cover}
.big.quote{padding:28px}
.big.quote .slip{padding:22px 24px}
.big.quote .slip p{font-size:18px;line-height:1.5;-webkit-line-clamp:unset;display:block;letter-spacing:-.005em}
.big.quote .slip .who{font-size:12px;margin-bottom:12px}
.vcap{margin-top:14px;min-height:46px}
.vcap p{font-size:15px;color:var(--ink-2);max-width:56ch}
.vcap p b{font-weight:500;color:var(--ink)}
.film{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
.fr{border:0;background:none;cursor:pointer;text-align:left;display:block;align-self:start}
.fr .plate{padding:7px 8px 0;border-radius:8px;height:54px;transition:box-shadow .2s,background-color .6s}
.fr .print{height:100%;border-radius:3px 3px 0 0}
.fr.on .plate{box-shadow:0 0 0 1.5px var(--ink)}
.fr .lab{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);padding:6px 2px 0}
.fr.on .lab{color:var(--ink)}
.fr .pk{color:var(--accent)}
.fr .pk .sm{display:none}
.btn,.lnk{white-space:nowrap}
.acts{display:flex;align-items:baseline;gap:20px;margin-top:18px}
.acts .jm{display:none;margin-left:auto;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.acts .st.need{color:var(--ink)}
.btn{border:0;background:var(--ink);color:#fff;font-size:14px;font-weight:500;padding:8px 14px;border-radius:8px;cursor:pointer;transition:background .2s}
.btn:hover{background:#000}
.lnk{border:0;background:none;font-size:14px;color:var(--ink-2);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:4px}
.lnk:hover{color:var(--ink)}
.thread.empty{border-top:0;padding-top:0;margin-top:0}
.thread{margin-top:20px;padding-top:18px;border-top:1px solid var(--line);display:grid;gap:16px}
.msg .by{font-size:13px;color:var(--ink-3);margin-bottom:3px}
.msg .by b{font-weight:500;color:var(--ink)}
.msg p{font-size:15px;line-height:1.55;max-width:62ch}
.msg.you p{color:var(--ink-2)}
.msg .q{font-size:13px;color:var(--ink-3);margin-top:4px}
.compose{position:sticky;bottom:0;margin:16px -14px 0;padding:12px 14px 18px;background:linear-gradient(rgba(253,253,252,0),var(--card) 14px)}
.box{display:flex;align-items:flex-end;gap:10px;background:#fff;border-radius:11px;box-shadow:0 0 0 1px var(--line-2),0 4px 14px -10px rgba(23,23,26,.25);padding:10px 10px 10px 14px}
.box textarea{flex:1;border:0;outline:0;resize:none;background:none;font-size:15px;line-height:1.5;height:23px;max-height:120px;padding:1px 0}
.box textarea::placeholder{color:var(--ink-3)}
.box .btn{padding:6px 12px;font-size:13.5px}

/* ---------- right: artefacts ---------- */
.lead{margin-bottom:12px}
.lead .print{aspect-ratio:16/10}
.mason{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mason .card{display:block}
.mason .plate{padding:10px}
.mason .plate{aspect-ratio:5/4;display:grid;place-items:center}
.mason .info .plate{aspect-ratio:auto;display:block}
.mason .print{width:100%}
.mason .print img{height:auto}
.mason .cap{padding:10px 4px 2px}
.mason .cap h3{font-size:14.5px}
.mason .meta{font-size:12.5px}
.info .plate{padding:16px 16px 18px;background:#e7e9ef}
.info .n{font-size:44px;font-weight:400;line-height:1;letter-spacing:-.03em}
.info .plate p{font-size:13.5px;line-height:1.45;color:var(--ink-2);margin-top:10px}
.art{cursor:default}
.art.news{cursor:pointer}

/* ---------- phone ---------- */
@media (max-width:980px){
  .page{grid-template-columns:1fr;height:auto;gap:28px;padding:0 16px}
  .bar{padding:0 16px}
  .col{overflow:visible;padding-bottom:0}
  .c-centre{order:-1}
  .body{padding:0 8px}
  .colhead h1{white-space:normal;font-size:18px}
  .c-centre .colhead{height:auto;flex-direction:column;align-items:flex-start;gap:4px}
  .big{padding:14px 14px 0}
  .big .print{height:340px}
  .head h1{font-size:21px}
  .film{gap:6px}
  .fr .plate{height:50px;padding:5px 5px 0}
  .fr .pk .sm{display:inline}.fr .pk .lg{display:none}
  .fr .lab{flex-direction:column;gap:0}
  .acts{flex-wrap:wrap;row-gap:12px}
  .acts .jm{display:block;flex-basis:100%;margin-left:0;order:-1}
  .compose{margin:16px -8px 0;padding:12px 8px 12px}
  .jobs{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="bar">
  <div class="mark">Flyd</div>
  <div class="date">Saturday 24 October</div>
</header>
<main class="page">
  <section class="col c-left" aria-label="Jobs">
    <div id="jobs"></div>
  </section>
  <section class="col c-centre" aria-label="Active job">
    <div class="stage" id="stage"></div>
  </section>
  <section class="col c-right" aria-label="Artefacts">
    <div class="colhead"><h2>Artefacts</h2><span id="artcount"></span></div>
    <div id="arts"></div>
  </section>
</main>

<script>
(function(){
  const F = window.FLYD, A = p => '../shared/' + p;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const last = j => j.thread[j.thread.length-1];
  const lastFlyd = j => [...j.thread].reverse().find(m => m.who === 'flyd') || last(j);

  /* Plate tint: sample each print's average colour and lay it, very softly, over the ground,
     the way Cursor tints the plate behind each product shot. */
  const tintCache = {};
  function tint(src){
    if (tintCache[src]) return tintCache[src];
    return tintCache[src] = new Promise(res => {
      const im = new Image(); im.onload = () => {
        try{
          const c = document.createElement('canvas'); c.width = c.height = 12;
          const x = c.getContext('2d'); x.drawImage(im,0,0,12,12);
          const d = x.getImageData(0,0,12,12).data; let r=0,g=0,b=0,n=0;
          for (let i=0;i<d.length;i+=4){ r+=d[i]; g+=d[i+1]; b+=d[i+2]; n++; }
          r/=n; g/=n; b/=n;
          // push towards a saturated version of the average, then wash into the ground
          const m=(r+g+b)/3, k=1.9; r=m+(r-m)*k; g=m+(g-m)*k; b=m+(b-m)*k;
          const base=[236,234,229], w=.42;
          const mix=(v,i)=>Math.round(Math.max(0,Math.min(255,base[i]*(1-w)+v*w)));
          res(`rgb(${mix(r,0)},${mix(g,1)},${mix(b,2)})`);
        }catch(e){ res(null); }
      };
      im.onerror = () => res(null); im.src = src;
    });
  }
  function applyTints(root){
    root.querySelectorAll('[data-tint]').forEach(el => tint(el.dataset.tint).then(c => { if (c) el.style.backgroundColor = c; }));
  }

  /* ---------- jobs ---------- */
  const groups = [['needs','Needs you'],['working','Working'],['done','Done']];
  let active = F.jobs[0].id, ver = {};

  function jobCard(j){
    const st = `<span class="st${j.group==='needs'?' need':''}">${esc(j.state)}</span>`;
    const meta = `<div class="meta">${esc(j.project)} · ${st} · ${esc(j.when)}</div>`;
    if (j.group === 'needs'){
      let frame;
      if (j.thumb){
        const src = A(j.kind==='design' && j.shots ? j.shots[j.pick ?? 0] : j.thumb);
        frame = `<div class="plate" data-tint="${src}"><div class="print"><img src="${src}" alt=""></div></div>`;
      } else {
        const m = lastFlyd(j);
        frame = `<div class="plate"><div class="slip"><div class="who"><span>Flyd</span><span>${esc(m.at)}</span></div><p>${esc(m.text)}</p></div></div>`;
      }
      return `<button class="card job" data-id="${j.id}">${frame}<div class="cap"><h3>${esc(j.title)}</h3>${meta}</div></button>`;
    }
    const side = j.thumb
      ? `<div class="plate mini" data-tint="${A(j.thumb)}"><div class="print"><img src="${A(j.thumb)}" alt=""></div></div>`
      : '';
    return `<button class="card job row" data-id="${j.id}"><div class="cap"><h3>${esc(j.title)}</h3>${meta}</div>${side}</button>`;
  }
  function renderJobs(){
    const el = document.getElementById('jobs');
    el.innerHTML = groups.map(([g,name]) => {
      const js = F.jobs.filter(j => j.group === g);
      return `<div class="group"><h4>${name}<span>${js.length}</span></h4><div class="jobs">${js.map(jobCard).join('')}</div></div>`;
    }).join('');
    el.querySelectorAll('.job').forEach(b => b.addEventListener('click', () => select(b.dataset.id)));
    applyTints(el); mark();
  }
  function mark(){ document.querySelectorAll('.job').forEach(b => b.classList.toggle('on', b.dataset.id === active)); }

  /* ---------- centre ---------- */
  function splitLabel(s){ const m = s.match(/^(V\d) · ([^.]+)\.\s*(.*)$/); return m ? {v:m[1], name:m[2], text:m[3]} : {v:'',name:'',text:s}; }
  function bigFrame(j){
    if (j.shots && j.shots.length > 1){
      const i = ver[j.id] ?? j.pick ?? 0, src = A(j.shots[i]);
      return `<div class="plate big" data-tint="${src}" id="bigplate"><div class="print" id="bigprint"><img src="${src}" alt="${esc(j.shotLabels ? j.shotLabels[i] : '')}"></div></div>`;
    }
    if (j.shots && j.shots.length){
      const src = A(j.shots[0]);
      return `<div class="plate big single" data-tint="${src}"><div class="print"><img src="${src}" alt=""></div></div>`;
    }
    const m = lastFlyd(j);
    return `<div class="plate big quote"><div class="slip"><div class="who"><span>Flyd</span><span>${esc(m.at)}</span></div><p>${esc(m.text)}</p></div></div>`;
  }
  function versionBlock(j){
    if (!(j.shots && j.shots.length > 1)) return '';
    const i = ver[j.id] ?? j.pick ?? 0, L = splitLabel(j.shotLabels[i]);
    const film = j.shots.map((s,k) => {
      const l = splitLabel(j.shotLabels[k]);
      return `<button class="fr${k===i?' on':''}" data-k="${k}" aria-label="${esc(l.v+' '+l.name)}"><div class="plate" data-tint="${A(s)}"><div class="print"><img src="${A(s)}" alt=""></div></div><div class="lab"><span>${l.v}</span>${k===j.pick?'<span class="pk"><span class="lg">Flyd&rsquo;s pick</span><span class="sm">Pick</span></span>':''}</div></button>`;
    }).join('');
    return `<div class="vcap" id="vcap"><p><b>${L.v} · ${esc(L.name)}.</b> ${esc(L.text)}</p></div><div class="film">${film}</div>`;
  }
  function actions(j){
    const [a,b] = j.actions;
    let primary = a;
    if (j.shots && j.shots.length > 1){ const i = ver[j.id] ?? j.pick ?? 0; primary = 'Build V' + (i+1); }
    return `<div class="acts"><button class="btn">${esc(primary)}</button>${b?`<button class="lnk">${esc(b)}</button>`:''}<span class="jm">${esc(j.project)} · <span class="st${j.group==='needs'?' need':''}">${esc(j.state)}</span> · ${esc(j.when)}</span></div>`;
  }
  function thread(j){
    const framed = !(j.shots && j.shots.length) ? lastFlyd(j) : null;
    const msgs = j.thread.filter(m => m !== framed);
    return `<div class="thread${msgs.length?'':' empty'}" id="thread">${msgs.map(m => `<div class="msg ${m.who}"><div class="by"><b>${m.who==='you'?'You':'Flyd'}</b> · ${esc(m.at)}</div><p>${esc(m.text)}</p></div>`).join('')}</div>`;
  }
  function renderStage(){
    const j = F.jobs.find(x => x.id === active), st = document.getElementById('stage');
    st.innerHTML = `<div class="colhead"><h1>${esc(j.title)}</h1></div><article class="hero">
      ${bigFrame(j)}<div class="body">
      ${versionBlock(j)}
      ${actions(j)}
      ${thread(j)}
      <div class="compose"><div class="box"><textarea id="ta" rows="1" placeholder="Message Flyd about this job"></textarea><button class="btn" id="send">Send</button></div></div>
    </div></article>`;
    applyTints(st);
    st.querySelectorAll('.fr').forEach(b => b.addEventListener('click', () => setVer(j, +b.dataset.k)));
    const ta = st.querySelector('#ta');
    ta.addEventListener('input', () => { ta.style.height = '23px'; ta.style.height = Math.min(120, ta.scrollHeight) + 'px'; });
    const send = () => {
      const t = ta.value.trim(); if (!t) return;
      const d = document.createElement('div'); d.className = 'msg you';
      d.innerHTML = `<div class="by"><b>You</b> · now</div><p>${esc(t)}</p><div class="q">Queued</div>`;
      d.style.opacity = 0; st.querySelector('#thread').appendChild(d);
      requestAnimationFrame(() => { d.style.transition = 'opacity .25s'; d.style.opacity = 1; });
      ta.value = ''; ta.style.height = '23px';
    };
    st.querySelector('#send').addEventListener('click', send);
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
  }
  function setVer(j, k){
    ver[j.id] = k;
    const st = document.getElementById('stage');
    const fade = [st.querySelector('#bigprint img'), st.querySelector('#vcap')];
    fade.forEach(e => { e.style.transition = 'opacity .16s'; e.style.opacity = 0; });
    setTimeout(() => {
      const src = A(j.shots[k]);
      const img = st.querySelector('#bigprint img'); img.src = src;
      st.querySelector('#bigprint').scrollTop = 0;
      tint(src).then(c => { if (c) st.querySelector('#bigplate').style.backgroundColor = c; });
      const L = splitLabel(j.shotLabels[k]);
      st.querySelector('#vcap').innerHTML = `<p><b>${L.v} · ${esc(L.name)}.</b> ${esc(L.text)}</p>`;
      st.querySelectorAll('.fr').forEach(b => b.classList.toggle('on', +b.dataset.k === k));
      st.querySelector('.acts .btn').textContent = 'Build V' + (k+1);
      const show = () => fade.forEach(e => e.style.opacity = 1);
      img.complete ? show() : (img.onload = show);
    }, 160);
  }
  function select(id){
    if (id === active) return;
    active = id; mark();
    const st = document.getElementById('stage');
    st.classList.add('out');
    setTimeout(() => { renderStage(); st.parentElement.scrollTop = 0; requestAnimationFrame(() => st.classList.remove('out')); }, 180);
    if (matchMedia('(max-width:980px)').matches) document.querySelector('.c-centre').scrollIntoView({behavior:'smooth'});
  }

  /* ---------- artefacts ---------- */
  function artCard(a, lead){
    if (a.kind === 'info'){
      const n = (a.title.match(/\d+/)||[''])[0];
      return `<div class="card art info"><div class="plate">${n?`<div class="n">${n}</div>`:''}<p>${esc(a.text)}</p></div><div class="cap"><h3>${esc(a.title)}</h3><div class="meta">${esc(a.meta)}</div></div></div>`;
    }
    const src = A(a.img);
    return `<div class="card art ${a.kind}${lead?' lead':''}" title="${esc(a.text||'')}"><div class="plate" data-tint="${src}"><div class="print"><img src="${src}" alt=""></div></div><div class="cap"><h3>${esc(a.title)}</h3><div class="meta">${esc(a.meta)}</div></div></div>`;
  }
  function renderArts(){
    const el = document.getElementById('arts'), [first, ...rest] = F.artefacts;
    el.innerHTML = artCard(first, true) + `<div class="mason">${rest.map(a => artCard(a)).join('')}</div>`;
    document.getElementById('artcount').textContent = F.artefacts.length;
    applyTints(el);
  }

  renderJobs(); renderStage(); renderArts();
})();
</script>
</body>
</html>
