<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Flyd — Command line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* 05 · Command line. One monospace column, keyboard first. Every line is a fact; the one question carries its
     keys right under it. No panels, no cards, no chrome beyond the cursor. */
  :root { --bg:#0b0c0c; --ink:#d9dad6; --dim:#5b5e5b; --amber:#f0b44c; --green:#8fcf8a; --blue:#86b8e8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1440px; height:900px; overflow:hidden; background:var(--bg); color:var(--ink); font-family:"JetBrains Mono", monospace; font-size:17px; -webkit-font-smoothing:antialiased; }
  .chrome { height:38px; display:flex; align-items:center; gap:8px; padding:0 16px; }
  .chrome i { width:12px; height:12px; border-radius:50%; background:#1d1f1f; }
  .term { position:absolute; left:200px; top:120px; width:1000px; line-height:1.9; }
  .dim { color:var(--dim); }
  .head { margin-bottom:56px; }
  .q { color:var(--amber); }
  .ask { font-size:26px; line-height:1.45; margin:6px 0 0 24px; max-width:820px; }
  .keys { margin:36px 0 0 24px; display:flex; gap:36px; }
  .keys kbd { font:inherit; border:1px solid #2d302e; border-radius:4px; padding:2px 9px; margin-right:10px; color:var(--ink); }
  .list { margin-top:72px; display:grid; grid-template-columns:120px 1fr; row-gap:4px; align-items:center; }
  .ok { color:var(--green); } .run { color:var(--blue); }
  .bar { color:var(--blue); margin-left:20px; }
  .art { display:flex; align-items:center; gap:20px; }
  .art svg { width:96px; display:block; border-radius:3px; opacity:.9; }
  .prompt { position:absolute; left:200px; bottom:72px; font-size:17px; }
  .cursor { display:inline-block; width:10px; height:20px; background:var(--ink); vertical-align:-3px; margin-left:4px; }
</style>
</head>
<body>
  <div class="chrome"><i></i><i></i><i></i></div>
  <div class="term">
    <div class="head dim">flyd · sunday 18 october · 09:12</div>
    <div class="q">? needs you · gnm</div>
    <div class="ask">A test entry is in the live vendor list. Shall I delete it?</div>
    <div class="keys"><span><kbd>y</kbd>delete it</span><span><kbd>n</kbd>keep it</span><span class="dim"><kbd>?</kbd>show me the entry</span></div>
    <div class="list">
      <span class="ok">done</span><span>GNM test applications passed</span>
      <span class="ok">done</span><span>Vendor logo uploads fixed</span>
      <span class="run">running</span><span>CapFive tiles show the closed year<span class="bar">██████░░░░</span></span>
      <span class="dim">new</span><span class="art">8 Days of Christmas
        <svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Good Neighbours 8 Days of Christmas site">
          <rect width="320" height="200" fill="#f3ede2"/><rect width="320" height="18" fill="#1e3a2c"/><circle cx="12" cy="9" r="3" fill="#e9dcc4"/><rect x="22" y="7" width="40" height="4" rx="2" fill="#e9dcc4"/><rect x="250" y="6" width="58" height="7" rx="3.5" fill="#c8402f"/>
          <text x="20" y="58" font-family="Georgia,serif" font-size="22" fill="#1e3a2c">8 Days of</text><text x="20" y="84" font-family="Georgia,serif" font-size="22" font-style="italic" fill="#c8402f">Christmas</text>
          <rect x="20" y="96" width="120" height="4" rx="2" fill="#1e3a2c" opacity=".35"/><rect x="20" y="106" width="90" height="4" rx="2" fill="#1e3a2c" opacity=".35"/><rect x="20" y="120" width="56" height="14" rx="7" fill="#1e3a2c"/>
          <rect x="176" y="34" width="124" height="104" rx="4" fill="#1e3a2c"/><path d="M238 50 l26 40 h-52z" fill="#3f6b4f"/><path d="M238 66 l30 46 h-60z" fill="#4f8360"/><rect x="234" y="112" width="8" height="12" fill="#8a5a3b"/><circle cx="238" cy="48" r="4" fill="#e7b84a"/>
          <g fill="#e3d6bf"><rect x="20" y="152" width="64" height="34" rx="3"/><rect x="92" y="152" width="64" height="34" rx="3"/><rect x="164" y="152" width="64" height="34" rx="3"/><rect x="236" y="152" width="64" height="34" rx="3"/></g>
        </svg><span class="dim">⌘O open</span></span>
    </div>
  </div>
  <div class="prompt"><span class="dim">›</span><span class="cursor"></span></div>
</body>
</html>
