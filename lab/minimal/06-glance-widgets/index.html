<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Flyd — Glance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* 06 · Glance. Vignelli's discipline: four tiles, one radius, one gap, one type scale. Each tile answers one
     question at a glance — what needs me, what's moving, what's done, what can I look at. Detail opens on tap. */
  :root { --bg:#e9e8e4; --tile:#f8f7f4; --ink:#1c1c1b; --mid:#8b8a85; --dark:#1c1c1b; --accent:#3d7bf7; --ok:#3f9a62; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1440px; height:900px; overflow:hidden; background:var(--bg); color:var(--ink); font-family:Inter, sans-serif; -webkit-font-smoothing:antialiased; }
  .chrome { height:38px; display:flex; align-items:center; gap:8px; padding:0 16px; }
  .chrome i { width:12px; height:12px; border-radius:50%; background:#d4d2cc; }
  .board { position:absolute; left:50%; top:96px; transform:translateX(-50%); width:1040px; height:640px;
    display:grid; grid-template-columns:600px 1fr; grid-template-rows:1fr 1fr; gap:24px; }
  .tile { background:var(--tile); border-radius:28px; padding:36px 40px; position:relative; overflow:hidden; }
  .k { font-size:13px; font-weight:500; color:var(--mid); }
  .decide { grid-row:1 / 3; background:var(--dark); color:#f3f2ee; display:flex; flex-direction:column; }
  .decide .k { color:#f2a33a; }
  .decide h1 { margin-top:auto; font-size:38px; line-height:1.18; font-weight:500; letter-spacing:-.01em; }
  .decide .actions { margin-top:56px; display:flex; gap:12px; }
  button { font:inherit; font-size:15px; font-weight:500; height:48px; padding:0 26px; border-radius:24px; border:none; cursor:pointer; transition:background-color .2s; }
  .decide button { background:#2f2f2d; color:#f3f2ee; } .decide button.go { background:#f3f2ee; color:var(--dark); }
  .decide button:hover { background:#454542; } .decide button.go:hover { background:#f2a33a; }
  .moving { display:grid; grid-template-columns:1fr 120px; align-items:center; }
  .moving b, .done b { display:block; font-size:20px; font-weight:500; line-height:1.3; margin-top:14px; }
  .moving span { display:block; color:var(--mid); font-size:14px; margin-top:8px; }
  .done { display:grid; grid-template-columns:96px 1fr; gap:8px; align-items:start; }
  .done .count { font-size:72px; font-weight:600; line-height:1; color:var(--ok); }
  .done ul { list-style:none; margin-top:4px; }
  .done li { font-size:16px; line-height:1.4; padding:8px 0; border-bottom:1px solid #ebe9e4; }
  .done li:last-child { border:none; }
  .art { position:absolute; left:50%; bottom:40px; transform:translateX(-50%); display:flex; align-items:center; gap:14px;
    background:var(--tile); border-radius:999px; padding:8px 22px 8px 8px; font-size:15px; }
  .art svg { width:72px; border-radius:999px 0 0 999px; display:block; }
  .art em { font-style:normal; color:var(--mid); }
  .talk { position:absolute; right:56px; bottom:52px; font-size:14px; color:var(--mid); }
</style>
</head>
<body>
  <div class="chrome"><i></i><i></i><i></i></div>
  <main class="board">
    <section class="tile decide">
      <span class="k">Needs you · GNM</span>
      <h1>A test entry is in the live vendor list. Shall I delete it?</h1>
      <div class="actions"><button class="go">Delete it</button><button>Keep it</button></div>
    </section>
    <section class="tile moving">
      <div><span class="k">Under way</span><b>CapFive tiles show the closed year</b><span>About an hour left</span></div>
      <svg viewBox="0 0 120 120" aria-label="62 percent done"><circle cx="60" cy="60" r="48" fill="none" stroke="#ebe9e4" stroke-width="10"/>
        <circle cx="60" cy="60" r="48" fill="none" stroke="#3d7bf7" stroke-width="10" stroke-linecap="round" stroke-dasharray="187 302" transform="rotate(-90 60 60)"/>
        <text x="60" y="66" text-anchor="middle" font-family="Inter" font-size="20" font-weight="500" fill="#1c1c1b">62%</text></svg>
    </section>
    <section class="tile done">
      <span class="count">2</span>
      <div><span class="k">Done since last night</span><ul><li>GNM test applications passed</li><li>Vendor logo uploads fixed</li></ul></div>
    </section>
  </main>
  <div class="art">
    <svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Good Neighbours 8 Days of Christmas site">
      <rect width="320" height="200" fill="#f3ede2"/><rect width="320" height="18" fill="#1e3a2c"/><circle cx="12" cy="9" r="3" fill="#e9dcc4"/><rect x="22" y="7" width="40" height="4" rx="2" fill="#e9dcc4"/><rect x="250" y="6" width="58" height="7" rx="3.5" fill="#c8402f"/>
      <text x="20" y="58" font-family="Georgia,serif" font-size="22" fill="#1e3a2c">8 Days of</text><text x="20" y="84" font-family="Georgia,serif" font-size="22" font-style="italic" fill="#c8402f">Christmas</text>
      <rect x="20" y="96" width="120" height="4" rx="2" fill="#1e3a2c" opacity=".35"/><rect x="20" y="106" width="90" height="4" rx="2" fill="#1e3a2c" opacity=".35"/><rect x="20" y="120" width="56" height="14" rx="7" fill="#1e3a2c"/>
      <rect x="176" y="34" width="124" height="104" rx="4" fill="#1e3a2c"/><path d="M238 50 l26 40 h-52z" fill="#3f6b4f"/><path d="M238 66 l30 46 h-60z" fill="#4f8360"/><rect x="234" y="112" width="8" height="12" fill="#8a5a3b"/><circle cx="238" cy="48" r="4" fill="#e7b84a"/>
      <g fill="#e3d6bf"><rect x="20" y="152" width="64" height="34" rx="3"/><rect x="92" y="152" width="64" height="34" rx="3"/><rect x="164" y="152" width="64" height="34" rx="3"/><rect x="236" y="152" width="64" height="34" rx="3"/></g>
    </svg>
    <span>8 Days of Christmas is ready to view <em>→</em></span>
  </div>
  <div class="talk">Hold fn to talk</div>
</body>
</html>
