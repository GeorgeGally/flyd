<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Flyd — Swiss grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* 04 · Swiss grid. Müller-Brockmann: a 12-column grid, one typeface, one red. Hierarchy comes from scale and
     position alone — the day reads as a poster: a count, a question, a short index. */
  :root { --paper:#f7f6f2; --ink:#111; --mid:#8a8a86; --rule:#111; --red:#e0301e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1440px; height:900px; overflow:hidden; background:var(--paper); color:var(--ink); font-family:"Inter Tight", sans-serif; -webkit-font-smoothing:antialiased; }
  .chrome { height:38px; display:flex; align-items:center; gap:8px; padding:0 16px; }
  .chrome i { width:12px; height:12px; border-radius:50%; background:#dddbd5; }
  .grid { position:absolute; inset:38px 64px 56px 64px; display:grid; grid-template-columns:repeat(12, 1fr); column-gap:24px; grid-template-rows:auto 1fr auto; }
  .mast { grid-column:1 / -1; display:grid; grid-template-columns:repeat(12, 1fr); column-gap:24px; padding:28px 0 18px; border-bottom:2px solid var(--rule); font-size:15px; }
  .mast .name { grid-column:1 / 4; font-weight:700; }
  .mast .date { grid-column:4 / 7; }
  .mast .ask { grid-column:9 / -1; color:var(--mid); text-align:left; }
  .num { grid-column:1 / 4; align-self:start; padding-top:40px; font-size:280px; font-weight:700; line-height:.8; letter-spacing:-.04em; color:var(--red); }
  .q { grid-column:4 / 11; align-self:start; padding-top:56px; }
  .q .k { font-size:15px; font-weight:500; margin-bottom:24px; }
  .q h1 { font-size:58px; line-height:1.04; font-weight:700; letter-spacing:-.02em; }
  .q .actions { margin-top:56px; display:flex; gap:0; }
  button { font:inherit; font-size:16px; font-weight:500; padding:16px 32px; border:2px solid var(--ink); background:transparent; color:var(--ink); cursor:pointer; transition:background-color .2s, color .2s; }
  button + button { border-left:none; }
  button.go { background:var(--ink); color:var(--paper); }
  button:hover { background:var(--red); border-color:var(--red); color:#fff; }
  .index { grid-column:1 / -1; display:grid; grid-template-columns:repeat(12, 1fr); column-gap:24px; border-top:2px solid var(--rule); padding-top:18px; }
  .item { grid-column:span 3; font-size:15px; line-height:1.4; }
  .item .k { color:var(--mid); margin-bottom:6px; display:block; }
  .item.art { grid-column:10 / -1; display:grid; grid-template-columns:1fr 128px; gap:16px; }
  .item.art svg { width:128px; display:block; }
</style>
</head>
<body>
  <div class="chrome"><i></i><i></i><i></i></div>
  <div class="grid">
    <header class="mast"><span class="name">Flyd</span><span class="date">Sunday 18 October</span><span class="ask">Ask anything ↵</span></header>
    <div class="num">1</div>
    <section class="q">
      <p class="k">Decision for you · Good Neighbours Market</p>
      <h1>A test entry is in the live vendor list. Shall I delete it?</h1>
      <div class="actions"><button class="go">Delete it</button><button>Keep it</button></div>
    </section>
    <footer class="index">
      <div class="item"><span class="k">Done</span>GNM test applications passed</div>
      <div class="item"><span class="k">Done</span>Vendor logo uploads fixed</div>
      <div class="item" style="grid-column:7 / 10"><span class="k">Under way</span>CapFive tiles show the closed year</div>
      <div class="item art"><div><span class="k">New page</span>8 Days of Christmas</div>
        <svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Good Neighbours 8 Days of Christmas site">
          <rect width="320" height="200" fill="#f3ede2"/><rect width="320" height="18" fill="#1e3a2c"/><circle cx="12" cy="9" r="3" fill="#e9dcc4"/><rect x="22" y="7" width="40" height="4" rx="2" fill="#e9dcc4"/><rect x="250" y="6" width="58" height="7" rx="3.5" fill="#c8402f"/>
          <text x="20" y="58" font-family="Georgia,serif" font-size="22" fill="#1e3a2c">8 Days of</text><text x="20" y="84" font-family="Georgia,serif" font-size="22" font-style="italic" fill="#c8402f">Christmas</text>
          <rect x="20" y="96" width="120" height="4" rx="2" fill="#1e3a2c" opacity=".35"/><rect x="20" y="106" width="90" height="4" rx="2" fill="#1e3a2c" opacity=".35"/><rect x="20" y="120" width="56" height="14" rx="7" fill="#1e3a2c"/>
          <rect x="176" y="34" width="124" height="104" rx="4" fill="#1e3a2c"/><path d="M238 50 l26 40 h-52z" fill="#3f6b4f"/><path d="M238 66 l30 46 h-60z" fill="#4f8360"/><rect x="234" y="112" width="8" height="12" fill="#8a5a3b"/><circle cx="238" cy="48" r="4" fill="#e7b84a"/>
          <g fill="#e3d6bf"><rect x="20" y="152" width="64" height="34" rx="3"/><rect x="92" y="152" width="64" height="34" rx="3"/><rect x="164" y="152" width="64" height="34" rx="3"/><rect x="236" y="152" width="64" height="34" rx="3"/></g>
        </svg></div>
    </footer>
  </div>
</body>
</html>
