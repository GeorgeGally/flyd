<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Flyd — Zen focus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  /* 07 · Zen focus. Spatial depth instead of columns: one frosted card floats in front; everything else recedes
     into soft, out-of-focus shapes behind it. Bring one forward and the rest falls back. */
  :root { --ink:#f1efe9; --dim:#9a968e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1440px; height:900px; overflow:hidden; color:var(--ink); font-family:Inter, sans-serif; -webkit-font-smoothing:antialiased;
    background:radial-gradient(700px 500px at 30% 30%, #2b2a3a 0%, transparent 70%), radial-gradient(800px 600px at 80% 80%, #3a2a24 0%, transparent 70%), #141317; }
  .chrome { height:38px; display:flex; align-items:center; gap:8px; padding:0 16px; position:relative; z-index:3; }
  .chrome i { width:12px; height:12px; border-radius:50%; background:#2a2830; }
  .far { position:absolute; border-radius:22px; background:rgba(255,255,255,.05); filter:blur(1.5px); padding:22px 26px; color:#bdb8ae; font-size:15px; line-height:1.4; }
  .far .k { display:block; font-size:12px; color:var(--dim); margin-bottom:6px; }
  .f1 { left:110px; top:160px; width:270px; opacity:.55; transform:scale(.9); }
  .f2 { left:150px; bottom:150px; width:250px; opacity:.5; transform:scale(.85); filter:blur(2px); }
  .f3 { right:120px; top:190px; width:260px; opacity:.5; transform:scale(.88); }
  .f4 { right:150px; bottom:130px; width:230px; opacity:.6; transform:scale(.9); padding:12px; }
  .f4 svg { width:100%; display:block; border-radius:12px; }
  .focus { position:absolute; left:50%; top:50%; transform:translate(-50%,-52%); width:600px; padding:52px 56px 48px; border-radius:32px;
    background:rgba(255,255,255,.09); backdrop-filter:blur(30px) saturate(1.2); -webkit-backdrop-filter:blur(30px) saturate(1.2);
    border:1px solid rgba(255,255,255,.12); box-shadow:0 60px 120px -40px rgba(0,0,0,.7); z-index:2; }
  .focus .k { font-size:13px; color:#f4b860; margin-bottom:22px; }
  .focus h1 { font-size:34px; line-height:1.25; font-weight:400; }
  .focus .actions { margin-top:52px; display:flex; gap:12px; }
  button { font:inherit; font-size:15px; height:48px; padding:0 26px; border-radius:24px; border:1px solid rgba(255,255,255,.18); background:transparent; color:var(--ink); cursor:pointer; transition:background-color .2s; }
  button.go { background:var(--ink); color:#141317; border-color:transparent; }
  button:hover { background:rgba(255,255,255,.12); } button.go:hover { background:#f4b860; }
  .breath { position:absolute; left:50%; bottom:56px; transform:translateX(-50%); display:flex; align-items:center; gap:12px; color:var(--dim); font-size:14px; }
  .breath i { width:8px; height:8px; border-radius:50%; background:#6f6b64; } .breath i.on { background:var(--ink); }
</style>
</head>
<body>
  <div class="chrome"><i></i><i></i><i></i></div>
  <div class="far f1"><span class="k">Done</span>GNM test applications passed</div>
  <div class="far f2"><span class="k">Done</span>Vendor logo uploads fixed</div>
  <div class="far f3"><span class="k">Under way</span>CapFive tiles show the closed year</div>
  <div class="far f4">
    <svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Good Neighbours 8 Days of Christmas site">
      <rect width="320" height="200" fill="#f3ede2"/><rect width="320" height="18" fill="#1e3a2c"/><circle cx="12" cy="9" r="3" fill="#e9dcc4"/><rect x="22" y="7" width="40" height="4" rx="2" fill="#e9dcc4"/><rect x="250" y="6" width="58" height="7" rx="3.5" fill="#c8402f"/>
      <text x="20" y="58" font-family="Georgia,serif" font-size="22" fill="#1e3a2c">8 Days of</text><text x="20" y="84" font-family="Georgia,serif" font-size="22" font-style="italic" fill="#c8402f">Christmas</text>
      <rect x="20" y="96" width="120" height="4" rx="2" fill="#1e3a2c" opacity=".35"/><rect x="20" y="106" width="90" height="4" rx="2" fill="#1e3a2c" opacity=".35"/><rect x="20" y="120" width="56" height="14" rx="7" fill="#1e3a2c"/>
      <rect x="176" y="34" width="124" height="104" rx="4" fill="#1e3a2c"/><path d="M238 50 l26 40 h-52z" fill="#3f6b4f"/><path d="M238 66 l30 46 h-60z" fill="#4f8360"/><rect x="234" y="112" width="8" height="12" fill="#8a5a3b"/><circle cx="238" cy="48" r="4" fill="#e7b84a"/>
      <g fill="#e3d6bf"><rect x="20" y="152" width="64" height="34" rx="3"/><rect x="92" y="152" width="64" height="34" rx="3"/><rect x="164" y="152" width="64" height="34" rx="3"/><rect x="236" y="152" width="64" height="34" rx="3"/></g>
    </svg>
  </div>
  <section class="focus">
    <p class="k">Needs you · Good Neighbours Market</p>
    <h1>A test entry is sitting in the live vendor list. Shall&nbsp;I&nbsp;delete&nbsp;it?</h1>
    <div class="actions"><button class="go">Delete it</button><button>Keep it</button></div>
  </section>
  <div class="breath"><i class="on"></i><i></i><i></i><i></i><span>&nbsp;Swipe for the rest · hold fn to talk</span></div>
</body>
</html>
