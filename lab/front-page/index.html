<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flyd front page lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Familjen+Grotesk:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* ---------- lab chrome ---------- */
*{box-sizing:border-box}
html,body{margin:0}
body{background:#d9dcdf;font:15px/1.5 "Public Sans",system-ui,sans-serif;color:#15181b}
.labhead{padding:40px 48px 8px;max-width:1440px;margin:0 auto}
.labhead h1{font:600 22px/1.2 "Public Sans",sans-serif;margin:0 0 6px}
.labhead p{margin:0;color:#4a5157;max-width:70ch}
.ver{max-width:1440px;margin:40px auto 0;padding:0 0 8px}
.vtag{display:flex;gap:10px;align-items:baseline;padding:0 48px 12px;color:#30363b}
.vtag b{font-weight:600}
.vtag a{margin-left:auto;color:#30363b;font-size:13px}
body.solo{background:#000}
body.solo .labhead,body.solo .vtag{display:none}
body.solo .ver{margin:0;max-width:none;padding:0}
body.solo .app{height:100vh}

/* ---------- shared skeleton ---------- */
.app{display:grid;grid-template-columns:var(--lw) minmax(0,1fr) var(--rw);height:880px;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body)}
.left,.right,.centre{min-width:0;overflow-y:auto;scrollbar-width:none}
.left::-webkit-scrollbar,.right::-webkit-scrollbar,.centre::-webkit-scrollbar{display:none}
.centre{display:flex;flex-direction:column}
.mast{display:flex;justify-content:space-between;align-items:baseline}
.mast b{font-weight:600}
.job{all:unset;box-sizing:border-box;display:grid;cursor:pointer;width:100%}
.job:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.thumb{overflow:hidden;display:block}
.cbody{transition:opacity .22s ease}
.cbody.fade{opacity:0}
.ch h1{text-wrap:pretty;max-width:none!important}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts button{font:inherit;cursor:pointer}
.composer{display:flex}
.composer input{flex:1;min-width:0;font:inherit}
.shots{display:grid;gap:14px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.shots figure{margin:0;display:flex;flex-direction:column;gap:8px}
.shots .frame{overflow:hidden;height:var(--sh,250px)}
.shots figcaption{font-size:12.5px}
.shots.one .frame{height:300px}
.rsec{display:flex;flex-direction:column}
.art figure{margin:0;overflow:hidden;aspect-ratio:16/10}
.art h3,.art p,.msg p,.grp h2{margin:0}
.thread{display:flex;flex-direction:column}
.grp h2 span{margin-left:8px;opacity:.55;font-weight:400}

.viewer{margin-top:24px;display:flex;flex-direction:column;gap:12px}
.hero{height:var(--hh,290px);overflow:hidden}
.centre{overflow:hidden!important}
.cbody{height:100%;display:flex;flex-direction:column;padding-bottom:22px!important}
.scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-bottom:12px}
.scroll::-webkit-scrollbar{display:none}
.composer{padding-top:14px;border-top:1px solid var(--line,rgba(0,0,0,.08))}
.cstate{color:var(--muted)!important;font-weight:400!important}
.v6 .cstate::before{display:none}
@media (max-width:900px){
  body:not(.solo) .ver,.ver{max-width:none}
  .app{grid-template-columns:1fr;height:auto;overflow:visible}
  .centre{order:-1;overflow:visible!important}
  .cbody{height:auto}
  .left,.right{border:0!important;overflow:visible}
  .v4 .app{padding:0}
  .ch h1{font-size:26px!important}
  .cbody{padding:24px 20px!important}
  .hero{height:220px}
  .strip{grid-template-columns:repeat(5,minmax(64px,1fr));overflow-x:auto}
  .labhead,.vtag{padding-left:16px;padding-right:16px}
  .vtag{flex-wrap:wrap}
}
.hero img{transition:opacity .16s ease}
.vcap{margin:0;font-size:14px;line-height:1.45}
.vcap em{font-style:normal;font-weight:600;margin-left:6px;color:var(--accent)}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.sv{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:5px;opacity:.6;transition:opacity .2s}
.sv.on,.sv:hover{opacity:1}
.sv .frame{display:block;height:64px;overflow:hidden}
.sv .sl{font-size:12px}
.sv:focus-visible{outline:2px solid var(--accent)}
.job{position:relative}
.job .thumb{position:absolute;right:var(--tpad,20px);top:12px;width:56px;height:42px;margin:0!important;padding:0!important;aspect-ratio:auto!important;box-shadow:none!important;border:0!important;outline:0!important}
.job.has-thumb .jt,.job.has-thumb .jm{padding-right:66px}
.job.active .thumb{display:none}
.job.active.has-thumb .jt,.job.active.has-thumb .jm{padding-right:0}
.more{margin:6px 0 0;font-size:12.5px;opacity:.6;padding:0 var(--tpad,20px)}
.right .art figure{aspect-ratio:16/9}

/* V1 · Master control — seed 6d37a7… hue 153, dark */
.v1{--bg:#0c1210;--panel:#121b18;--line:#1d2925;--fg:#e8efeb;--muted:#8a9a93;--accent:#4fcf9f;--lw:300px;--rw:320px;--body:"Archivo",sans-serif;--mono:"IBM Plex Mono",monospace}
.v1 .left{border-right:1px solid var(--line);padding:26px 0}
.v1 .mast{padding:0 24px 26px;font-size:13px;color:var(--muted)}
.v1 .mast b{color:var(--fg);font-size:15px}
.v1 .grp{margin-bottom:24px}
.v1 .grp h2{font:600 13px var(--body);color:var(--fg);padding:0 24px 8px}
.v1 .job{grid-template-columns:44px 1fr;gap:2px 12px;padding:10px 24px}
.v1 .job .when{font:400 12px/1.6 var(--mono);color:var(--muted);grid-row:span 2}
.v1 .job .jt{font-size:14.5px;line-height:1.4}
.v1 .job .jm{font-size:12.5px;color:var(--muted)}
.v1 .job .thumb{grid-column:2;aspect-ratio:16/9;margin:6px 0 2px}
.v1 .job:hover{background:var(--panel)}
.v1 .job.active{background:#17231f}
.v1 .job[data-group=needs] .st{color:var(--accent)}
.v1 .cbody{padding:34px 44px 30px;display:flex;flex-direction:column}
.v1 .crumb{font-size:13px;color:var(--muted)}
.v1 .ch h1{font:600 26px/1.2 var(--body);margin:8px 0 6px;letter-spacing:-.01em;max-width:30ch}
.v1 .cstate{font-size:13px;color:var(--accent)}
.v1 .shots{margin-top:26px}
.v1 .shots .frame{border:1px solid var(--line)}
.v1 .shots figcaption{font-family:var(--mono);color:var(--muted)}
.v1 .thread{gap:18px;margin-top:28px;max-width:64ch}
.v1 .msg .who{font-size:12.5px;color:var(--muted);margin-bottom:3px}
.v1 .msg .who span{font-family:var(--mono);margin-left:6px}
.v1 .msg p{font-size:16px;line-height:1.55}
.v1 .acts{margin-top:24px}
.v1 .acts button{background:transparent;color:var(--fg);border:1px solid #2c3a35;padding:7px 14px;font-size:13px;border-radius:4px}
.v1 .acts button:first-child{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:600}
.v1 .composer{margin-top:22px;max-width:64ch}
.v1 .composer input{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:13px 16px;border-radius:4px}
.v1 .right{border-left:1px solid var(--line);padding:26px 24px;display:flex;flex-direction:column;gap:30px}
.v1 .rsec{gap:18px}
.v1 .rsec h2{font:600 13px var(--body);margin:0}
.v1 .art figure{border:1px solid var(--line)}
.v1 .art h3{font:500 14px/1.35 var(--body);margin-top:8px}
.v1 .art .am{font-size:12px;color:var(--muted);margin-top:2px}
.v1 .art .at{font-size:13.5px;color:#bcc8c2;margin-top:4px;line-height:1.5}
.v1 .rnote{font-size:13px;color:var(--muted);line-height:1.5;margin:-8px 0 0}

/* V2 · The spread — seed 86d576… hue 189, editorial light */
.v2{--bg:#ffffff;--fg:#111315;--muted:#62696d;--line:#e6e8e9;--accent:#0b6470;--lw:290px;--rw:330px;--body:"Public Sans",sans-serif;--serif:"Newsreader",Georgia,serif}
.v2 .left{padding:34px 28px}
.v2 .mast{padding-bottom:16px;margin-bottom:26px;border-bottom:2px solid var(--fg)}
.v2 .mast b{font:600 26px/1 var(--serif);letter-spacing:-.01em}
.v2 .mast span{font-size:12.5px;color:var(--muted)}
.v2 .grp{margin-bottom:30px}
.v2 .grp h2{font:600 12.5px var(--body);margin-bottom:6px}
.v2 .job{grid-template-columns:1fr;gap:3px;padding:11px 0;border-top:1px solid var(--line)}
.v2 .job .when{display:none}
.v2 .job .jt{font:500 17px/1.3 var(--serif)}
.v2 .job .jm{font-size:12.5px;color:var(--muted)}
.v2 .job .thumb{aspect-ratio:16/9;margin:2px 0 6px;order:-1}
.v2 .job[data-group=needs] .st{color:var(--accent);font-weight:600}
.v2 .job.active .jt{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.v2 .cbody{padding:34px 56px 32px;display:flex;flex-direction:column}
.v2 .crumb{font-size:12.5px;color:var(--muted);padding-bottom:16px;border-bottom:2px solid var(--fg)}
.v2 .ch h1{font:500 38px/1.1 var(--serif);margin:22px 0 10px;letter-spacing:-.015em;max-width:26ch}
.v2 .cstate{font-size:13px;color:var(--accent);font-weight:600}
.v2 .shots{margin-top:26px;--sh:240px}
.v2 .shots .frame{border:1px solid var(--line)}
.v2 .shots figcaption{font:italic 400 14px var(--serif);color:var(--muted)}
.v2 .thread{gap:18px;margin-top:28px;max-width:62ch}
.v2 .msg .who{font:600 12.5px var(--body);margin-bottom:3px}
.v2 .msg .who span{font-weight:400;color:var(--muted);margin-left:6px}
.v2 .msg p{font:400 17.5px/1.55 var(--serif)}
.v2 .acts{margin-top:24px;gap:22px}
.v2 .acts button{background:none;border:0;border-bottom:1px solid currentColor;padding:2px 0;color:var(--muted);font-size:14px}
.v2 .acts button:first-child{background:var(--fg);color:#fff;border:0;padding:8px 16px;font-weight:600}
.v2 .composer{margin-top:24px;max-width:62ch}
.v2 .composer input{border:1px solid #cfd3d5;padding:13px 15px;font:400 16px var(--serif);background:#fff;color:var(--fg)}
.v2 .right{padding:34px 28px;display:flex;flex-direction:column;gap:34px}
.v2 .rsec{gap:22px}
.v2 .rsec h2{font:600 12.5px var(--body);padding-bottom:10px;border-bottom:2px solid var(--fg);margin:0}
.v2 .art h3{font:500 17px/1.3 var(--serif);margin-top:8px}
.v2 .art .am{font-size:12.5px;color:var(--muted);margin-top:2px}
.v2 .art .at{font:400 14.5px/1.5 var(--serif);color:#3a4044;margin-top:4px}
.v2 .art.k-news{padding-top:14px;border-top:1px solid var(--line)}
.v2 .art.k-news:first-of-type{border-top:0;padding-top:0}
.v2 .rnote{font:italic 400 14.5px/1.5 var(--serif);color:var(--muted);margin:-6px 0 0}

/* V3 · Quiet terminal — seed 9eaa5e… hue 223, dense dark */
.v3{--bg:#0a0f1d;--panel:#10172b;--line:#1b2441;--fg:#e1e7f4;--muted:#8c97b2;--accent:#f0b55a;--lw:330px;--rw:330px;--body:"IBM Plex Sans",sans-serif;--mono:"IBM Plex Mono",monospace}
.v3 .left{border-right:1px solid var(--line)}
.v3 .mast{padding:16px 20px;border-bottom:1px solid var(--line);font:400 12px var(--mono);color:var(--muted)}
.v3 .mast b{font:600 14px var(--body);color:var(--fg)}
.v3 .grp h2{font:600 12.5px var(--body);padding:16px 20px 8px;border-bottom:1px solid var(--line)}
.v3 .job{grid-template-columns:10px 1fr auto;gap:2px 12px;padding:11px 20px;border-bottom:1px solid var(--line);align-items:baseline}
.v3 .job::before{content:"";width:7px;height:7px;border-radius:50%;background:#3a4668;align-self:center;grid-row:span 2}
.v3 .job[data-group=needs]::before{background:var(--accent)}
.v3 .job[data-group=working]::before{background:#7b97ff}
.v3 .job .thumb{display:none}
.v3 .job .jt{font-size:14px;line-height:1.4}
.v3 .job .when{font:400 12px var(--mono);color:var(--muted);grid-column:3;grid-row:1}
.v3 .job .jm{grid-column:2/4;font-size:12.5px;color:var(--muted)}
.v3 .job:hover{background:var(--panel)}
.v3 .job.active{background:#141d36}
.v3 .cbody{padding:26px 36px 26px;display:flex;flex-direction:column}
.v3 .crumb{font:400 12px var(--mono);color:var(--muted)}
.v3 .ch h1{font:600 24px/1.25 var(--body);margin:6px 0 10px;max-width:34ch}
.v3 .cstate{font-size:13px;color:var(--accent)}
.v3 .shots{margin-top:22px;gap:10px}
.v3 .shots .frame{border:1px solid var(--line)}
.v3 .shots figcaption{font-family:var(--mono);color:var(--muted)}
.v3 .thread{margin-top:22px;border-top:1px solid var(--line)}
.v3 .msg{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.v3 .msg .who{font-size:13px;font-weight:600}
.v3 .msg .who span{display:block;font:400 12px var(--mono);color:var(--muted)}
.v3 .msg p{font-size:15px;line-height:1.6;max-width:64ch}
.v3 .acts{margin-top:18px}
.v3 .acts button{background:transparent;color:var(--fg);border:1px solid #2b3658;padding:7px 14px;font-size:13px;border-radius:4px}
.v3 .acts button:first-child{background:var(--accent);border-color:var(--accent);color:#1b1305;font-weight:600}
.v3 .composer{margin-top:18px}
.v3 .composer input{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:12px 14px;font-size:14px;border-radius:4px}
.v3 .right{border-left:1px solid var(--line)}
.v3 .rsec h2{font:600 12.5px var(--body);padding:16px 20px 8px;border-bottom:1px solid var(--line);margin:0}
.v3 .rnote{font-size:12.5px;color:var(--muted);padding:10px 20px;border-bottom:1px solid var(--line);margin:0}
.v3 .art{display:grid;grid-template-columns:96px 1fr;gap:3px 12px;padding:12px 20px;border-bottom:1px solid var(--line);align-items:start}
.v3 .art figure{grid-row:span 3;border:1px solid var(--line)}
.v3 .art.k-news{grid-template-columns:1fr}
.v3 .art h3{font:500 13.5px/1.4 var(--body)}
.v3 .art .am{font:400 11.5px var(--mono);color:var(--muted)}
.v3 .art .at{font-size:12.5px;color:#aeb8cf;line-height:1.5}

/* V4 · Gallery wall — seed 3af1b8… hue 82, wall + mats */
.v4{--bg:#e6e7e2;--plinth:#f7f7f4;--fg:#191a17;--muted:#676a60;--accent:#4b5a0c;--lw:280px;--rw:360px;--body:"Schibsted Grotesk",sans-serif}
.v4 .app{padding:20px 0}
.v4 .left{padding:24px 28px}
.v4 .mast{margin-bottom:34px;font-size:13px;color:var(--muted)}
.v4 .mast b{font-size:17px;color:var(--fg)}
.v4 .grp{margin-bottom:32px}
.v4 .grp h2{font:600 15px var(--body);margin-bottom:10px}
.v4 .job{grid-template-columns:1fr;gap:2px;padding:9px 0}
.v4 .job .when{display:none}
.v4 .job .jt{font-size:15px;line-height:1.35}
.v4 .job .jm{font-size:13px;color:var(--muted)}
.v4 .job .thumb{aspect-ratio:16/10;background:#fff;padding:8px;margin-bottom:8px;order:-1;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.v4 .job[data-group=needs] .st{color:var(--accent);font-weight:600}
.v4 .job.active .jt{font-weight:600}
.v4{--cbg:var(--plinth)}
.v4 .centre{background:var(--plinth);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.v4 .cbody{padding:40px 52px 34px;display:flex;flex-direction:column}
.v4 .crumb{font-size:13px;color:var(--muted)}
.v4 .ch h1{font:600 30px/1.15 var(--body);margin:8px 0 8px;letter-spacing:-.02em;max-width:28ch}
.v4 .cstate{font-size:14px;color:var(--accent);font-weight:600}
.v4 .shots{gap:16px;margin-top:28px;--sh:250px}
.v4 .shots .frame{background:#fff;padding:10px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.v4 .shots figcaption{color:var(--muted)}
.v4 .thread{gap:20px;margin-top:30px;max-width:60ch}
.v4 .msg .who{font-size:13px;color:var(--muted);margin-bottom:3px}
.v4 .msg p{font-size:16.5px;line-height:1.6}
.v4 .acts{margin-top:26px}
.v4 .acts button{background:#fff;border:1px solid #cfd1c8;color:var(--fg);padding:8px 15px;font-size:13.5px;border-radius:3px}
.v4 .acts button:first-child{background:var(--fg);color:#fff;border-color:var(--fg)}
.v4 .composer{margin-top:22px;max-width:60ch}
.v4 .composer input{background:#fff;border:1px solid #cfd1c8;padding:13px 16px;font-size:15px;border-radius:3px;color:var(--fg)}
.v4 .right{padding:24px 32px;display:flex;flex-direction:column;gap:40px}
.v4 .rsec{gap:30px}
.v4 .rsec h2{font:600 15px var(--body);margin:0}
.v4 .art.k-design figure{background:#fff;padding:12px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.v4 .art h3{font:600 14px/1.35 var(--body);margin-top:12px}
.v4 .art .am{font-size:13px;color:var(--muted);margin-top:2px}
.v4 .art .at{font-size:14px;line-height:1.55;margin-top:4px;color:#3a3c35}
.v4 .art.k-news h3{margin-top:0}
.v4 .rnote{font-size:14px;color:var(--muted);line-height:1.5;margin:-18px 0 0}

/* V5 · Darkroom — seed 071ea9… hue 10, safelight */
.v5{--bg:#110d0c;--panel:#1a1413;--line:#2a2120;--fg:#f1e9e4;--muted:#a3938d;--accent:#e5502f;--light:#ece9e6;--lw:330px;--rw:360px;--body:"Familjen Grotesk",sans-serif;--mono:"DM Mono",monospace}
.v5 .left{padding:26px 0;border-right:1px solid var(--line)}
.v5 .mast{padding:0 24px 24px;font:400 12px var(--mono);color:var(--muted)}
.v5 .mast b{font:600 16px var(--body);color:var(--fg)}
.v5 .grp{margin-bottom:22px}
.v5 .grp h2{font:600 13px var(--body);padding:0 24px 8px}
.v5 .job{grid-template-columns:88px 1fr;gap:2px 14px;padding:10px 24px;align-items:center}
.v5 .job,.v5 .job:not(:has(.thumb)){grid-template-columns:1fr}
.v5 .job .thumb{grid-row:span 3;aspect-ratio:4/3;border:1px solid var(--accent)}
.v5 .job .jt{font-size:14.5px;line-height:1.35}
.v5 .job .jm{font-size:12.5px;color:var(--muted)}
.v5 .job .when{display:none}
.v5 .job[data-group=needs] .st{color:var(--accent)}
.v5 .job:hover{background:var(--panel)}
.v5 .job.active{background:var(--panel)}
.v5 .cbody{padding:28px 40px 28px;display:flex;flex-direction:column}
.v5 .crumb{font:400 12px var(--mono);color:var(--muted)}
.v5 .ch h1{font:600 30px/1.15 var(--body);margin:8px 0 6px;letter-spacing:-.02em;max-width:28ch}
.v5 .cstate{font-size:13px;color:var(--accent)}
.v5 .shots{background:var(--light);padding:18px;margin-top:22px;gap:12px;--sh:240px}
.v5 .shots figcaption{font-family:var(--mono);color:#6f6460}
.v5 .thread{gap:18px;margin-top:26px;max-width:62ch}
.v5 .msg .who{font:400 12px var(--mono);color:var(--muted);margin-bottom:3px}
.v5 .msg p{font-size:16px;line-height:1.55}
.v5 .acts{margin-top:22px}
.v5 .acts button{background:none;border:1px solid #3d302d;color:var(--fg);padding:7px 14px;font-size:13px;border-radius:3px}
.v5 .acts button:first-child{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.v5 .composer{margin-top:20px;max-width:62ch}
.v5 .composer input{background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:13px 15px;font-size:15px;border-radius:3px}
.v5 .right{border-left:1px solid var(--line);padding:26px 22px;display:flex;flex-direction:column;gap:28px}
.v5 .rsec{gap:14px}
.v5 .rsec h2{font:600 13px var(--body);margin:0}
.v5 .rsec.k-design{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
.v5 .rsec.k-design h2{grid-column:1/-1}
.v5 .art h3{font:500 13px/1.3 var(--body);margin-top:6px}
.v5 .art .am{font:400 11px var(--mono);color:var(--muted);margin-top:2px}
.v5 .art .at{font-size:13px;color:#c9bcb6;margin-top:3px;line-height:1.45}
.v5 .art.k-news{padding-top:12px;border-top:1px solid var(--line)}
.v5 .rnote{font-size:13px;color:var(--muted);margin:0;line-height:1.45}

/* V6 · Departures — seed 34017b… hue 73, board */
.v6{--bg:#f3f3f1;--fg:#0b0b0a;--muted:#5f5f5a;--line:#d6d6d0;--accent:#f2c230;--lw:330px;--rw:320px;--body:"Instrument Sans",sans-serif}
.v6 .left{background:#0b0b0a;color:#f3f3f1;padding:0 0 24px}
.v6 .mast{padding:18px 20px;font-size:13px;color:#9a9a92}
.v6 .mast b{font-size:16px;color:#fff}
.v6 .grp h2{font:600 13px var(--body);color:#f3f3f1;padding:16px 20px 8px;border-bottom:1px solid #3a3a33}
.v6 .grp:first-of-type h2{background:var(--accent);color:#0b0b0a;border:0;padding:8px 20px}
.v6 .job{grid-template-columns:52px 1fr;gap:2px 12px;padding:12px 20px;border-bottom:1px solid #222219}
.v6 .job .when{font:600 14px/1.4 var(--body);font-variant-numeric:tabular-nums;grid-row:span 2}
.v6 .job .jt{font-size:14.5px;line-height:1.35}
.v6 .job .jm{font-size:12.5px;color:#9a9a92}
.v6 .job .thumb{grid-column:2;aspect-ratio:16/9;margin-top:8px}
.v6 .job:hover{background:#17170f}
.v6 .job.active{background:#24241b}
.v6 .job.active .when{color:var(--accent)}
.v6 .cbody{padding:34px 44px 28px;display:flex;flex-direction:column}
.v6 .crumb{font-size:13px;color:var(--muted)}
.v6 .ch h1{font:700 32px/1.1 var(--body);margin:8px 0 12px;letter-spacing:-.025em;max-width:28ch}
.v6 .cstate{font:600 13px var(--body)}
.v6 .cstate::before{content:"";display:inline-block;width:9px;height:9px;background:var(--accent);margin-right:8px;vertical-align:0}
.v6 .shots{margin-top:24px;gap:10px;--sh:250px}
.v6 .shots .frame{border:1.5px solid var(--fg)}
.v6 .shots figcaption{font-weight:600}
.v6 .thread{gap:18px;margin-top:26px;max-width:62ch}
.v6 .msg{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:baseline}
.v6 .msg .who{font:600 13px var(--body)}
.v6 .msg .who span{display:block;font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.v6 .msg p{font-size:16px;line-height:1.55}
.v6 .acts{margin-top:20px}
.v6 .acts button{background:#fff;border:1.5px solid var(--fg);color:var(--fg);padding:6px 13px;font:600 13px var(--body)}
.v6 .acts button:first-child{background:var(--fg);color:#fff}
.v6 .composer{margin-top:20px;padding-left:78px;max-width:calc(62ch + 78px)}
.v6 .composer input{background:#fff;border:1.5px solid var(--fg);padding:12px 14px;font-size:15px;color:var(--fg)}
.v6 .right{border-left:1px solid var(--line);padding:0 20px 24px;display:flex;flex-direction:column;gap:26px}
.v6 .rsec{gap:18px}
.v6 .rsec h2{font:600 13px var(--body);padding:16px 0 8px;border-bottom:1.5px solid var(--fg);margin:0}
.v6 .art figure{border:1.5px solid var(--fg)}
.v6 .art h3{font:600 14.5px/1.3 var(--body);margin-top:8px}
.v6 .art .am{font-size:12.5px;color:var(--muted);margin-top:2px}
.v6 .art .at{font-size:13.5px;line-height:1.5;margin-top:4px}
.v6 .rnote{font-size:13px;color:var(--muted);margin:-6px 0 0;line-height:1.45}

.v1{--tpad:24px;--rw:290px}.v1 .hero,.v1 .sv .frame{border:1px solid var(--line)}.v1 .vcap{color:var(--fg)}.v1 .sl{color:var(--muted)}.v1 .right .art h3{font-size:13.5px}.v1 .right{gap:26px}
.v2{--tpad:0px;--rw:300px}.v2 .hero,.v2 .sv .frame{border:1px solid var(--line)}.v2 .vcap{font:400 16px/1.45 var(--serif)}.v2 .sl{font-weight:600}.v2 .more{padding:0}
.v3{--tpad:20px;--rw:300px}.v3 .hero,.v3 .sv .frame{border:1px solid var(--line)}.v3 .sl{font-family:var(--mono);color:var(--muted)}.v3 .more{padding:8px 20px}
.v4{--tpad:0px;--rw:320px}.v4 .hero{background:#fff;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.1)}.v4 .sv .frame{background:#fff;padding:4px;box-shadow:0 1px 2px rgba(0,0,0,.1)}.v4 .sl{color:var(--muted)}.v4 .more{padding:0}.v4 .right .art.k-design figure{padding:8px}
.v5{--tpad:24px;--rw:320px}.v5 .viewer{background:var(--light);padding:16px;color:#2a2220}.v5 .vcap em{color:var(--accent)}.v5 .sl{font-family:var(--mono);color:#6f6460}.v5 .more{padding:0 24px}
.v6{--tpad:20px;--rw:300px}.v6 .hero,.v6 .sv .frame{border:1.5px solid var(--fg)}.v6 .vcap em{color:var(--fg);background:var(--accent);padding:1px 6px}.v6 .sl{font-weight:600}.v6 .more{color:#f3f3f1;padding:10px 20px}.v6 .viewer{padding-left:0}
</style>
</head>
<body>
<div class="labhead">
  <h1>Flyd front page: six directions</h1>
  <p>Jobs on the left, the one active job in the middle, finished things on the right. Click any job to bring its conversation into the middle. Every job, news item and image is real; the threads are condensed from those jobs.</p>
</div>
<div id="lab"></div>
<script src="data.js"></script>
<script>
const VERSIONS = [
  { n: 1, name: "Master control", idea: "A broadcast gallery: the rundown on the left, the programme monitor in the middle, the output wall on the right." },
  { n: 2, name: "The spread", idea: "A magazine spread: contents down the left, the active job set as an interview, finished work as captioned plates." },
  { n: 3, name: "Quiet terminal", idea: "A calm trading terminal: dense rows with state lights, a timestamped log in the middle, a compact artefact ticker." },
  { n: 4, name: "Gallery wall", idea: "A gallery: finished designs hang matted on the wall at right with their labels; the active job sits on a raised plinth." },
  { n: 5, name: "Darkroom", idea: "A darkroom: designs waiting for you are circled in safelight red, the active job's images sit on a lightbox, artefacts are a contact sheet." },
  { n: 6, name: "Departures", idea: "A station departures board: jobs listed by time on a black board, yellow section bars, posters on the right." }
];
const GROUPS = [["needs", "Needs you"], ["working", "Working"], ["done", "Done"]];
const D = window.FLYD;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function left(active) {
  return `<div class="mast"><b>Flyd</b><span>Saturday 24 October</span></div>` + GROUPS.map(([g, label]) => {
    const all = D.jobs.filter(j => j.group === g), jobs = g === "done" ? all.slice(0, 2) : all;
    return `<section class="grp"><h2>${label}<span>${all.length}</span></h2>${jobs.map(j => `
      <button class="job${j.id === active ? " active" : ""}${j.thumb ? " has-thumb" : ""}" data-id="${j.id}" data-group="${g}">
        ${j.thumb && g !== "done" ? `<span class="thumb"><img src="${j.thumb}" alt=""></span>` : ""}
        <span class="when">${esc(j.when)}</span>
        <span class="jt">${esc(j.title)}</span>
        <span class="jm"><span class="st">${esc(j.state)}</span> · ${esc(j.project)}</span>
      </button>`).join("")}${all.length > jobs.length ? `<p class="more">${all.length - jobs.length} more done this week</p>` : ""}</section>`;
  }).join("");
}
function viewer(j) {
  const sel = j.pick ?? 0, cap = i => j.shotLabels ? j.shotLabels[i] : "";
  return `<div class="viewer"><div class="hero"><img src="${j.shots[sel]}" alt=""></div>
    ${j.shotLabels ? `<p class="vcap">${esc(cap(sel))}${j.pick === sel ? ` <em>Flyd's pick</em>` : ""}</p>` : ""}
    ${j.shots.length > 1 ? `<div class="strip">${j.shots.map((s, i) => `<button type="button" class="sv${i === sel ? " on" : ""}" data-i="${i}"><span class="frame"><img src="${s}" alt=""></span><span class="sl">${esc(cap(i).split(".")[0])}</span></button>`).join("")}</div>` : ""}</div>`;
}
function centre(id) {
  const j = D.jobs.find(x => x.id === id);
  return `<div class="cbody"><div class="scroll">
    <header class="ch"><div class="crumb">${esc(j.project)} · ${j.kind === "design" ? "Design" : "Code"}</div>
      <h1>${esc(j.title)}</h1><div class="cstate">${esc(j.state)}</div></header>
    ${j.shots ? viewer(j) : ""}
    <div class="acts">${j.actions.map(a => `<button type="button">${esc(a)}</button>`).join("")}</div>
    <div class="thread">${j.thread.map(m => `<div class="msg ${m.who}"><div class="who">${m.who === "you" ? "George" : "Flyd"} <span>${esc(m.at)}</span></div><p>${esc(m.text)}</p></div>`).join("")}</div>
    </div><form class="composer" onsubmit="return false"><input aria-label="Message" placeholder="Message Flyd about this job"></form>
  </div>`;
}
function right() {
  const card = a => `<article class="art k-${a.kind}">${a.img ? `<figure><img src="${a.img}" alt=""></figure>` : ""}<h3>${esc(a.title)}</h3><p class="am">${esc(a.meta)}</p>${a.text ? `<p class="at">${esc(a.text)}</p>` : ""}</article>`;
  const info = D.artefacts.find(a => a.kind === "info");
  return `<section class="rsec k-design"><h2>Finished designs</h2>${D.artefacts.filter(a => a.kind === "design").map(card).join("")}</section>
    <section class="rsec k-news"><h2>News</h2>${info ? `<p class="rnote">${esc(info.title)}, from Hackaday, Simon Willison and Waxy. ${esc(info.text)}</p>` : ""}${D.artefacts.filter(a => a.kind === "news").map(card).join("")}</section>`;
}
function mount(v, root) {
  let active = D.jobs[0].id;
  root.innerHTML = `<div class="app v${v.n}"><aside class="left">${left(active)}</aside><main class="centre">${centre(active)}</main><aside class="right">${right()}</aside></div>`;
  root.querySelector(".centre").addEventListener("click", e => {
    const b = e.target.closest(".sv"); if (!b) return;
    const j = D.jobs.find(x => x.id === active), i = Number(b.dataset.i);
    const hero = root.querySelector(".hero img"); hero.style.opacity = 0;
    setTimeout(() => { hero.src = j.shots[i]; hero.style.opacity = 1; }, 160);
    root.querySelectorAll(".sv").forEach(x => x.classList.toggle("on", x === b));
    const c = root.querySelector(".vcap"); if (c) c.innerHTML = esc(j.shotLabels[i]) + (j.pick === i ? " <em>Flyd's pick</em>" : "");
  });
  root.querySelector(".left").addEventListener("click", e => {
    const b = e.target.closest(".job"); if (!b || b.dataset.id === active) return;
    active = b.dataset.id;
    root.querySelectorAll(".job").forEach(x => x.classList.toggle("active", x.dataset.id === active));
    const c = root.querySelector(".cbody"); c.classList.add("fade");
    setTimeout(() => { root.querySelector(".centre").innerHTML = centre(active); const n = root.querySelector(".cbody"); n.classList.add("fade"); requestAnimationFrame(() => requestAnimationFrame(() => n.classList.remove("fade"))); }, 200);
  });
}
const solo = Number(new URLSearchParams(location.search).get("v"));
if (solo) document.body.classList.add("solo");
const lab = document.getElementById("lab");
VERSIONS.filter(v => !solo || v.n === solo).forEach(v => {
  const s = document.createElement("section"); s.className = "ver";
  s.innerHTML = `<div class="vtag"><b>V${v.n} · ${v.name}.</b> ${v.idea}<a href="?v=${v.n}">Open full screen</a></div><div class="mount"></div>`;
  lab.appendChild(s); mount(v, s.querySelector(".mount"));
});
</script>
</body>
</html>
