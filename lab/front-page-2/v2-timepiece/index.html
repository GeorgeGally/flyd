<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flyd · Timepiece</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff; --ink:#111111; --ink2:#4a4a47; --ink3:#6b6b67; --mark:#8f8f8a; --hair:#e8e8e5; --hair2:#d4d4d0;
  --red:#e0402d;
  --mono:"Geist Mono", ui-monospace, Menlo, monospace;
  --sans:"Geist", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --ease:cubic-bezier(.2,.75,.15,1);
  --colL:360px; --colR:296px;
  --gL:32px; --gC:56px; --gR:32px;
  --X:88px;               /* the axis line */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--ink)}
body{font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
img{display:block}
.t{font-family:var(--mono);font-size:12.5px;letter-spacing:0;font-feature-settings:"tnum"}
.app{display:grid;grid-template-columns:var(--colL) 1fr var(--colR);height:100vh}
.col{position:relative;height:100vh;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.col::-webkit-scrollbar{display:none}
.col + .col{border-left:1px solid var(--hair)}
.head{height:80px;padding-top:32px;display:flex;align-items:baseline;gap:12px;white-space:nowrap}
.brand{font-weight:500;font-size:16px;letter-spacing:-.01em}
.sub{color:var(--ink3);font-size:14px}

/* ---------- LEFT: the time axis ---------- */
.jobs{padding:0 var(--gL)}
.legend{display:flex;gap:20px;height:24px;align-items:center}
.lg{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:14px;transition:opacity .3s}
.lg .d{flex:none}
.lg .n{color:var(--ink3)}
.lg.off{opacity:.35}
.axis{position:relative;margin:28px calc(-1 * var(--gL)) 0}
.axis-svg{position:absolute;left:0;top:0;width:100%;overflow:visible;pointer-events:none}
.axis-svg line{stroke:var(--hair2);stroke-width:1;shape-rendering:crispEdges}
.tl{position:absolute;left:0;width:calc(var(--X) - 16px);text-align:right;color:var(--ink3);height:14px;line-height:14px;margin-top:-7px;white-space:nowrap}
.tl.jt{color:var(--ink2)}
.tl.now{color:var(--ink);font-family:var(--sans);font-size:13.5px}
.dot{position:absolute;left:var(--X);width:0;height:0}
.dot i{position:absolute;left:-4.5px;top:-4.5px;width:9px;height:9px;border-radius:50%;background:#fff}
.needs > i{background:var(--red)}
.working > i{border:1px solid var(--ink)}
.working > i::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid var(--ink);animation:breathe 4.7s var(--ease) infinite}
.done > i{background:var(--mark);transform:scale(.72)}
.now > i{background:var(--ink);transform:scale(.56)}
.still > i::after{display:none}
@keyframes breathe{0%{transform:scale(1);opacity:.55}70%{transform:scale(2.6);opacity:0}100%{opacity:0}}
.needle{position:absolute;left:var(--X);right:0;height:1px;transition:top .55s var(--ease);pointer-events:none}
.needle::before{content:"";position:absolute;left:8px;width:9px;top:0;height:1px;background:var(--ink)}
.needle::after{content:"";position:absolute;right:0;width:12px;top:0;height:1px;background:var(--ink)}
.jl{position:absolute;left:calc(var(--X) + 20px);right:var(--gL);display:block;transition:opacity .3s}
.jl-title{display:block;font-size:15px;line-height:1.4;color:var(--ink);letter-spacing:-.003em}
.jl.done .jl-title{color:var(--ink2)}
.jl-meta{display:block;font-size:13.5px;color:var(--ink3);margin-top:2px}
.jl.faded{opacity:.25}
.strip{display:flex;gap:4px;margin-top:10px}
.strip img{width:36px;height:48px;object-fit:cover;object-position:top;box-shadow:0 0 0 1px var(--hair)}
.strip img.wide{width:96px;height:54px}

/* ---------- CENTRE: one job ---------- */
.job{padding:0 var(--gC);transition:opacity .22s linear}
.job.out{opacity:0}
.jhead{height:80px;padding-top:32px;display:flex;align-items:center;gap:10px;line-height:24px}
.slot{position:relative;width:9px;height:9px;flex:none;margin-right:2px}
.slot i{position:absolute;inset:0;border-radius:50%}
.slot.hide i{opacity:0}
.jhead .s{font-size:14px;color:var(--ink)}
.jhead .p{font-size:14px;color:var(--ink3)}
h1{font-weight:400;font-size:32px;line-height:1.15;letter-spacing:-.02em;max-width:22em}
.stage{display:grid;grid-template-columns:1fr 208px;gap:40px;margin-top:36px}
.reel{position:relative;height:var(--H,560px);overflow:hidden;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;outline:0}
.reel.drag{cursor:grabbing}
.ri{position:absolute;left:0;top:0;width:100%;height:100%;will-change:transform}
.ri img{max-width:100%;max-height:100%;width:auto;height:auto;pointer-events:none;box-shadow:0 0 0 1px var(--hair)}
.vers{display:flex;flex-direction:column}
.vlist{position:relative;padding-left:20px}
.vlist::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:1px;background:var(--hair2)}
.vr{display:flex;align-items:baseline;gap:8px;height:34px;line-height:34px;font-size:15px;color:var(--ink3);width:100%;position:relative;transition:color .2s linear}
.vr::before{content:"";position:absolute;left:-20px;top:17px;width:5px;height:1px;background:var(--mark)}
.vr.on{color:var(--ink)}
.vr .pk{font-size:13.5px;color:var(--ink3)}
.vneedle{position:absolute;left:-4px;width:9px;height:9px;border-radius:50%;background:var(--ink);margin-top:-4.5px;top:0}
.vtext{font-size:15px;color:var(--ink2);margin-top:24px;min-height:92px;transition:opacity .2s linear}
.vtext.out{opacity:0}
.actions{display:flex;align-items:center;flex-wrap:wrap;gap:20px;margin-top:28px}
.btn{height:36px;padding:0 16px;background:var(--ink);color:#fff;font-size:14.5px;border-radius:3px;display:inline-flex;align-items:center}
.btn:hover{background:#000}
.lnk{font-size:14.5px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--hair2);text-underline-offset:4px}
.lnk:hover{text-decoration-color:var(--ink)}
.single img{max-width:100%;max-height:var(--H,560px);width:auto;height:auto;cursor:zoom-in;box-shadow:0 0 0 1px var(--hair);margin-top:36px}
.span{position:relative;height:56px;margin-top:40px}
.span .base{position:absolute;left:0;right:0;top:12px;height:1px;background:var(--hair2)}
.span .dot{top:12px}
.span .lab{position:absolute;top:30px;color:var(--ink3);white-space:nowrap}
.span .run{position:absolute;top:12px;height:1px;background:var(--ink)}
.thread{margin-top:44px;border-top:1px solid var(--hair)}
.msg{padding-top:20px}
.msg .who{font-size:14px;color:var(--ink2);font-weight:500}
.msg .who .t{font-weight:400;color:var(--ink3);margin-left:8px}
.msg p{margin-top:4px;font-size:15.5px;line-height:1.55;max-width:42em}
.msg.you p{color:var(--ink2)}
.msg .st{font-size:13.5px;color:var(--ink3);margin-top:6px}
.composer{position:sticky;bottom:0;background:linear-gradient(rgba(255,255,255,0),#fff 32%);padding:28px var(--gC) 28px}
.composer form{display:flex;align-items:center;gap:16px;border:1px solid var(--hair2);border-radius:4px;height:46px;padding:0 6px 0 16px;background:#fff}
.composer input{flex:1;border:0;outline:0;font:inherit;font-size:15px;background:none;color:var(--ink)}
.composer input::placeholder{color:var(--ink3)}
.composer .send{height:32px;padding:0 12px;font-size:14px;color:var(--ink2);border-radius:3px}
.composer .send:hover{color:var(--ink);background:#f3f3f1}
.fly{position:fixed;left:0;top:0;width:9px;height:9px;border-radius:50%;z-index:50;pointer-events:none}

/* ---------- RIGHT: artefacts, a quiet index ---------- */
.arts{padding:0 var(--gR) 48px}
.grp{font-size:13.5px;color:var(--ink3);margin:0 0 14px}
.sq{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:start;margin-bottom:20px;cursor:zoom-in}
.sq .im{width:72px;height:72px;object-fit:cover;object-position:left top;box-shadow:0 0 0 1px var(--hair);will-change:transform}
.sq .a{font-size:15px;line-height:1.4}
.sq .m{font-size:13.5px;color:var(--ink3);margin-top:2px}
.note{position:relative;padding:14px 0 16px}
.note .rule{position:absolute;left:0;right:0;top:0;height:1px;background:var(--hair);transform-origin:left}
.note .m{font-size:13.5px;color:var(--ink3)}
.note .a{font-size:15px;margin-top:2px;line-height:1.4}
.note .x{font-size:14.5px;color:var(--ink2);margin-top:4px;line-height:1.45}
.fadein{animation:fade .6s linear both}
@keyframes fade{from{opacity:0}to{opacity:1}}

.lb{position:fixed;inset:0;background:rgba(255,255,255,.97);z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow:auto;opacity:0;pointer-events:none;transition:opacity .25s linear;cursor:zoom-out;padding:48px}
.lb.on{opacity:1;pointer-events:auto}
.lb img{max-width:min(1100px,100%);height:auto;box-shadow:0 0 0 1px var(--hair)}

@media (prefers-reduced-motion: reduce){ *{animation:none !important;transition:none !important} }
@media (max-width:820px){
  :root{--gL:16px;--gC:16px;--gR:16px;--X:72px}
  body{overflow:auto}
  .app{display:block;height:auto}
  .col{height:auto;overflow:visible}
  .col + .col{border-left:0;border-top:1px solid var(--hair)}
  .head{height:64px;padding-top:24px}
  .legend{gap:14px}
  .jhead{height:64px;padding-top:24px}
  h1{font-size:27px}
  .stage{grid-template-columns:1fr;gap:28px}
  .vtext{min-height:0}
  .composer{position:static}
  .lb{padding:16px}
}
</style>
</head>
<body>
<main class="app">
  <aside class="col jobs" id="jobsCol" aria-label="Jobs">
    <div class="head"><span class="brand">Flyd</span><span class="sub">Saturday 24 October</span><span class="t" id="clock" style="color:var(--ink2)"></span></div>
    <div class="legend" id="legend"></div>
    <div class="axis" id="axis"></div>
  </aside>
  <section class="col centre" id="centreCol" aria-label="Active job">
    <div class="job" id="job"></div>
    <div class="composer"><form id="composer" autocomplete="off"><input id="say" placeholder="Write to Flyd about this job"><button class="send" type="submit">Send</button></form></div>
  </section>
  <aside class="col arts" id="arts" aria-label="Artefacts"></aside>
</main>
<div class="lb" id="lb"><img id="lbImg" alt=""></div>

<script src="../shared/data.js"></script>
<script>
(() => {
const D = window.FLYD, A = p => "../shared/" + p;
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const phone = () => innerWidth <= 820;
const X = () => phone() ? 72 : 88;

let sd = 0x82ce47a6;
const rnd = () => { sd |= 0; sd = sd + 0x6D2B79F5 | 0; let t = Math.imul(sd ^ sd >>> 15, 1 | sd); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

/* ---------- time ---------- */
const DAYS = {Sat:0, Fri:1, Thu:2, Wed:3, Tue:4, Mon:5, Sun:6};
const hm = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
function stamp(job){
  const p = job.thread[job.thread.length - 1].at.split(" ");
  return p.length === 1 ? {day:0, min:hm(p[0]), label:p[0]} : {day:DAYS[p[0]], min:hm(p[1]), label:p[0]};
}
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const jobs = D.jobs.map(j => ({...j, st: stamp(j)}));
const metaOf = j => j.project + " · " + (j.group === "working" && /min/.test(j.when) ? "Working, " + j.when : j.state);

/* ---------- legend ---------- */
const filters = new Set(), legend = $("#legend");
[["needs","Needs you"],["working","Working"],["done","Done"]].forEach(([g, name]) => {
  const b = document.createElement("button");
  b.className = "lg"; b.dataset.g = g;
  b.innerHTML = `<span class="dot d ${g} still" style="position:relative;left:0;width:9px;height:9px"><i style="left:0;top:0"></i></span>${name}<span class="n">${jobs.filter(j => j.group === g).length}</span>`;
  b.onclick = () => { filters.has(g) ? filters.delete(g) : filters.add(g); applyFilter(); };
  legend.appendChild(b);
});
function applyFilter(){
  legend.querySelectorAll(".lg").forEach(b => b.classList.toggle("off", filters.size && !filters.has(b.dataset.g)));
  jobs.forEach(j => j.el.classList.toggle("faded", filters.size > 0 && !filters.has(j.group)));
}

/* ---------- axis: one line, one mark family, hour ticks only ---------- */
const axis = $("#axis");
const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"); svg.classList.add("axis-svg"); axis.appendChild(svg);
let selId = null;
const needle = document.createElement("div"); needle.className = "needle"; axis.appendChild(needle);
const nowDot = document.createElement("span"); nowDot.className = "dot now"; nowDot.innerHTML = "<i></i>"; axis.appendChild(nowDot);
const nowLbl = document.createElement("span"); nowLbl.className = "tl now"; nowLbl.textContent = "Now"; axis.appendChild(nowLbl);

jobs.forEach(j => {
  const b = document.createElement("button");
  b.className = "jl " + j.group; b.dataset.id = j.id;
  const strip = (j.group === "needs" && j.kind === "design" && j.shots)
    ? '<span class="strip">' + j.shots.map(s => `<img src="${A(s)}" alt="" class="${j.shots.length === 1 ? "wide" : ""}">`).join("") + "</span>" : "";
  b.innerHTML = `<span class="jl-title">${esc(j.title)}</span><span class="jl-meta">${esc(metaOf(j))}</span>${strip}`;
  b.onclick = () => select(j.id);
  axis.appendChild(b); j.el = b;
  const mk = document.createElement("span"); mk.className = "dot " + j.group; mk.innerHTML = "<i></i>"; axis.appendChild(mk); j.mk = mk;
  const tl = document.createElement("span"); tl.className = "tl t jt"; axis.appendChild(tl); j.tl = tl;
});

const R = 1.05, R2 = 70 / 1440, BREAK = 30, GAP = 26, TOP = 8;
function layout(){
  const now = Math.max(nowMin(), 9 * 60 + 40);
  const floorT = Math.min(...jobs.filter(j => j.st.day === 0).map(j => j.st.min)) - 34;
  const T1 = now - floorT;
  const ago = j => j.st.day === 0 ? now - j.st.min : now + (j.st.day - 1) * 1440 + (1440 - j.st.min);
  const M = m => m <= T1 ? m * R : T1 * R + BREAK + (m - T1) * R2;
  const sorted = [...jobs].sort((a, b) => ago(a) - ago(b));
  const anchors = [{M:0, y:TOP}];
  let bottom = TOP + 14;
  const seenDay = new Set();
  sorted.forEach(j => {
    const y = Math.max(TOP + M(ago(j)), bottom + GAP + 11);
    j.y = y; anchors.push({M:M(ago(j)), y});
    j.el.style.top = (y - 11) + "px";
    j.mk.style.top = j.tl.style.top = y + "px";
    j.tl.textContent = j.st.day === 0 ? j.st.label : (seenDay.has(j.st.day) ? "" : j.st.label);
    seenDay.add(j.st.day);
    bottom = y - 11 + j.el.offsetHeight;
  });
  const Y = Mv => {
    for (let i = 1; i < anchors.length; i++) { const a = anchors[i - 1], b = anchors[i]; if (Mv <= b.M) return a.y + (b.M === a.M ? 0 : (Mv - a.M) / (b.M - a.M) * (b.y - a.y)); }
    const l = anchors[anchors.length - 1]; return l.y + (Mv - l.M);
  };
  const end = bottom + 32, x = X() + .5;
  axis.style.height = end + 48 + "px"; svg.setAttribute("height", end + 48);
  const bA = Y(T1 * R) + 6, bB = Y(T1 * R + BREAK) - 6;
  let s = `<line x1="${x}" x2="${x}" y1="${TOP}" y2="${bA}"/><line x1="${x}" x2="${x}" y1="${bB}" y2="${end}"/>`;
  [...axis.querySelectorAll(".tl.hr")].forEach(n => n.remove());
  const used = sorted.map(j => j.y).concat([TOP]);
  for (let t = Math.floor(now / 60) * 60; t >= floorT; t -= 60) {
    const y = Math.round(Y(M(now - t))) + .5; if (y <= TOP + 8) continue;
    if (used.some(u => Math.abs(u - y) < 26)) continue;
    s += `<line x1="${x - 6}" x2="${x}" y1="${y}" y2="${y}"/>`;
    const l = document.createElement("span"); l.className = "tl t hr"; l.style.top = y + "px";
    l.textContent = String(t / 60).padStart(2, "0") + ":00"; axis.appendChild(l);
  }
  svg.innerHTML = s;
  nowDot.style.top = nowLbl.style.top = TOP + "px";
  const sel = jobs.find(j => j.id === selId);
  if (sel) needle.style.top = sel.y + "px";
}
function tick(){
  const d = new Date();
  $("#clock").textContent = [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, "0")).join(":");
}

/* ---------- centre ---------- */
const jobEl = $("#job"), centreCol = $("#centreCol");
let reel = null;
const vparts = label => { const i = label.indexOf(". "); return {name: label.slice(0, i), text: label.slice(i + 2)}; };
const abs = at => { const p = at.split(" "); return p.length === 1 ? hm(p[0]) : -DAYS[p[0]] * 1440 + hm(p[1]); };
const msgHTML = (who, at, text, extra = "") => `<div class="msg ${who} ${extra}"><span class="who">${who === "you" ? "You" : "Flyd"}<span class="t">${esc(at)}</span></span><p>${esc(text)}</p></div>`;

function renderJob(j){
  const head = `<div class="jhead"><span class="slot ${j.group} hide" id="slot"><i></i></span><span class="s">${esc(j.state)}</span><span class="p">${esc(j.project)}${j.link ? " · " + esc(j.link) : ""}</span></div><h1>${esc(j.title)}</h1>`;
  const [a1, a2] = j.actions;
  const actions = `<div class="actions">${a1 ? `<button class="btn" id="primary">${esc(a1)}</button>` : ""}${a2 ? `<a class="lnk" href="#" onclick="return false">${esc(a2)}</a>` : ""}</div>`;
  let body = "";
  if (j.shots && j.shots.length > 1) {
    body = `<div class="stage">
      <div class="reel" id="reel" tabindex="0" aria-label="Versions. Drag, or use the arrow keys">${j.shots.map((s, i) => `<div class="ri" data-i="${i}"><img src="${A(s)}" alt="${esc(vparts(j.shotLabels[i]).name)}" draggable="false"></div>`).join("")}</div>
      <div class="vers"><div class="vlist" id="vlist">${j.shotLabels.map((l, i) => `<button class="vr" data-i="${i}">${esc(vparts(l).name)}${i === j.pick ? '<span class="pk">my pick</span>' : ""}</button>`).join("")}<span class="vneedle" id="vneedle"></span></div>
      <p class="vtext" id="vtext"></p>${actions}</div></div>`;
  } else {
    if (j.shots) body += `<div class="single"><img src="${A(j.shots[0])}" alt="" data-full="${A(j.shots[0])}"></div>`;
    const now = Math.max(nowMin(), 9 * 60 + 40), t0 = abs(j.thread[0].at), span = Math.max(30, now - t0);
    const pct = t => Math.sqrt((t - t0) / span) * 100;
    let last = -999, marks = "";
    j.thread.forEach(m => {
      const x = pct(abs(m.at));
      marks += `<span class="dot done" style="left:${x}%"><i></i></span>`;
      if (x - last > 14 && x < 84) { marks += `<span class="lab t" style="left:${x}%">${esc(m.at)}</span>`; last = x; }
    });
    const runFrom = pct(abs(j.thread[j.thread.length - 1].at));
    body += `<div class="span" aria-hidden="true"><span class="base"></span>${j.group === "working" ? `<span class="run" style="left:${runFrom}%;right:0"></span>` : ""}${marks}<span class="dot ${j.group}" style="left:100%"><i></i></span><span class="lab" style="right:0;color:var(--ink2);font-size:13.5px;top:27px">Now</span></div>` + actions;
  }
  jobEl.innerHTML = head + body + `<div class="thread" id="thread">${j.thread.map(m => msgHTML(m.who, m.at, m.text)).join("")}</div>`;
  reel = (j.shots && j.shots.length > 1) ? makeReel(j) : null;
  const single = jobEl.querySelector(".single img"); if (single) single.onclick = () => openLB(single.dataset.full);
  sizeStage();
}
function sizeStage(){
  const H = phone() ? 460 : Math.max(320, Math.min(640, innerHeight - 290));
  jobEl.style.setProperty("--H", H + "px");
  if (reel) reel.measure();
}

function makeReel(j){
  const el = $("#reel"), items = [...el.querySelectorAll(".ri")], n = items.length;
  const rows = [...document.querySelectorAll(".vr")], vn = $("#vneedle"), vtext = $("#vtext"), prim = $("#primary");
  let p = j.pick ?? 0, v = 0, target = p, W = 1, unit = 1, raf = 0, mode = "rest", shown = -1;
  function measure(){ W = el.clientWidth; unit = W + 56; draw(); }
  function draw(){
    items.forEach((it, i) => {
      const d = i - p;
      it.style.transform = `translate3d(${d * unit}px,0,0)`;
      it.style.visibility = Math.abs(d) < 1.2 ? "visible" : "hidden";
    });
    const rowH = rows[0] ? rows[0].offsetHeight : 34;
    vn.style.top = (rowH / 2 + Math.max(-.3, Math.min(n - .7, p)) * rowH) + "px";
    const k = Math.max(0, Math.min(n - 1, Math.round(p)));
    if (k !== shown) show(k);
  }
  function show(k){
    const first = shown === -1; shown = k;
    rows.forEach((r, i) => r.classList.toggle("on", i === k));
    if (prim && /^Build V\d/.test(j.actions[0])) prim.textContent = "Build V" + (k + 1);
    const put = () => { vtext.textContent = vparts(j.shotLabels[k]).text; vtext.classList.remove("out"); };
    if (first || RM) { put(); return; }
    vtext.classList.add("out"); clearTimeout(vtext._t); vtext._t = setTimeout(put, 170);
  }
  function loop(){
    let last = performance.now(); cancelAnimationFrame(raf);
    const step = now => {
      const dt = Math.min(32, now - last); last = now;
      if (mode === "coast") {
        p += v * dt; v *= Math.pow(.93, dt / 16);
        if (p < -.25 || p > n - .75) v *= .6;
        if (Math.abs(v) < .0012) { mode = "snap"; target = Math.max(0, Math.min(n - 1, Math.round(p))); }
      }
      if (mode === "snap") {
        v += ((target - p) * .0009 - v * .055) * dt; p += v * dt;
        if (Math.abs(target - p) < .001 && Math.abs(v) < .0005) { p = target; v = 0; mode = "rest"; draw(); return; }
      }
      draw(); raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }
  function go(i){ target = Math.max(0, Math.min(n - 1, i)); if (RM) { p = target; draw(); return; } mode = "snap"; loop(); }
  let down = null, lastX = 0, lastT = 0, moved = 0;
  el.addEventListener("pointerdown", e => { down = {x:e.clientX, p}; lastX = e.clientX; lastT = performance.now(); moved = 0; v = 0; mode = "drag"; cancelAnimationFrame(raf); el.setPointerCapture(e.pointerId); el.classList.add("drag"); });
  el.addEventListener("pointermove", e => {
    if (!down) return;
    const dx = e.clientX - down.x; moved = Math.max(moved, Math.abs(dx));
    let np = down.p - dx / unit;
    if (np < 0) np *= .3; if (np > n - 1) np = n - 1 + (np - n + 1) * .3;
    const now = performance.now(), dt = Math.max(1, now - lastT);
    v = .8 * (-(e.clientX - lastX) / unit / dt) + .2 * v; lastX = e.clientX; lastT = now;
    p = np; draw();
  });
  const up = () => {
    if (!down) return; el.classList.remove("drag"); down = null;
    if (moved < 5) { openLB(A(j.shots[Math.round(p)])); return; }
    if (RM) { go(Math.round(p)); return; }
    v *= 2.2; mode = "coast"; loop();
  };
  el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  let wt;
  el.addEventListener("wheel", e => {
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : (e.shiftKey ? e.deltaY : 0);
    if (!d) return; e.preventDefault(); cancelAnimationFrame(raf); mode = "drag";
    p = Math.max(-.25, Math.min(n - .75, p + d / unit)); draw();
    clearTimeout(wt); wt = setTimeout(() => go(Math.round(p)), 120);
  }, {passive:false});
  el.addEventListener("keydown", e => { if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); go(Math.round(p) + 1); } if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); go(Math.round(p) - 1); } if (e.key === "Enter") openLB(A(j.shots[Math.round(p)])); });
  rows.forEach((r, i) => r.onclick = () => go(i));
  return {measure};
}

/* the chosen job's mark travels from the axis into the centre */
function select(id, instant){
  if (id === selId) return;
  const j = jobs.find(x => x.id === id), first = selId === null; selId = id;
  needle.style.top = j.y + "px";
  const from = j.mk.getBoundingClientRect();
  const swap = () => {
    renderJob(j); centreCol.scrollTop = 0; jobEl.classList.remove("out");
    const slot = $("#slot");
    if (instant || RM || phone()) { slot.classList.remove("hide"); return; }
    const to = slot.getBoundingClientRect();
    const f = document.createElement("span"); f.className = "fly";
    if (j.group === "needs") f.style.background = "var(--red)";
    else if (j.group === "working") { f.style.border = "1px solid var(--ink)"; f.style.background = "#fff"; }
    else f.style.background = "var(--mark)";
    document.body.appendChild(f);
    const x0 = from.left - 4.5, y0 = from.top - 4.5, x1 = to.left, y1 = to.top;
    f.animate([{transform:`translate(${x0}px,${y0}px)`}, {transform:`translate(${(x0 + x1) / 2}px,${Math.min(y0, y1) - 64}px)`, offset:.5}, {transform:`translate(${x1}px,${y1}px)`}],
      {duration:640, easing:"cubic-bezier(.5,0,.2,1)"}).onfinish = () => { slot.classList.remove("hide"); f.remove(); };
  };
  if (instant || RM || first) { swap(); return; }
  jobEl.classList.add("out"); setTimeout(swap, 200);
  if (phone()) centreCol.scrollIntoView({behavior: RM ? "auto" : "smooth"});
}

/* composer: the message is his, marked Queued until Flyd takes it up */
$("#composer").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("#say").value.trim(); if (!v) return;
  const d = new Date(), at = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  $("#thread").insertAdjacentHTML("beforeend", msgHTML("you", at, v, "fadein").replace("</p></div>", '</p><p class="st">Queued</p></div>'));
  $("#say").value = "";
  centreCol.scrollTo({top: centreCol.scrollHeight, behavior: RM ? "auto" : "smooth"});
});

/* ---------- right: artefacts index ---------- */
const arts = $("#arts");
const designs = D.artefacts.filter(a => a.img), info = D.artefacts.find(a => a.kind === "info"), news = D.artefacts.filter(a => a.kind === "news");
arts.innerHTML = `<div class="head"><span class="brand" style="font-weight:450">Artefacts</span></div>`
  + `<p class="grp">Designs</p>` + designs.map(a => `<div class="sq" data-full="${A(a.img)}"><img class="im" src="${A(a.img)}" alt=""><div><p class="a tx">${esc(a.title)}</p><p class="m tx">${esc(a.meta)}</p></div></div>`).join("")
  + `<p class="grp" style="margin-top:40px">News</p>`
  + (info ? `<div class="note"><span class="rule"></span><p class="m tx">${esc(info.meta)}</p><p class="a tx">${esc(info.title)}</p><p class="x tx">${esc(info.text)}</p></div>` : "")
  + news.map(a => `<div class="note"><span class="rule"></span><p class="m tx">${esc(a.meta)}</p><p class="a tx">${esc(a.title)}</p><p class="x tx">${esc(a.text)}</p></div>`).join("");
arts.querySelectorAll(".sq").forEach(f => f.onclick = () => openLB(f.dataset.full));

function settle(){
  if (RM) return;
  [...arts.querySelectorAll(".sq .im")].forEach((f, i) => {
    const dx = (rnd() - .5) * 90, dy = 30 + rnd() * 70, r = (rnd() - .5) * 8;
    f.animate([{transform:`translate(${dx}px,${dy}px) rotate(${r}deg)`, opacity:0}, {opacity:1, offset:.3}, {transform:"none", opacity:1}], {duration:1100, delay:200 + i * 120, easing:"cubic-bezier(.16,.9,.2,1)", fill:"backwards"});
  });
  [...arts.querySelectorAll(".rule")].forEach((r, i) => r.animate([{transform:"scaleX(0)"}, {transform:"scaleX(1)"}], {duration:800, delay:480 + i * 90, easing:"cubic-bezier(.6,0,.2,1)", fill:"backwards"}));
  [...arts.querySelectorAll(".tx, .grp")].forEach((t, i) => t.animate([{opacity:0}, {opacity:1}], {duration:500, delay:600 + i * 30, fill:"backwards"}));
  jobs.forEach((j, i) => {
    j.mk.animate([{transform:"translateY(-24px)", opacity:0}, {transform:"none", opacity:1}], {duration:700, delay:120 + i * 50, easing:"cubic-bezier(.2,.8,.2,1)", fill:"backwards"});
    [j.el, j.tl].forEach(n => n.animate([{opacity:0}, {opacity:1}], {duration:420, delay:300 + i * 50, fill:"backwards"}));
  });
}

const lb = $("#lb");
function openLB(src){ $("#lbImg").src = src; lb.classList.add("on"); }
lb.onclick = () => lb.classList.remove("on");
addEventListener("keydown", e => { if (e.key === "Escape") lb.classList.remove("on"); });

function boot(){ layout(); tick(); setInterval(tick, 1000); setInterval(layout, 60000); select("capfive-lab", true); settle(); }
addEventListener("resize", () => { layout(); sizeStage(); });
(document.fonts ? document.fonts.ready : Promise.resolve()).then(boot);
})();
</script>
