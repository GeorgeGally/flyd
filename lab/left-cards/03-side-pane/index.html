<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>03 Side pane · Flyd left cards</title>
<link rel="stylesheet" href="../shared/frame.css">
<style>
  /* Mail, not a feed. The column stays a calm, scannable list; a card opens
     beside it as a full page with room to read and talk, and the list keeps
     its place with the open card lit. */
  :root { --acc: #e2b877; --strong: #f6f4ef; --sel: #1c1d21; }
  .column { padding: 26px 14px 40px; }
  .head { padding: 0 12px; display: flex; align-items: baseline; justify-content: space-between; }
  .head h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; color: var(--strong); }
  .head span { font-size: 14px; color: var(--dim); }
  .week { margin: 18px 12px 0; display: flex; align-items: flex-end; gap: 6px; height: 34px; }
  .week i { flex: 1; border-radius: 3px 3px 1px 1px; background: #26282c; }
  .week i.today { background: var(--acc); }
  .label { margin: 26px 12px 8px; font-size: 13px; font-weight: 600; color: var(--dim); }
  .row { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; padding: 11px 12px; border-radius: 10px; cursor: pointer; transition: background 160ms ease; }
  .row:hover { background: #17181b; }
  .row.open { background: var(--sel); }
  .row:focus-visible { outline: 2px solid var(--acc); outline-offset: -2px; }
  .glyph { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: #1a1b1f; }
  .row.open .glyph { background: #26272c; }
  .glyph svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .k-reviewed { color: #8fd0a6; } .k-news { color: #e2b877; } .k-memory { color: #b8a6f5; }
  .k-decided { color: #f39a85; } .k-routine { color: #8fbfeb; } .k-done { color: #8fd0a6; } .k-noticed { color: #e8b25f; } .k-quiet { color: #6b6e75; }
  .title { font-size: 15.5px; line-height: 1.3; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.open .title { color: var(--strong); }
  .line { margin-top: 3px; font-size: 14px; line-height: 1.35; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ago { font-size: 12.5px; color: var(--dim); padding-top: 2px; font-variant-numeric: tabular-nums; }
  .more { margin: 10px 12px 0; background: none; border: 0; color: var(--dim); font-size: 14px; cursor: pointer; transition: color 160ms ease; }
  .more:hover { color: var(--ink); }

  .pane { width: 430px; flex: none; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  :root[data-opened=""] .pane { display: none; }
  .sheet { flex: 1; display: flex; flex-direction: column; padding: 30px 32px 28px; }
  .sheet-top { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--dim); }
  .sheet-top b { font-weight: 500; }
  .x { margin-left: auto; width: 30px; height: 30px; border-radius: 8px; border: 0; background: none; color: var(--dim); cursor: pointer; font-size: 15px; transition: color 160ms ease, background 160ms ease; }
  .x:hover { color: var(--ink); background: #1a1b1f; }
  .sheet h2 { margin-top: 18px; font-size: 27px; line-height: 1.18; font-weight: 600; letter-spacing: -0.02em; color: var(--strong); }
  .sheet .summary { margin-top: 16px; font-size: 17px; line-height: 1.55; color: #cfccc5; }
  .facts { margin-top: 22px; list-style: none; border-top: 1px solid var(--line); }
  .facts li { display: flex; gap: 10px; font-size: 15px; line-height: 1.4; color: var(--ink); padding: 10px 0; border-bottom: 1px solid var(--line); }
  .facts li::before { content: "✓"; color: #8fd0a6; font-size: 13px; padding-top: 1px; }
  .thread { margin-top: 28px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 86%; font-size: 15.5px; line-height: 1.45; padding: 10px 14px; border-radius: 16px; }
  .msg.george { align-self: flex-end; background: #5a4b36; color: #fff6e6; border-bottom-right-radius: 5px; }
  .msg.flyd { align-self: flex-start; background: #1d1e22; color: var(--ink); border-bottom-left-radius: 5px; }
  .msg.typing { color: var(--dim); }
  .talk { margin-top: auto; padding-top: 32px; display: flex; gap: 8px; }
  .talk input { flex: 1; min-width: 0; background: #17181b; border: 1px solid #2a2c31; border-radius: 22px; padding: 11px 16px; font-size: 15px; outline: 0; transition: border-color 160ms ease; }
  .talk input:focus { border-color: var(--acc); }
  .talk input::placeholder { color: var(--dim); }
  .talk button { border: 0; border-radius: 22px; background: var(--acc); color: #1a1408; font-size: 14px; font-weight: 600; padding: 0 18px; cursor: pointer; transition: background 160ms ease; }
  .talk button:hover { background: #f0cb92; }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar"><i></i><i></i><i></i><span>Flyd</span><b>Sun 18 Oct 14:45</b></div>
  <div class="body"><aside class="column" data-column></aside><section class="pane" data-pane></section><div class="chat" data-chat></div></div>
</div>
<script src="../shared/data.js"></script>
<script>
var ICON = {
  reviewed: '<circle cx="8" cy="8" r="6.2"/><path d="M5.4 8.2l1.8 1.8 3.5-3.7"/>',
  news: '<rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M4.8 6h6.4M4.8 8.5h6.4M4.8 11h3.6"/>',
  memory: '<circle cx="8" cy="8" r="6.2"/><circle cx="8" cy="8" r="2.2"/>',
  decided: '<path d="M8 14V8M8 8L4 3.5M8 8l4-4.5M2.8 4.8l1.2-1.3 1.6.6M13.2 4.8L12 3.5l-1.6.6"/>',
  routine: '<circle cx="8" cy="8" r="6.2"/><path d="M8 4.6V8l2.4 1.5"/>',
  done: '<path d="M3 8.5l3.2 3.2L13 4.8"/>',
  noticed: '<path d="M1.6 8s2.4-4.6 6.4-4.6S14.4 8 14.4 8s-2.4 4.6-6.4 4.6S1.6 8 1.6 8z"/><circle cx="8" cy="8" r="1.9"/>',
  quiet: '<path d="M4 8h8"/>',
};
function glyph(kind) { return '<span class="glyph k-' + kind + '"><svg viewBox="0 0 16 16">' + ICON[kind] + "</svg></span>"; }
window.design = {
  column: function (D, S, lab) {
    var max = lab.weekMax();
    function row(item) {
      var open = lab.isOpen(item.id);
      return '<div class="row' + (open ? " open" : "") + '" data-open="' + item.id + '" role="button" tabindex="0" aria-expanded="' + open + '">' + glyph(item.kind) +
        '<div style="min-width:0"><p class="title">' + lab.esc(item.title) + '</p><p class="line">' + lab.esc(item.line || item.label) + '</p></div><span class="ago">' + item.ago.replace(" ago", "") + "</span></div>";
    }
    return '<div class="head"><h1>Activity</h1><span>' + D.live + "</span></div>" +
      '<div class="week">' + D.week.map(function (d) { return '<i class="' + (d.today ? "today" : "") + '" style="height:' + Math.round(5 + (d.count / max) * 29) + 'px" title="' + d.day + ": " + d.count + '"></i>'; }).join("") + "</div>" +
      '<p class="label">Right now</p>' + row(D.now) +
      '<p class="label">Earlier</p>' + lab.earlier().map(row).join("") +
      '<button class="more" data-more type="button">' + lab.moreLabel() + "</button>";
  },
  pane: function (D, S, lab) {
    if (!S.open) return "";
    var item = lab.item(S.open);
    return '<div class="sheet"><div class="sheet-top">' + glyph(item.kind) + '<b class="k-' + item.kind + '">' + item.label + "</b> · " + item.ago +
      '<button class="x" data-close type="button" aria-label="Close">✕</button></div>' +
      "<h2>" + lab.esc(item.title) + '</h2><p class="summary">' + lab.esc(item.summary) + "</p>" +
      (item.facts.length ? '<ul class="facts">' + item.facts.map(function (f) { return "<li>" + lab.esc(f) + "</li>"; }).join("") + "</ul>" : "") +
      '<div class="thread">' + lab.thread(item.id).map(function (m) { return '<p class="msg ' + m.who + '">' + lab.esc(m.text) + "</p>"; }).join("") +
      (lab.typing(item.id) ? '<p class="msg flyd typing">…</p>' : "") + "</div>" +
      lab.talk(item.id, { placeholder: "Talk to Flyd about this" }) + "</div>";
  },
};
</script>
<script src="../shared/lab.js"></script>
</body>
</html>
