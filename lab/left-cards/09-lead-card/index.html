<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09 Lead card · Flyd left cards</title>
<link rel="stylesheet" href="../shared/frame.css">
<style>
  /* One card in hand. The newest thing Flyd did is a large card that is
     already open, with its summary and a place to answer; everything else is
     a thin strip under it. Pick a strip and it becomes the card in hand. */
  :root { --acc: #e2b877; --strong: #f6f4ef; }
  .column { padding: 24px 18px 44px; }
  .status { display: flex; align-items: center; gap: 10px; padding: 0 4px; cursor: pointer; }
  .status:focus-visible, .strip:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  .status .pulse { width: 8px; height: 8px; border-radius: 50%; background: #55585e; }
  .status p { font-size: 15px; color: var(--ink); transition: color 160ms ease; }
  .status p span { color: var(--dim); }
  .status:hover p, .status.open p { color: var(--acc); }
  .week { margin-left: auto; display: flex; align-items: flex-end; gap: 3px; height: 18px; }
  .week i { width: 4px; border-radius: 1px; background: #3a3c41; }
  .week i.today { background: var(--acc); }

  .hand { margin-top: 18px; border-radius: 20px; padding: 22px 22px 22px; background: #18191c; position: relative; overflow: hidden; }
  .hand::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: currentColor; opacity: 0.9; }
  .k-reviewed { color: #8fd0a6; } .k-news { color: #e2b877; } .k-memory { color: #b8a6f5; }
  .k-decided { color: #f39a85; } .k-routine { color: #8fbfeb; } .k-done { color: #8fd0a6; } .k-noticed { color: #e8b25f; } .k-quiet { color: #6b6e75; }
  .hand .meta { display: flex; align-items: center; justify-content: space-between; font-size: 13.5px; font-weight: 600; }
  .hand .meta span { color: var(--dim); font-weight: 400; }
  .x { background: none; border: 0; color: var(--dim); font-size: 14px; cursor: pointer; transition: color 160ms ease; }
  .x:hover { color: var(--ink); }
  .hand h2 { margin-top: 10px; font-size: 25px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em; color: var(--strong); }
  .hand .summary { margin-top: 12px; font-size: 16px; line-height: 1.55; color: #d2cfc8; }
  .pic { margin-top: 16px; border: 6px solid #f2f0eb; border-radius: 8px; background: #f2f0eb; }
  .pic img { display: block; width: 100%; height: 150px; object-fit: cover; object-position: top; border-radius: 3px; }
  .meter { margin-top: 16px; display: flex; gap: 4px; }
  .meter i { flex: 1; height: 4px; border-radius: 2px; background: #8fd0a6; }
  .facts { margin-top: 12px; list-style: none; display: grid; gap: 6px; }
  .facts li { font-size: 14px; line-height: 1.4; color: var(--dim); }
  .facts li::before { content: "✓  "; color: #8fd0a6; font-size: 12px; }
  .thread { margin-top: 18px; display: grid; gap: 12px; }
  .msg { font-size: 15.5px; line-height: 1.5; }
  .msg.george { color: var(--strong); font-weight: 500; }
  .msg.george::before { content: "You · "; color: var(--acc); font-weight: 600; }
  .msg.flyd { color: #c9c6bf; }
  .msg.flyd::before { content: "Flyd · "; color: var(--dim); font-weight: 600; }
  .msg.typing { color: var(--dim); }
  .talk { margin-top: 24px; display: flex; gap: 8px; }
  .talk input { flex: 1; min-width: 0; background: #0f1012; border: 1px solid #2c2e33; border-radius: 12px; padding: 12px 14px; font-size: 15px; outline: 0; transition: border-color 160ms ease; }
  .talk input:focus { border-color: var(--acc); }
  .talk input::placeholder { color: var(--dim); }
  .talk button { border: 0; border-radius: 12px; background: var(--acc); color: #1a1408; font-size: 14px; font-weight: 600; padding: 0 16px; cursor: pointer; transition: background 160ms ease; }
  .talk button:hover { background: #f0cb92; }

  .rest { margin-top: 22px; font-size: 13px; font-weight: 600; color: var(--dim); padding: 0 4px; }
  .strips { margin-top: 10px; display: grid; gap: 6px; }
  .strip { display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; align-items: center; padding: 12px 14px 12px 12px; border-radius: 12px; background: #141518; cursor: pointer; transition: background 160ms ease; }
  .strip:hover { background: #1b1c20; }
  .strip i { width: 4px; height: 26px; border-radius: 2px; background: currentColor; }
  .strip p { font-size: 15px; line-height: 1.3; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip p small { display: block; margin-top: 2px; font-size: 13.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .strip span { font-size: 13px; color: var(--dim); }
  .more { margin: 12px 4px 0; background: none; border: 0; font-size: 14px; color: var(--dim); cursor: pointer; transition: color 160ms ease; }
  .more:hover { color: var(--ink); }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar"><i></i><i></i><i></i><span>Flyd</span><b>Sun 18 Oct 14:45</b></div>
  <div class="body"><aside class="column" data-column></aside><div class="chat" data-chat></div></div>
</div>
<script src="../shared/data.js"></script>
<script>
window.design = {
  column: function (D, S, lab) {
    var max = lab.weekMax();
    var hand = S.open ? lab.item(S.open) : D.items[0];
    var held = !!S.open;
    var thread = lab.thread(hand.id);
    var card = '<div class="hand k-' + hand.kind + '" data-stay>' +
      '<div class="meta">' + hand.label + " <span>" + hand.ago + "</span>" + (held ? '<button class="x" data-close type="button" aria-label="Put down">✕</button>' : "<span></span>") + "</div>" +
      "<h2>" + lab.esc(hand.title) + '</h2><p class="summary">' + lab.esc(hand.summary) + "</p>" +
      (hand.image ? '<div class="pic"><img src="' + hand.image + '" alt=""></div>' : "") +
      (hand.facts.length ? '<div class="meter">' + hand.facts.map(function () { return "<i></i>"; }).join("") + '</div><ul class="facts">' + hand.facts.map(function (f) { return "<li>" + lab.esc(f) + "</li>"; }).join("") + "</ul>" : "") +
      '<div class="thread">' + thread.map(function (m) { return '<p class="msg ' + m.who + '">' + lab.esc(m.text) + "</p>"; }).join("") +
      (lab.typing(hand.id) ? '<p class="msg flyd typing">…</p>' : "") + "</div>" +
      lab.talk(hand.id, { placeholder: "Answer Flyd" }) + "</div>";
    var strips = lab.earlier().filter(function (i) { return i !== hand; }).map(function (i) {
      return '<div class="strip k-' + i.kind + '" data-open="' + i.id + '" role="button" tabindex="0"><i></i><p>' + lab.esc(i.title) + "<small>" + lab.esc(i.line) + "</small></p><span>" + i.ago.replace(" ago", "") + "</span></div>";
    }).join("");
    var nowOpen = lab.isOpen("now");
    return '<div class="status' + (nowOpen ? " open" : "") + '" data-open="now" role="button" tabindex="0" aria-expanded="' + nowOpen + '"><span class="pulse"></span><p>' + D.live + " <span>· 3m ago</span></p>" +
      '<span class="week">' + D.week.map(function (d) { return '<i class="' + (d.today ? "today" : "") + '" style="height:' + Math.round(3 + (d.count / max) * 15) + 'px"></i>'; }).join("") + "</span></div>" +
      card + '<p class="rest">Earlier</p><div class="strips">' + strips + "</div>" +
      '<button class="more" data-more type="button">' + lab.moreLabel() + "</button>";
  },
};
</script>
<script src="../shared/lab.js"></script>
</body>
</html>
