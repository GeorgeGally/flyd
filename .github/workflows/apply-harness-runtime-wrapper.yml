name: Apply harness runtime wrapper

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-harness-runtime-wrapper.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Use planning-aware harness wrapper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('cli/src/commands/code.ts')
          text = path.read_text()
          old = 'import { runContinuityHarness } from "../runtime/harness.js";'
          new = 'import { runContinuityHarness } from "../planning/harness-runtime.js";'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('harness import marker not found')
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli/src/commands/code.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(planning): observe supervised harness runs"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
