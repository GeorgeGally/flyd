name: Apply harness live trajectories

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-harness-live-trajectories.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Wire harness trajectory boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          orchestrator = Path('cli/src/runtime/orchestrator.ts')
          text = orchestrator.read_text()
          if 'beginHarnessTrajectory' not in text:
              text = text.replace(
                  'import { GitWorktreeManager } from "./worktree-manager.js";',
                  'import { GitWorktreeManager } from "./worktree-manager.js";\nimport { beginHarnessTrajectory, completeHarnessTrajectory } from "../planning/harness-trajectory.js";',
                  1,
              )
              marker = '''      const assignmentCanWrite = input.grant.fileOperations.includes("write") &&
                assignment.capabilityRequirements.includes("implementation");'''
              replacement = '''      const trajectory = await beginHarnessTrajectory({
                sessionId: input.task.taskKey,
                invocationId: `harness:${worker.workerKey}`,
                intent: assignment.instructions,
                projectRoot: worktree.path,
                taskId: input.task.id,
                threadId: assignment.assignmentKey,
              });
              const assignmentCanWrite = input.grant.fileOperations.includes("write") &&
                assignment.capabilityRequirements.includes("implementation");'''
              assert marker in text
              text = text.replace(marker, replacement, 1)

              marker = '''        await input.deps.store.recordAssignmentVerification(assignment.assignmentKey, {
                  status: "blocked",
                  result: { passed: false, intervention },
                  idempotencyKey: eventKey(`assignment-inactive:${assignment.assignmentKey}`),
                });
                throw new Error(intervention.reason);'''
              replacement = '''        await input.deps.store.recordAssignmentVerification(assignment.assignmentKey, {
                  status: "blocked",
                  result: { passed: false, intervention },
                  idempotencyKey: eventKey(`assignment-inactive:${assignment.assignmentKey}`),
                });
                await completeHarnessTrajectory({
                  handle: trajectory,
                  signal: "failed",
                  detail: { reason: timeout.reason ?? "timeout" },
                });
                throw new Error(intervention.reason);'''
              assert marker in text
              text = text.replace(marker, replacement, 1)

              marker = '''      controlledWorker ||= workerWasControlled(await input.deps.store.findWorker?.(worker.workerKey));
              if (controlledWorker) {
                throw new Error("Worker ended after an explicit control; Flyd will not retry it automatically");
              }'''
              replacement = '''      controlledWorker ||= workerWasControlled(await input.deps.store.findWorker?.(worker.workerKey));
              if (controlledWorker) {
                await completeHarnessTrajectory({ handle: trajectory, signal: "cancelled", detail: { reason: "explicit_control" } });
                throw new Error("Worker ended after an explicit control; Flyd will not retry it automatically");
              }'''
              assert marker in text
              text = text.replace(marker, replacement, 1)

              marker = '''        if (workerWasControlled(terminalWorker)) {
                  throw new Error("Worker ended after an explicit control; Flyd will not retry it automatically");
                }'''
              replacement = '''        if (workerWasControlled(terminalWorker)) {
                  await completeHarnessTrajectory({ handle: trajectory, signal: "cancelled", detail: { reason: "explicit_control" } });
                  throw new Error("Worker ended after an explicit control; Flyd will not retry it automatically");
                }'''
              assert marker in text
              text = text.replace(marker, replacement, 1)

              marker = '''        requireChanges: assignmentCanWrite,
                requireUnchanged: !assignmentCanWrite,
              });'''
              replacement = '''        requireChanges: assignmentCanWrite,
                requireUnchanged: !assignmentCanWrite,
                trajectory,
              });'''
              assert marker in text
              text = text.replace(marker, replacement, 1)
              orchestrator.write_text(text)

          verifier = Path('cli/src/runtime/result-verifier.ts')
          text = verifier.read_text()
          if 'HarnessTrajectoryHandle' not in text:
              text = text.replace(
                  'import { recordNextState } from "../transitions/writer.js";',
                  'import { recordNextState } from "../transitions/writer.js";\nimport { completeHarnessTrajectory, type HarnessTrajectoryHandle } from "../planning/harness-trajectory.js";',
                  1,
              )
              marker = '''  /** Stable per-execution correlation key (task/assignment id); derived when absent. */
              invocationId?: string;
            }): Promise<VerifiedWorkerResult> {'''
              replacement = '''  /** Stable per-execution correlation key (task/assignment id); derived when absent. */
              invocationId?: string;
              /** Live action trajectory started immediately before the worker ran. */
              trajectory?: HarnessTrajectoryHandle;
            }): Promise<VerifiedWorkerResult> {'''
              assert marker in text
              text = text.replace(marker, replacement, 1)

              marker = '''    if (result.exitStatus !== 0) {
                  captureTransition(() => recordNextState({
                    invocationId,
                    origin: "verifier",
                    signal: "error",
                    surface: "harness",
                    causalComplete: false,
                    detail: { exitCode: result.exitStatus },
                  }));
                }'''
              replacement = '''    if (result.exitStatus !== 0 && !input.trajectory) {
                  captureTransition(() => recordNextState({
                    invocationId,
                    origin: "verifier",
                    signal: "error",
                    surface: "harness",
                    causalComplete: false,
                    detail: { exitCode: result.exitStatus },
                  }));
                }'''
              assert marker in text
              text = text.replace(marker, replacement, 1)

              marker = '''  captureTransition(() => recordNextState({
                invocationId,
                origin: "verifier",
                signal: passed ? "verified" : "failed",
                surface: "harness",
                causalComplete: false,
              }));'''
              replacement = '''  if (input.trajectory) {
                await completeHarnessTrajectory({
                  handle: input.trajectory,
                  signal: passed ? "verified" : "failed",
                  detail: {
                    exitCode: commands.find((command) => command.exitStatus !== 0)?.exitStatus ?? 0,
                    changedFiles: workerEvidence.changedFiles.length,
                  },
                });
              } else {
                captureTransition(() => recordNextState({
                  invocationId,
                  origin: "verifier",
                  signal: passed ? "verified" : "failed",
                  surface: "harness",
                  causalComplete: false,
                }));
              }'''
              assert marker in text
              text = text.replace(marker, replacement, 1)
              verifier.write_text(text)
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli/src/runtime/orchestrator.ts cli/src/runtime/result-verifier.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat(planning): capture live harness trajectories"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
