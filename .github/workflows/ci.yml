name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  evidence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Test Evidence Engine
        working-directory: cli
        run: npx vitest run src/evidence

  cli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Typecheck CLI
        working-directory: cli
        run: npm run lint

      - name: Test CLI
        working-directory: cli
        run: |
          set +e
          npm test > /tmp/cli-test.log 2>&1
          status=$?
          cat /tmp/cli-test.log
          exit $status

      - name: Upload CLI failure log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cli-test-log
          path: /tmp/cli-test.log

      - name: Build CLI
        working-directory: cli
        run: npm run build
