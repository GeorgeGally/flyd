name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  evidence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Test Evidence Engine
        working-directory: cli
        run: npx vitest run src/evidence

  planning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Test planning foundations and benchmark
        working-directory: cli
        run: npx vitest run src/planning/__tests__/world-model.test.ts src/planning/__tests__/runtime-capture.test.ts src/planning/__tests__/empirical-future-model.test.ts src/planning/__tests__/harness-decision.test.ts src/planning/__tests__/harness-learning.test.ts src/planning/__tests__/harness-runtime-loop.test.ts src/runtime/__tests__/harness-planner-focus.test.ts src/planning/__tests__/decision-policy.test.ts src/__tests__/memory-gate.test.ts

  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Enforce no high-severity production vulnerabilities
        working-directory: cli
        run: npm audit --omit=dev --audit-level=high

      - name: Keep accepted QMD server advisory unreachable
        working-directory: cli
        run: |
          if grep -R -n -E '(@modelcontextprotocol/sdk|@hono/node-server|serveStatic|serve-static)' src --include='*.ts'; then
            echo "Active Flyd code now reaches the accepted QMD/MCP/Hono server path. Remove the advisory acceptance before merging."
            exit 1
          fi

  core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: flyd
          POSTGRES_PASSWORD: flyd
          POSTGRES_DB: flyd_v1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flyd -d flyd_v1_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FLYD_TEST_DATABASE_URL: postgres://flyd:flyd@127.0.0.1:5432/flyd_v1_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Typecheck TypeScript Core
        working-directory: cli
        run: npm run lint

      - name: Test active Core
        working-directory: cli
        run: |
          set +e
          npm run test:active > /tmp/core-test.log 2>&1
          status=$?
          cat /tmp/core-test.log
          exit $status

      - name: Upload Core failure log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: core-test-log
          path: /tmp/core-test.log
          if-no-files-found: ignore

      - name: Build TypeScript Core
        working-directory: cli
        run: npm run build

  mac-adapter:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Test Mac adapter
        working-directory: mac-adapter
        run: swift test
