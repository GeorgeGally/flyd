name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  evidence:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Test Evidence Engine
        working-directory: cli
        run: npx vitest run src/evidence

  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Generate non-breaking audit fixes
        working-directory: cli
        run: npm audit fix --package-lock-only || true

      - name: Enforce no high-severity production vulnerabilities
        working-directory: cli
        run: npm audit --omit=dev --audit-level=high

      - name: Commit audited lockfile
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- cli/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli/package-lock.json
          git commit -m "chore: apply non-breaking npm audit fixes"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cli/package-lock.json

      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci

      - name: Typecheck TypeScript Core
        working-directory: cli
        run: npm run lint

      - name: Test active Core
        working-directory: cli
        run: |
          set +e
          npm run test:active > /tmp/core-test.log 2>&1
          status=$?
          cat /tmp/core-test.log
          exit $status

      - name: Upload Core failure log
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: core-test-log
          path: /tmp/core-test.log
          if-no-files-found: ignore

      - name: Build TypeScript Core
        working-directory: cli
        run: npm run build

  mac-adapter:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Test Mac adapter
        working-directory: mac-adapter
        run: swift test
