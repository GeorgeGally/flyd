name: Apply live trajectory links

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-live-trajectory-links.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Wire explicit runtime boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('cli/src/server.ts')
          text = path.read_text()

          # Imports.
          text = text.replace(
              'import { recordAction, recordNextState } from "./transitions/writer.js";',
              'import { recordAction, recordNextState, isTransitionCaptureDisabled } from "./transitions/writer.js";\nimport { captureRuntimeSnapshot } from "./planning/runtime-capture.js";',
              1,
          )

          # Richer resolved context, retaining the async before-snapshot capture.
          old_ctx = 'const resolvedContexts = new Map<string, { intent: string; resolutionMode: string; environmentSummary: string; consequenceClass?: string; workSessionId?: string; timestamp: number }>();'
          if old_ctx in text:
              text = text.replace(old_ctx, '''interface ResolvedContext {
            intent: string;
            resolutionMode: string;
            environmentSummary: string;
            consequenceClass?: string;
            workSessionId?: string;
            projectRoot?: string;
            actionCapture?: Promise<void>;
            timestamp: number;
          }
          const resolvedContexts = new Map<string, ResolvedContext>();''', 1)

          # Shared explicit action boundary.
          marker = 'const completedDelegations = new Map<string, { completion: DelegationCompletion; timestamp: number }>();\n'
          if 'function stageOverlayTransition(' not in text:
              assert marker in text
              helper = marker + '''
          function stageOverlayTransition(input: {
            invocationId: string;
            sessionId: string;
            intent: string;
            resolutionMode: string;
            environmentSummary: string;
            consequenceClass?: string;
            projectRoot?: string | null;
            model?: string;
          }): void {
            const context: ResolvedContext = {
              intent: input.intent,
              resolutionMode: input.resolutionMode,
              environmentSummary: input.environmentSummary,
              ...(input.consequenceClass ? { consequenceClass: input.consequenceClass } : {}),
              workSessionId: input.sessionId,
              ...(input.projectRoot ? { projectRoot: input.projectRoot } : {}),
              timestamp: Date.now(),
            };

            if (!isTransitionCaptureDisabled()) {
              context.actionCapture = (async () => {
                const before = await captureRuntimeSnapshot({
                  correlationId: input.invocationId,
                  projectRoot: input.projectRoot,
                });
                const result = recordAction({
                  sessionId: input.sessionId,
                  invocationId: input.invocationId,
                  surface: "overlay",
                  intent: input.intent,
                  resolutionMode: input.resolutionMode,
                  model: input.model,
                  appSummary: input.environmentSummary,
                  ...(before ? { stateBeforeId: before.id } : {}),
                  ...(input.projectRoot ? { repositoryRoot: input.projectRoot } : {}),
                });
                if (!result.ok) console.warn("[Flyd Core] Transition action capture rejected:", result.rejection);
              })().catch((error) => {
                console.warn("[Flyd Core] Transition action capture failed:", (error as Error).message);
              });
            }

            resolvedContexts.set(input.invocationId, context);
          }
          '''
              text = text.replace(marker, helper, 1)

          # Compound-NL boundary: replace the local context+action pair.
          compound_pattern = re.compile(
              r'''\s*resolvedContexts\.set\(parsed\.invocation_id, \{\n'''
              r'''\s*intent: parsed\.intent,\n'''
              r'''\s*resolutionMode: "requires_augment",\n'''
              r'''\s*environmentSummary: parsed\.environment\.application\?\.name \?\? "",\n'''
              r'''\s*timestamp: Date\.now\(\),\n'''
              r'''\s*\}\);\n\n'''
              r'''\s*try \{\n'''
              r'''\s*recordAction\(\{.*?\n\s*\}\);\n'''
              r'''\s*\} catch \(error\) \{\n'''
              r'''\s*console\.warn\("\[Flyd Core\] Transition action capture failed:", \(error as Error\)\.message\);\n'''
              r'''\s*\}\n''',
              re.S,
          )
          compound_replacement = '''
                const repoInfo = resolveRepositoryFromPath(parsed.environment?.document_path);
                stageOverlayTransition({
                  invocationId: parsed.invocation_id,
                  sessionId: parsed.work_session_id ?? parsed.conversation_id ?? parsed.invocation_id,
                  intent: parsed.intent,
                  resolutionMode: "requires_augment",
                  environmentSummary: `${parsed.environment.application?.bundle_id || "unknown"} — ${parsed.environment.focused_element?.role || "unknown"}`,
                  projectRoot: repoInfo.root,
                });
          '''
          text, compound_count = compound_pattern.subn(compound_replacement, text, count=1)

          # Work-intelligence path had no transition action at all.
          wi_pattern = re.compile(
              r'''\s*resolvedContexts\.set\(parsed\.invocation_id, \{\n'''
              r'''\s*intent: parsed\.intent,\n'''
              r'''\s*resolutionMode: mode,\n'''
              r'''\s*environmentSummary: `\$\{parsed\.environment\.application\?\.bundle_id \|\| "unknown"\} — \$\{parsed\.environment\.focused_element\?\.role \|\| "unknown"\}`,\n'''
              r'''\s*workSessionId: wiResult\.workSessionId,\n'''
              r'''\s*timestamp: Date\.now\(\),\n'''
              r'''\s*\}\);'''
          )
          wi_replacement = '''
              const wiRepoInfo = resolveRepositoryFromPath(parsed.environment?.document_path);
              stageOverlayTransition({
                invocationId: parsed.invocation_id,
                sessionId: wiResult.workSessionId,
                intent: parsed.intent,
                resolutionMode: mode,
                environmentSummary: `${parsed.environment.application?.bundle_id || "unknown"} — ${parsed.environment.focused_element?.role || "unknown"}`,
                projectRoot: wiRepoInfo.root,
                model: config.model || undefined,
              });'''
          text, wi_count = wi_pattern.subn(wi_replacement, text, count=1)

          # Normal resolver boundary.
          normal_pattern = re.compile(
              r'''\s*resolvedContexts\.set\(parsed\.invocation_id, \{\n'''
              r'''\s*intent: parsed\.intent,\n'''
              r'''\s*resolutionMode: resolution\.mode,\n'''
              r'''\s*environmentSummary: `\$\{parsed\.environment\.application\?\.bundle_id \|\| "unknown"\} — \$\{parsed\.environment\.focused_element\?\.role \|\| "unknown"\}`,\n'''
              r'''\s*consequenceClass: resolution\.consequence\?\.class,\n'''
              r'''\s*workSessionId,\n'''
              r'''\s*timestamp: Date\.now\(\),\n'''
              r'''\s*\}\);\n\n'''
              r'''\s*try \{\n'''
              r'''\s*recordAction\(\{.*?\n\s*\}\);\n'''
              r'''\s*\} catch \(error\) \{\n'''
              r'''\s*console\.warn\("\[Flyd Core\] Transition action capture failed:", \(error as Error\)\.message\);\n'''
              r'''\s*\}\n''',
              re.S,
          )
          normal_replacement = '''
            const transitionRepoInfo = resolveRepositoryFromPath(parsed.environment?.document_path);
            stageOverlayTransition({
              invocationId: parsed.invocation_id,
              sessionId: workSessionId,
              intent: parsed.intent,
              resolutionMode: resolution.mode,
              environmentSummary: `${parsed.environment.application?.bundle_id || "unknown"} — ${parsed.environment.focused_element?.role || "unknown"}`,
              consequenceClass: resolution.consequence?.class,
              projectRoot: transitionRepoInfo.root,
              model: config.model || undefined,
            });
          '''
          text, normal_count = normal_pattern.subn(normal_replacement, text, count=1)

          # Outcome boundary: await the before capture, then snapshot after state and link it.
          outcome_pattern = re.compile(
              r'''\s*try \{\n'''
              r'''\s*recordNextState\(\{\n'''
              r'''\s*sessionId: resolved\?\.workSessionId,\n'''
              r'''\s*invocationId: outcome\.invocationId,\n'''
              r'''\s*origin: "user",\n'''
              r'''\s*signal: outcome\.status as "succeeded" \| "rejected" \| "failed" \| "cancelled",\n'''
              r'''\s*correction: outcome\.correction \?\? undefined,\n'''
              r'''\s*causalComplete: Boolean\(resolved\),\n'''
              r'''\s*\}\);\n'''
              r'''\s*\} catch \(error\) \{\n'''
              r'''\s*console\.warn\("\[Flyd Core\] Transition next-state capture failed:", \(error as Error\)\.message\);\n'''
              r'''\s*\}\n'''
          )
          outcome_replacement = '''
            const captureOutcomeTransition = async () => {
              if (resolved?.actionCapture) await resolved.actionCapture;
              const after = resolved && !isTransitionCaptureDisabled()
                ? await captureRuntimeSnapshot({
                    correlationId: outcome.invocationId,
                    projectRoot: resolved.projectRoot,
                  })
                : null;
              const result = recordNextState({
                sessionId: resolved?.workSessionId,
                invocationId: outcome.invocationId,
                origin: "user",
                signal: outcome.status as "succeeded" | "rejected" | "failed" | "cancelled",
                correction: outcome.correction ?? undefined,
                causalComplete: Boolean(resolved),
                ...(after ? { stateAfterId: after.id } : {}),
              });
              if (!result.ok) console.warn("[Flyd Core] Transition next-state capture rejected:", result.rejection);
            };
            void captureOutcomeTransition().catch((error) => {
              console.warn("[Flyd Core] Transition next-state capture failed:", (error as Error).message);
            });
          '''
          text, outcome_count = outcome_pattern.subn(outcome_replacement, text, count=1)

          counts = {
              'compound': compound_count,
              'work_intelligence': wi_count,
              'normal': normal_count,
              'outcome': outcome_count,
          }
          missing = [name for name, count in counts.items() if count != 1]
          if missing:
              raise SystemExit(f'Expected one replacement for each boundary; got {counts}')

          path.write_text(text)

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text()
          ci = ci.replace(
              'npx vitest run src/planning/__tests__/world-model.test.ts src/__tests__/memory-gate.test.ts',
              'npx vitest run src/planning/__tests__/world-model.test.ts src/planning/__tests__/runtime-capture.test.ts src/__tests__/memory-gate.test.ts',
              1,
          )
          ci_path.write_text(ci)
          PY

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli/src/server.ts .github/workflows/ci.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat(planning): link overlay transitions to world snapshots"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
