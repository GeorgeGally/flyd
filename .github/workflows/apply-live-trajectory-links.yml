name: Apply live trajectory links

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply-live-trajectory-links.yml'
      - 'cli/src/planning/runtime-capture.ts'
      - 'cli/src/planning/__tests__/runtime-capture.test.ts'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Wire explicit runtime boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          server_path = Path('cli/src/server.ts')
          text = server_path.read_text()
          if 'captureRuntimeSnapshot' not in text:
              text = text.replace(
                  'import { recordAction, recordNextState } from "./transitions/writer.js";',
                  'import { recordAction, recordNextState, isTransitionCaptureDisabled } from "./transitions/writer.js";\nimport { captureRuntimeSnapshot } from "./planning/runtime-capture.js";',
                  1,
              )

              old = 'const resolvedContexts = new Map<string, { intent: string; resolutionMode: string; environmentSummary: string; consequenceClass?: string; workSessionId?: string; timestamp: number }>();'
              new = '''interface ResolvedContext {
            intent: string;
            resolutionMode: string;
            environmentSummary: string;
            consequenceClass?: string;
            workSessionId?: string;
            projectRoot?: string;
            actionCapture?: Promise<void>;
            timestamp: number;
          }
          const resolvedContexts = new Map<string, ResolvedContext>();'''
              assert old in text
              text = text.replace(old, new, 1)

              marker = 'const completedDelegations = new Map<string, { completion: DelegationCompletion; timestamp: number }>();\n\n'
              helper = '''const completedDelegations = new Map<string, { completion: DelegationCompletion; timestamp: number }>();

          function stageOverlayTransition(input: {
            invocationId: string;
            sessionId: string;
            intent: string;
            resolutionMode: string;
            environmentSummary: string;
            consequenceClass?: string;
            projectRoot?: string | null;
            model?: string;
          }): void {
            const context: ResolvedContext = {
              intent: input.intent,
              resolutionMode: input.resolutionMode,
              environmentSummary: input.environmentSummary,
              ...(input.consequenceClass ? { consequenceClass: input.consequenceClass } : {}),
              workSessionId: input.sessionId,
              ...(input.projectRoot ? { projectRoot: input.projectRoot } : {}),
              timestamp: Date.now(),
            };

            if (!isTransitionCaptureDisabled()) {
              context.actionCapture = (async () => {
                const before = await captureRuntimeSnapshot({
                  correlationId: input.invocationId,
                  projectRoot: input.projectRoot,
                });
                const result = recordAction({
                  sessionId: input.sessionId,
                  invocationId: input.invocationId,
                  surface: "overlay",
                  intent: input.intent,
                  resolutionMode: input.resolutionMode,
                  model: input.model,
                  appSummary: input.environmentSummary,
                  ...(before ? { stateBeforeId: before.id } : {}),
                  ...(input.projectRoot ? { repositoryRoot: input.projectRoot } : {}),
                });
                if (!result.ok) {
                  console.warn("[Flyd Core] Transition action capture rejected:", result.rejection);
                }
              })().catch((error) => {
                console.warn("[Flyd Core] Transition action capture failed:", (error as Error).message);
              });
            }

            resolvedContexts.set(input.invocationId, context);
          }

          '''
              assert marker in text
              text = text.replace(marker, helper, 1)

              old = '''        resolvedContexts.set(parsed.invocation_id, {
                  intent: parsed.intent,
                  resolutionMode: "requires_augment",
                  environmentSummary: parsed.environment.application?.name ?? "",
                  timestamp: Date.now(),
                });

                try {
                  recordAction({
                    sessionId: parsed.work_session_id ?? parsed.conversation_id ?? parsed.invocation_id,
                    invocationId: parsed.invocation_id,
                    surface: "overlay",
                    intent: parsed.intent,
                    resolutionMode: "requires_augment",
                    appSummary: `${parsed.environment.application?.bundle_id || "unknown"} — ${parsed.environment.focused_element?.role || "unknown"}`,
                  });
                } catch (error) {
                  console.warn("[Flyd Core] Transition action capture failed:", (error as Error).message);
                }
          '''
              new = '''        const repoInfo = resolveRepositoryFromPath(parsed.environment?.document_path);
                stageOverlayTransition({
                  invocationId: parsed.invocation_id,
                  sessionId: parsed.work_session_id ?? parsed.conversation_id ?? parsed.invocation_id,
                  intent: parsed.intent,
                  resolutionMode: "requires_augment",
                  environmentSummary: `${parsed.environment.application?.bundle_id || "unknown"} — ${parsed.environment.focused_element?.role || "unknown"}`,
                  projectRoot: repoInfo.root,
                });
          '''
              assert old in text
              text = text.replace(old, new, 1)

              old = '''      resolvedContexts.set(parsed.invocation_id, {
                intent: parsed.intent,
                resolutionMode: mode,
                environmentSummary: `${parsed.environment.application?.bundle_id || "unknown"} — ${parsed.environment.focused_element?.role || "unknown"}`,
                workSessionId: wiResult.workSessionId,
                timestamp: Date.now(),
              });
          '''
              new = '''      const repoInfo = resolveRepositoryFromPath(parsed.environment?.document_path);
              stageOverlayTransition({
                invocationId: parsed.invocation_id,
                sessionId: wiResult.workSessionId,
                intent: parsed.intent,
                resolutionMode: mode,
                environmentSummary: `${parsed.environment.application?.bundle_id || "unknown"} — ${parsed.environment.focused_element?.role || "unknown"}`,
                projectRoot: repoInfo.root,
                model: config.model || undefined,
              });
          '''
              assert old in text
              text = text.replace(old, new, 1)

              old = '''    resolvedContexts.set(parsed.invocation_id, {
                intent: parsed.intent,
                resolutionMode: resolution.mode,
                environmentSummary: `${parsed.environment.application?.bundle_id || "unknown"} — ${parsed.environment.focused_element?.role || "unknown"}`,
                consequenceClass: resolution.consequence?.class,
                workSessionId,
                timestamp: Date.now(),
              });

              try {
                recordAction({
                  sessionId: workSessionId,
                  invocationId: parsed.invocation_id,
                  surface: "overlay",
                  intent: parsed.intent,
                  resolutionMode: resolution.mode,
                  model: config.model || undefined,
                  appSummary: `${parsed.environment.application?.bundle_id || "unknown"} — ${parsed.environment.focused_element?.role || "unknown"}`,
                });
              } catch (error) {
                console.warn("[Flyd Core] Transition action capture failed:", (error as Error).message);
              }
          '''
              new = '''    const transitionRepoInfo = resolveRepositoryFromPath(parsed.environment?.document_path);
              stageOverlayTransition({
                invocationId: parsed.invocation_id,
                sessionId: workSessionId,
                intent: parsed.intent,
                resolutionMode: resolution.mode,
                environmentSummary: `${parsed.environment.application?.bundle_id || "unknown"} — ${parsed.environment.focused_element?.role || "unknown"}`,
                consequenceClass: resolution.consequence?.class,
                projectRoot: transitionRepoInfo.root,
                model: config.model || undefined,
              });
          '''
              assert old in text
              text = text.replace(old, new, 1)

              old = '''  try {
              recordNextState({
                sessionId: resolved?.workSessionId,
                invocationId: outcome.invocationId,
                origin: "user",
                signal: outcome.status as "succeeded" | "rejected" | "failed" | "cancelled",
                correction: outcome.correction ?? undefined,
                causalComplete: Boolean(resolved),
              });
            } catch (error) {
              console.warn("[Flyd Core] Transition next-state capture failed:", (error as Error).message);
            }
          '''
              new = '''  const captureOutcomeTransition = async () => {
              if (resolved?.actionCapture) await resolved.actionCapture;
              const after = resolved && !isTransitionCaptureDisabled()
                ? await captureRuntimeSnapshot({
                    correlationId: outcome.invocationId,
                    projectRoot: resolved.projectRoot,
                  })
                : null;
              const result = recordNextState({
                sessionId: resolved?.workSessionId,
                invocationId: outcome.invocationId,
                origin: "user",
                signal: outcome.status as "succeeded" | "rejected" | "failed" | "cancelled",
                correction: outcome.correction ?? undefined,
                causalComplete: Boolean(resolved),
                ...(after ? { stateAfterId: after.id } : {}),
              });
              if (!result.ok) {
                console.warn("[Flyd Core] Transition next-state capture rejected:", result.rejection);
              }
            };
            void captureOutcomeTransition().catch((error) => {
              console.warn("[Flyd Core] Transition next-state capture failed:", (error as Error).message);
            });
          '''
              assert old in text
              text = text.replace(old, new, 1)
              server_path.write_text(text)

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text()
          old_ci = 'npx vitest run src/planning/__tests__/world-model.test.ts src/__tests__/memory-gate.test.ts'
          new_ci = 'npx vitest run src/planning/__tests__/world-model.test.ts src/planning/__tests__/runtime-capture.test.ts src/__tests__/memory-gate.test.ts'
          if old_ci in ci:
              ci_path.write_text(ci.replace(old_ci, new_ci, 1))
          PY
      - name: Commit integration
        run: |
          if git diff --quiet -- cli/src/server.ts .github/workflows/ci.yml; then
            echo "Integration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cli/src/server.ts .github/workflows/ci.yml
          git commit -m "feat(planning): link overlay transitions to world snapshots"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
